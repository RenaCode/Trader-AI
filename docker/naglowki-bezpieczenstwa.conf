# Naglowki bezpieczenstwa aplikacji web. Wydzielone do `include`, bo nginx
# NIE DZIEDZICZY `add_header` z poziomu nadrzednego, gdy na poziomie biezacym
# jest chocby jedna wlasna dyrektywa `add_header`.
#
# Do 2026-09-23 komplet stal wylacznie w bloku `server`, a `location /assets/`
# mial wlasny `add_header Cache-Control ...` - i przez to zadnego z ponizszych.
# `/assets/` to miejsce, z ktorego Vite serwuje CALY kod JS i CSS aplikacji,
# wiec polityka opisana w konfiguracji jako obowiazujaca dla calej aplikacji
# nie obowiazywala akurat tam, gdzie jest kod. Odpowiedz z
# /assets/index-<hash>.js szla bez `nosniff`, a `frame-ancestors 'none'` i
# `X-Frame-Options` nie chronily zadnego zasobu z tej sciezki.
#
# Powtarzanie kompletu w kazdym bloku byloby tym samym bledem odlozonym
# w czasie: nastepny blok z wlasnym `add_header` znowu wypadlby po cichu.
# Plik jest jeden, wiec dopisanie naglowka dziala wszedzie, gdzie jest
# `include`, a tests/test_naglowki_nginx.py pilnuje, ze `include` jest
# w kazdym bloku majacym wlasny `add_header`.

# HSTS ustawia Traefik na krawedzi TLS, ale powtorzenie tutaj nie szkodzi
# i chroni przy zmianie topologii.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# CSP dopasowany do realnych zrodel tej aplikacji:
#   script-src 'self'      - Vite emituje zewnetrzne pliki JS z hashem, zero inline
#   style-src 'unsafe-inline' - komponenty uzywaja atrybutu style={{...}} (wykresy SVG)
#   font-src fonts.gstatic - Inter / Outfit / JetBrains Mono z Google Fonts
#   connect-src 'self'     - fetch idzie wylacznie do /api na tej samej domenie
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
