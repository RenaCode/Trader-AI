server {
    # 8080: nginx-unprivileged nie ma prawa do portow < 1024 (web.Dockerfile).
    listen 8080;
    server_name _;
    server_tokens off;

    # Naglowki bezpieczenstwa - tresc w osobnym pliku, bo musi sie powtorzyc
    # w kazdym bloku, ktory ma wlasny `add_header` (patrz naglowek tamtego
    # pliku i `location /assets/` nizej).
    include /etc/nginx/naglowki-bezpieczenstwa.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # index.html nigdy z pamieci podrecznej przegladarki (2026-10-14). Bez
    # Cache-Control przegladarka trzymala strone heurystycznie; przy SSO taka
    # strona omija forwardAuth Traefika (zamiast portalu Authelii ekran
    # logowania aplikacji), a po wdrozeniu - stary frontend. `expires epoch`
    # daje `Cache-Control: no-cache` BEZ add_header, wiec naglowki
    # bezpieczenstwa z bloku `server` sa dziedziczone. try_files i `index`
    # koncza sie wewnetrznym przekierowaniem na /index.html, wiec trafiaja tu.
    location = /index.html {
        root /usr/share/nginx/html;
        expires epoch;
    }

    # Zasoby z hashem w nazwie sa niezmienne - mozna je cache'owac agresywnie.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        # Wlasny add_header ZRYWA dziedziczenie naglowkow z bloku `server`,
        # wiec komplet musi byc tu powtorzony - inaczej caly kod JS i CSS
        # aplikacji idzie bez CSP, HSTS i nosniff.
        include /etc/nginx/naglowki-bezpieczenstwa.conf;
        add_header Cache-Control "public, immutable";
    }

    location /api {
        proxy_pass http://trader-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
