server {
    listen 80;
    server_name _;
    server_tokens off;

    # Naglowki bezpieczenstwa. HSTS ustawia Traefik na krawedzi TLS, ale
    # powtorzenie tutaj nie szkodzi i chroni przy zmianie topologii.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP dopasowany do realnych zrodel tej aplikacji:
    #   script-src 'self'      - Vite emituje zewnetrzne pliki JS z hashem, zero inline
    #   style-src 'unsafe-inline' - komponenty uzywaja atrybutu style={{...}} (wykresy SVG)
    #   font-src fonts.gstatic - Inter / Outfit / JetBrains Mono z Google Fonts
    #   connect-src 'self'     - fetch idzie wylacznie do /api na tej samej domenie
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Zasoby z hashem w nazwie sa niezmienne - mozna je cache'owac agresywnie.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api {
        proxy_pass http://trader-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
