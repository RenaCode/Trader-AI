{{- if .Values.trainerCron.enabled }}
# Trener walk-forward jako zadanie cykliczne, nie jako proces w Deploymencie.
#
# Poprzednia wersja była pętlą `while true; do train; sleep 86400; done` wewnątrz
# Deploymentu. Każde wdrożenie — także takie, które trenera w ogóle nie dotyczyło —
# restartowało pod i zabijało trwające obliczenia w połowie. Zdarzyło się to
# trzykrotnie i za każdym razem kosztowało kilkadziesiąt minut, przy czym pierwsze
# dwa razy zdiagnozowałem to jako "trening nie kończy się", a nie jako "wdrożenie
# go zabiło".
#
# Zadanie cykliczne jest odporne: raz uruchomione dobiega końca niezależnie od
# tego, co dzieje się z Deploymentami. `concurrencyPolicy: Forbid` gwarantuje,
# że dwa treningi nie policzą się równolegle na tej samej wersji modelu.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "trader.fullname" . }}-trainer
  labels: {{- include "trader.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.trainerCron.schedule | quote }}
  # Strefa jawnie - patrz `strefaCzasowa` w values.yaml.
  timeZone: {{ required "strefaCzasowa musi byc ustawiona wprost" .Values.strefaCzasowa | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # Sprzatanie zakonczonych Jobow - `sprzatanieZadan` w values.yaml.
      ttlSecondsAfterFinished: {{ .Values.sprzatanieZadan.trainer }}
      # JEDNA POWTORKA (audyt 2026-10-09, W-4). Przy `backoffLimit: 0` planowy
      # przebieg 04.10 padl na `connection refused` w pierwszej sekundzie poda
      # (opoznienie kube-routera; bramka migracji z 05.10 czeka na baze, ale
      # nie na kazda przyczyne) i zadanie TYGODNIOWE oznaczalo tydzien bez
      # nowej wersji: demo gra v171 policzonym przy starym cenniku do 11.10.
      # Powtorka jest bezpieczna - trener bywa powtarzany recznie tym samym
      # szablonem (`--from=cronjob`) - i miesci sie w `activeDeadlineSeconds`
      # nizej, bo limit czasu obejmuje WSZYSTKIE proby Joba: awaria po trzech
      # godzinach nie dostanie drugiej. Wiecej niz jedna nie: blad, ktory wraca
      # dwa razy, jest bledem kodu albo danych, nie sieci.
      backoffLimit: 1
      # TWARDY LIMIT CZASU PRZEBIEGU - 3 godziny.
      #
      # Bez niego `concurrencyPolicy: Forbid` dziala przeciwko nam: zawieszone
      # zapytanie do bazy albo zablokowany socket trzymaja Joba bez konca,
      # a kazdy kolejny dobowy przebieg jest po cichu POMIJANY. Model zamarza
      # na ostatniej policzonej wersji i nie zglasza tego NIC - czujka stanu
      # nauki (`--co stan-nauki`) porownuje dwa ostatnie wpisy dziennika
      # i melduje cisze, bo stan, ktory stoi, sie nie zmienia
      # (services/engine/dozor.py, "Bez zmiany istotnej — cisza").
      #
      # SKAD 10800, a nie 2400 ani 86400:
      #   * przebieg liczyl SEKWENCYJNIE dwa horyzonty crypto (`horyzonty:
      #     ["4h","1h"]`; od 2026-10-18 tylko 4h) plus equity,
      #     a pojedynczy trening jest w repo opisany jako "dziesiatki minut"
      #     (values.yaml, workers.trainer) - gorny szacunek legalnego przebiegu
      #     to wiec okolo dwoch godzin, a limit ma zabijac ZAWIESZENIE,
      #     nie dlugie liczenie: 3 h zostawia okolo 50% zapasu,
      #   * 40 minut miedzy trenerem (04:40) a proba pozarowa (05:20) NIE jest
      #     tu gorna granica: proba to osobny CronJob z wlasnym `Forbid`,
      #     dzieli z trenerem tylko wezel. Przyciecie limitu do tego okna
      #     zabijaloby legalne przebiegi drugiego horyzontu,
      #   * 3 h to nadal osmiokrotnie mniej niz doba, wiec zawieszony przebieg
      #     umiera dlugo przed nastepnym terminem i `Forbid` nie zjada zadnego.
      #
      # LICZBA JEST DO SKORYGOWANIA POMIAREM, nie do przepisywania w ciemno -
      # polecenie w raporcie (czas trwania ostatnich Jobow trenera).
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels: {{- include "trader.etykietyZadania" . | nindent 12 }}
        spec:
          restartPolicy: Never
          # Obrazy tradera w GHCR sa prywatne - bez sekretu Job ruszalby tylko
          # wtedy, gdy obraz akurat lezy w cache wezla.
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          # Bez tokenu API klastra i bez roota - patrz `trader.podBezUprawnien`
          # w _helpers.tpl. Zadanie nie rozmawia z API Kubernetesa.
          automountServiceAccountToken: false
          {{- include "trader.podBezUprawnien" . | nindent 10 }}
          # BRAMKA MIGRACJI, TA SAMA CO PRZY WORKERACH (poprawka A, 2026-10-05).
          #
          # `przebieg_zadania.py` czeka na port bazy najwyzej 60 s, a przy
          # starszym schemacie odmawia od razu, kodem 3. Dla zadania, ktore
          # chodzi RAZ W TYGODNIU, kazda z tych dwoch rzeczy kosztuje caly
          # tydzien bez nowej wersji: 2026-10-04 tor 4h padl na `connection
          # refused` (opoznienie kube-routera), a wdrozenie z migracja w trakcie
          # niedzielnego okna konczyloby sie odmowa zamiast poczekaniem.
          # Kontener startowy czeka do 600 s - na baze I na migracje - i dopiero
          # po tym limicie pada glosno; rola ta sama co trenera (silnik).
          initContainers:
            {{- include "trader.bramkaMigracji" (dict "ctx" $ "rola" "silnik") | nindent 12 }}
          containers:
            - name: trainer
              image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
              imagePullPolicy: {{ .Values.api.image.pullPolicy }}
              {{- include "trader.kontenerBezUprawnien" . | nindent 14 }}
              # Trener, a po nim dozor - ZAWSZE, takze gdy trener zawiodl.
              # Kod wyjscia idzie do dozoru, bo przebieg zakonczony bledem nie
              # dopisuje wiersza do dziennika stanu: bez tej informacji dozor
              # porownalby dwa stare wpisy, nie zobaczyl roznicy i zamilkl,
              # a awaria wygladalaby jak spokoj.
              # PRZEZ `przebieg_zadania.py` (F-8.4, migracja 0074): po zakonczeniu
              # dopisuje wiersz do `risk.job_run`, ktory czyta `dozor --co zadania`.
              # Kod wyjscia i sygnaly ida bez zmian do polecenia ponizej.
              command:
                - python
                - services/engine/przebieg_zadania.py
                - --nazwa
                - trainer
                - "--"
                - sh
                - -c
                - |
                  # KOD 3 (`train.KOD_TOR_NIEGOTOWY`) NIE ZAPALA ZADANIA - I TO
                  # JEST CALA POPRAWKA Z 2026-09-25.
                  #
                  # ZMIERZONE NA PRODUKCJI TEGO DNIA: tor crypto konczyl sie
                  # wynikiem ("Stan: learning, 26/38 okien"), a nastepnie tor
                  # equity przerywal na pustym uniwersum (`tradeable = false` na
                  # wszystkich 21 akcjach, ustawione SWIADOMIE migracja 0047,
                  # z adnotacja "wlaczenie to osobna migracja PO pierwszym
                  # walk-forwardzie"). Kod 2 szedl do wspolnego `RC`, wiec caly
                  # Job byl czerwony, ArgoCD stalo trwale `Degraded`, a to samo
                  # padniete zadanie wracalo kazdej nocy.
                  #
                  # Czerwony powtarzany codziennie o stanie, ktory sie nie zmienia
                  # i o ktorym ktos JUZ zdecydowal, to ten sam wzorzec, ktory
                  # 2026-09-12 dal 144 padniete Joby na dobe i - jak mowi
                  # docstring services/engine/dozor.py - "uczy odklikiwac cala
                  # kategorie". Zabieral przy tym jedyny sygnal, jakim tor crypto
                  # dysponuje.
                  #
                  # CZEGO TA ZMIANA NIE ROBI: nie wycisza bramki. `train.py` dalej
                  # odmawia, dalej wypisuje PRZERWANO z powodem i poleceniem
                  # sprawdzajacym, a na koncu tego skryptu stoi podsumowanie
                  # wymieniajace kazdy nieuruchomiony tor. KAZDY inny kod
                  # niezerowy - 1, 2, traceback - zapala Joba tak jak dotad.
                  RC=0
                  # Kody per tor: dozor silnika X ma dostac kod trenera SILNIKA X.
                  # Do 2026-09-25 oba dozory dostawaly wspolne `$RC`, wiec awaria
                  # crypto kazala dozorowi equity oglosic "Trener zawiodl
                  # (equity)" - alarm o torze, ktory sie nie wywrocil.
                  #
                  # KOD 3 TEZ IDZIE DO DOZORU (2026-10-03). Do tej daty trafial
                  # wylacznie do `NIEGOTOWE`, a dozor dostawal `--kod-trenera 0`:
                  # tor equity stal na bramce podzialow (0/20 instrumentow ze
                  # znacznikiem) i jedynym sladem bylo echo w logu Joba, ktorego
                  # nikt nie czyta. Dozor zamienia trwajacy kod 3 w ostrzezenie
                  # z wlasnym rytmem (services/engine/dozor.py, KOD_TOR_NIEGOTOWY),
                  # a Job dalej NIE robi sie od niego czerwony - `RC` go nie widzi.
                  # Awaria (kod inny niz 0 i 3) w tym samym torze wygrywa z kodem 3:
                  # "padlo" jest pilniejsze niz "nie bylo czego liczyc".
                  RC_CRYPTO=0
                  RC_EQUITY=0
                  NIEGOTOWE=""
                  # MODEL WYPELNIEN PESYMISTYCZNY (`trainerCron.pesymistyczna`,
                  # renacode-infra: docs/projekty/trader/hipotezy.md H-5): `--egzekucja-pesymistyczna
                  # --opoznienie N` dla KAZDEGO toru, crypto i equity. Pierwsza
                  # wersja po wlaczeniu ma nowe klucze `params`, wiec zostaje
                  # `candidate` - flaga nie promuje niczego sama.
                  # `--wypelnialnosc-docelowa` (H-10) tylko w torach crypto: to
                  # pomiar wejsc demo crypto, equity go nie ma.
                  {{/*
                  TOR CRYPTO TYLKO PRZY `torCrypto.enabled` (2026-10-18). Po
                  wylaczeniu toru `history`/`features` crypto nie chodza, wiec
                  trening liczylby sie na danych, ktore przestaly przybywac,
                  a seria H-4 i dryf mierzylyby zamrozony panel. Dotyczy tez
                  dozoru stanu nauki, dryfu i testu w przod toru crypto nizej.
                  */}}
                  {{- if .Values.torCrypto.enabled }}
                  {{- range $h := .Values.trainerCron.horyzonty | default (list .Values.trainerCron.bar) }}
                  echo "===== horyzont {{ $h }} ====="
                  python services/engine/train.py                     --bar {{ $h | quote }}                     --days {{ $.Values.trainerCron.days | quote }}                     --od {{ $.Values.trainerCron.od | quote }}                     --trials {{ $.Values.trainerCron.trials | quote }}                     --kind {{ $.Values.trainerCron.kind | default "spot_eu" | quote }}                     {{- if $.Values.trainerCron.limit }} --limit{{ end }}                     {{- if $.Values.trainerCron.pesymistyczna }} --egzekucja-pesymistyczna --opoznienie {{ required "trainerCron.opoznienie musi byc ustawione przy pesymistyczna" $.Values.trainerCron.opoznienie | quote }}{{ end }}                     {{- if $.Values.trainerCron.wypelnialnoscDocelowa }} --wypelnialnosc-docelowa {{ $.Values.trainerCron.wypelnialnoscDocelowa | quote }}{{ end }}                     {{- if $.Values.trainerCron.spreadBps }} --spread-bps {{ $.Values.trainerCron.spreadBps }}{{- if $.Values.trainerCron.spreadObcaKsiega }} --spread-obca-ksiega{{ end }}{{ end }}
                  K=$?
                  if [ "$K" = 3 ]; then
                    NIEGOTOWE="${NIEGOTOWE}crypto/{{ $h }} "
                    {{- if eq $h $.Values.trainerCron.bar }}
                    # Kod 3 idzie do DOZORU, nie do `RC` - patrz `RC_CRYPTO` wyzej.
                    # Tylko dla horyzontu, ktory ten dozor ocenia: dozor czyta
                    # dziennik per (engine, bar), wiec 3 z toru 1h kazalby mu
                    # meldowac niegotowosc toru 4h, ktory sie policzyl.
                    [ "$RC_CRYPTO" != 0 ] || RC_CRYPTO=3
                    {{- end }}
                  elif [ "$K" != 0 ]; then RC=$K; RC_CRYPTO=$K
                  fi
                  {{- end }}
                  {{- end }}
                  {{- if .Values.trainerCron.equity.enabled }}
                  # ---------------------------------------------- TOR EQUITY
                  #
                  # OSOBNY SILNIK, wiec osobny model, osobny licznik hipotez
                  # i osobny stan nauki - nie jest to kolejny horyzont krypto.
                  # Wlasny `--kind`, bo cennik Alpaki (zero prowizji) nie ma nic
                  # wspolnego z cennikiem bybit.eu; tor liczony stawka Bybita
                  # mierzylby oplaty, ktorych to konto nie placi.
                  #
                  # AWARIE ZBIERAJA SIE DO TEGO SAMEGO `RC`. Osobne zadanie
                  # dawaloby druga kopie harmonogramu, drugi obraz do podbicia
                  # i druga sciezke, ktora moze cicho zniknac - a przede
                  # wszystkim NIE rozwiazaloby problemu, tylko go przenosilo:
                  # Job equity padalby co noc z dokladnie tego samego powodu.
                  # Rozdzielony jest wiec KOD, nie zadanie (patrz gora skryptu).
                  {{- range $h := .Values.trainerCron.equity.horyzonty }}
                  echo "===== equity, horyzont {{ $h }} ====="
                  python services/engine/train.py                     --engine equity                     --bar {{ $h | quote }}                     --days {{ $.Values.trainerCron.days | quote }}                     --od {{ $.Values.trainerCron.od | quote }}                     --trials {{ $.Values.trainerCron.trials | quote }}                     --kind {{ $.Values.trainerCron.equity.kind | default "stock" | quote }}                     {{- if $.Values.trainerCron.equity.limit }} --limit{{ end }}                     {{- if $.Values.trainerCron.equity.pesymistyczna }} --egzekucja-pesymistyczna --opoznienie {{ required "trainerCron.equity.opoznienie musi byc ustawione przy pesymistyczna" $.Values.trainerCron.equity.opoznienie | quote }}{{ end }}                     {{- if $.Values.trainerCron.equity.spreadBps }} --spread-bps {{ $.Values.trainerCron.equity.spreadBps }}{{- if $.Values.trainerCron.equity.spreadObcaKsiega }} --spread-obca-ksiega{{ end }}{{ end }}
                  K=$?
                  if [ "$K" = 3 ]; then
                    NIEGOTOWE="${NIEGOTOWE}equity/{{ $h }} "
                    {{- if eq $h (first $.Values.trainerCron.equity.horyzonty) }}
                    # Kod 3 do dozoru - patrz `RC_CRYPTO` wyzej i ten sam warunek
                    # horyzontu przy torze crypto.
                    [ "$RC_EQUITY" != 0 ] || RC_EQUITY=3
                    {{- end }}
                  elif [ "$K" != 0 ]; then RC=$K; RC_EQUITY=$K
                  fi
                  {{- end }}
                  # Dozor stanu nauki dla equity - ten sam powod co dla krypto
                  # nizej: bez niego model traci przewage i NIKT tego nie mowi.
                  python services/engine/dozor.py --engine equity                     --bar {{ (first .Values.trainerCron.equity.horyzonty) | quote }} --kod-trenera $RC_EQUITY
                  E=$?
                  [ "$E" = 0 ] || RC=$E
                  {{- end }}
                  # `--kind` rozpoznaje tor zamkniety wynikiem hipotezy
                  # (services/engine/tory.py, crypto 4h spot_eu po H-9): wtedy
                  # dryf i zmiana struktury zostaja w logu bez powiadomienia,
                  # a awaria trenera i zmiana stanu nauki alarmuja jak dotad.
                  #
                  # Dozor WYLACZNIE dla horyzontu produkcyjnego: tory porownawcze
                  # maja wlasny stan, ale alarm o modelu, ktorym nikt nie handluje,
                  # bylby halasem.
                  #
                  # KOD WYJSCIA DOZORU JEST ZBIERANY, tak samo jak kod trenera.
                  # Do 2026-09-22 nie byl: `exit $RC` nizej niosl WYLACZNIE kod
                  # trenera, wiec wywrocony dozor konczyl sie Jobem ZIELONYM.
                  # Polaczone z brakiem `SECRETS_KEY` w env (nizej) dawalo to
                  # najgorszy mozliwy uklad: model traci przewage -> dozor
                  # probuje powiadomic -> `SecretBox()` rzuca -> zadanie
                  # zielone, ArgoCD zdrowe, powiadomienie nigdy nie wyszlo.
                  # `--co stan-nauki` i `--co dryf` nie sa wolane nigdzie
                  # indziej, wiec byl to CALY nadzor nad jakoscia modelu.
                  {{- if .Values.torCrypto.enabled }}
                  python services/engine/dozor.py --bar {{ .Values.trainerCron.bar | quote }} --kind {{ .Values.trainerCron.kind | default "spot_eu" | quote }} --kod-trenera $RC_CRYPTO
                  D=$?
                  [ "$D" = 0 ] || RC=$D
                  # Czujka stanu TRWALEGO, osobno od czujki zmiany powyzej.
                  # Bez tego wiersza dryf, ktory wszedl wysoko i tam stanal,
                  # jest niewidoczny: dozor stanu nauki zglasza ZMIANE, a stan,
                  # ktory stoi, sie nie zmienia.
                  #
                  # `|| true` ZOSTAJE - i oto dlaczego akurat ta jedna sciezka
                  # ma prawo milczec. `sprawdz_dryf` zwraca 1 jako STAN ("dryf
                  # trwaly, powiadomienie poszlo"), a nie jako awarie przebiegu
                  # (services/engine/dozor.py). Bez `|| true` KAZDY przebieg
                  # z utrzymujacym sie dryfem konczylby sie Jobem czerwonym,
                  # codziennie, przez caly czas trwania problemu - czyli
                  # dokladnie ten wzorzec, ktory w zywotnosc-cron.yaml
                  # wyprodukowal 144 padniete Joby na dobe i nauczyl przewijac
                  # cala kategorie.
                  #
                  # CENA JEST ZNANA I SWIADOMA: `|| true` polyka tak samo
                  # WYWROTKE tej linii, bo traceback tez konczy sie kodem 1
                  # i po kodzie wyjscia nie da sie ich odroznic. Zostaja dwa
                  # zabezpieczenia: traceback jest widoczny w logu Joba, a caly
                  # ten proces dzieli srodowisko i importy z linia `stan-nauki`
                  # wyzej, ktorej kod JEST zbierany - awaria systemowa (brak
                  # `SECRETS_KEY`, martwa baza, zly obraz) wywroci najpierw
                  # tamta i zapali zadanie na czerwono. Rozroznienie stanu od
                  # awarii wlasnym kodem wyjscia nalezy do dozor.py, nie do
                  # tego szablonu.
                  python services/engine/dozor.py --co dryf --bar {{ .Values.trainerCron.bar | quote }} --kind {{ .Values.trainerCron.kind | default "spot_eu" | quote }} || true
                  {{- end }}
                  # TEST W PRZOD H-4 - PO TRENERZE I PO DOZORZE, nigdy przed nimi.
                  #
                  # Liczy WYLACZNIE okna juz zamkniete (tydzien pon-pon UTC) dla
                  # wersji zapisanych PRZED ich poczatkiem, wiec wersja z tego
                  # przebiegu nie wchodzi do zadnej pary policzonej dzisiaj -
                  # kolejnosc chroni tylko log: wynik treningu i alarm dozoru sa
                  # wazniejsze i maja stac pierwsze.
                  #
                  # KODY JAK U TRENERA, NIE `|| true`. Kod 3 (`KOD_NIEGOTOWE`:
                  # para byla, okna nie dalo sie policzyc - brak danych, bramka
                  # uniwersum equity) idzie do podsumowania TORY NIEURUCHOMIONE
                  # i NIE zapala Joba: to stan, ktory wracalby co tydzien.
                  # Przed 2026-10-12 (i w kazdym tygodniu bez pary) skrypt konczy
                  # sie zerem - nie bylo czego liczyc. Kazdy inny kod to awaria
                  # kodu miary i zapala Joba: `|| true` polknalby traceback,
                  # a seria, ktora po cichu przestaje przybywac, jest gorsza od
                  # czerwonego Joba - werdykt H-4 stoi na liczbie okien.
                  {{- if .Values.torCrypto.enabled }}
                  python services/engine/w_przod.py --engine crypto --bar {{ .Values.trainerCron.bar | quote }} --kind {{ .Values.trainerCron.kind | default "spot_eu" | quote }}
                  W=$?
                  if [ "$W" = 3 ]; then NIEGOTOWE="${NIEGOTOWE}w_przod/crypto/{{ .Values.trainerCron.bar }} "
                  elif [ "$W" != 0 ]; then RC=$W
                  fi
                  {{- end }}
                  {{- if .Values.trainerCron.equity.enabled }}
                  # Equity: seria pomocnicza, poza kryterium H-4 (zapisanym dla
                  # crypto 4h) - ta sama miara, osobny model, osobny wynik.
                  python services/engine/w_przod.py --engine equity --bar {{ (first .Values.trainerCron.equity.horyzonty) | quote }} --kind {{ .Values.trainerCron.equity.kind | default "stock" | quote }}
                  W=$?
                  if [ "$W" = 3 ]; then NIEGOTOWE="${NIEGOTOWE}w_przod/equity/{{ first .Values.trainerCron.equity.horyzonty }} "
                  elif [ "$W" != 0 ]; then RC=$W
                  fi
                  {{- end }}
                  # PODSUMOWANIE TOROW NIEURUCHOMIONYCH - GLOSNE MIEJSCE, KTORE
                  # NIE JEST KODEM WYJSCIA.
                  #
                  # Kod 3 nie zapala Joba (uzasadnienie na gorze skryptu), wiec
                  # bramka musi byc widoczna inaczej niz przez `kubectl get jobs`.
                  # Stad blok na KONCU logu, po wszystkich czujkach: jest w kazdym
                  # przebiegu, wymienia tory z nazwy i mowi, czego brakuje.
                  # `kubectl logs job/trader-trainer-... | tail -12` odpowiada na
                  # pytanie "czy equity sie trenuje" bez czytania calosci.
                  #
                  # Blok stoi PRZED `exit`, a nie w galezi `if [ "$RC" = 0 ]`:
                  # przebieg, w ktorym padl tor crypto I zostal nieuruchomiony
                  # tor equity, musi powiedziec oba, a nie tylko pierwsze.
                  if [ -n "$NIEGOTOWE" ]; then
                    echo "================================================================"
                    echo "TORY NIEURUCHOMIONE (kod 3): $NIEGOTOWE"
                    echo "Nic nie policzono i nic nie zapisano dla tych torow."
                    echo "Powod i polecenie sprawdzajace stoja wyzej, w logu toru."
                    echo "Bramke zdejmuje CZLOWIEK: migracja wlaczajaca uniwersum"
                    echo "(tradeable) albo backfill swiec skorygowanych o podzialy"
                    echo "wraz ze znacznikiem w ref.instrument.meta."
                    echo "Kod wyjscia zadania tego NIE niesie swiadomie - inaczej"
                    echo "czerwony wracalby co noc o stanie, o ktorym juz zdecydowano,"
                    echo "i przestalby znaczyc cokolwiek takze dla toru crypto."
                    echo "================================================================"
                  fi
                  exit $RC
              env:
                {{- include "trader.bramkaEnv" $ | nindent 16 }}
                # Trener chodzi rola silnika (migracja 0034): pisze do learn.*,
                # czyta dane rynkowe i cechy, a z ryzykiem nie ma nic wspolnego.
                # Wczesniej mial te sama role co API, wiec mogl zwolnic
                # kill-switcha - w procesie, ktory trwa dziesiatki minut i nikt
                # w niego nie zaglada.
                {{- include "trader.rolaDbEnv" (dict "ctx" $ "rola" "silnik") | nindent 16 }}
                # Z JAKIEGO KODU POLICZONO TEN MODEL.
                #
                # `learn.model_version.git_sha` istnieje od migracji 0006 i przez
                # cały ten czas był NULL-em we wszystkich wierszach, bo w klastrze
                # nie było skąd wziąć commita. Tag obrazu (`sha-<commit>`, nadaje
                # go workflow docker-publish) jest jedynym miejscem, które go zna.
                # Przedrostek `sha-` ścina services/engine/wersja.py — reguła ma
                # jedno miejsce i test, zamiast szablonu bez żadnego z dwóch.
                - name: GIT_SHA
                  value: {{ .Values.api.image.tag | quote }}
                # KLUCZ SZYFRUJACY - BEZ NIEGO DOZOR NIE MA JAK POWIADOMIC.
                #
                # `notify()` (services/api/notifications.py) tworzy `SecretBox()`
                # POZA blokiem `try` i PRZED petla po kanalach, a `SecretBox`
                # bez `SECRETS_KEY` rzuca `RuntimeError`
                # (services/api/security.py). Trener chodzi wiec na tym samym
                # kluczu co proba pozarowa (proba-cron.yaml) - nie dlatego, ze
                # cos szyfruje, tylko dlatego, ze WOLA dozor, a dozor wola
                # `notify()`. Bez tej zmiennej kazde powiadomienie o stanie
                # nauki i o dryfie wywracalo sie na pierwszej linii.
                - name: SECRETS_KEY
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.secretName }}, key: SECRETS_KEY }
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources: {{- toYaml .Values.trainerCron.resources | nindent 16 }}
{{- end }}
