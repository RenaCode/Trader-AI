apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trader.fullname" . }}-api
  labels: {{- include "trader.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 3 }}
  selector:
    matchLabels:
      app: {{ include "trader.fullname" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "trader.fullname" . }}-api
    spec:
      # Proces nie rozmawia z API Kubernetesa (audyt Fable U-8).
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "trader.podBezUprawnien" . | nindent 6 }}
      # Migracje ida jako initContainer, nie jako Job: dzieki temu API nigdy nie
      # wystartuje na schemacie starszym niz jego kod, a ArgoCD nie musi
      # koordynowac kolejnosci Job -> Deployment.
      initContainers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- include "trader.kontenerBezUprawnien" . | nindent 10 }}
          command: ["python", "db/migrate.py"]
          env:
            # Migracje ida rola WLASCICIELA - tylko one moga zmieniac strukture.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: {{ include "trader.databaseUrl" . | quote }}
            # Migrator ustawia tym hasla ROL PROCESOW (poza plikami migracji,
            # zeby nie trafily do repozytorium ani do sumy kontrolnej).
            #
            # To jedyny kontener, ktory widzi je wszystkie naraz - i tak byc
            # musi, bo tylko wlasciciel moze zrobic ALTER ROLE. Gdyby haslo
            # ustawial ktos inny, poswiadczenia dozorcy musialyby trafic do
            # poda, ktory dozorca nie jest.
            {{- include "trader.appDbPasswordEnv" . | nindent 12 }}
            {{- include "trader.rolaHaslaEnv" . | nindent 12 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          # ROOT FILESYSTEM TYLKO DO ODCZYTU (przeglad 2026-10-04, T-13): kod
          # w /app nalezy do roota (api.Dockerfile), a proces nie pisze nic poza
          # /tmp (PYTHONDONTWRITEBYTECODE, brak zapisow plikow w services/api).
          {{- include "trader.kontenerTylkoOdczyt" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          env:
            {{- include "trader.bramkaEnv" $ | nindent 12 }}
            {{- include "trader.appPgPasswordEnv" . | nindent 12 }}
            - name: DATABASE_URL
              value: {{ include "trader.appDatabaseUrl" . | quote }}
            # Klucz do szyfrowania kluczy API gield i sekretow TOTP w bazie.
            - name: SECRETS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: SECRETS_KEY }
            # Poprzedni klucz - ustawiany WYLACZNIE na czas rotacji. Odszyfrowanie
            # probuje najpierw biezacego, potem tego; zapis idzie zawsze biezacym.
            - name: SECRETS_KEY_OLD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: SECRETS_KEY_OLD, optional: true }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: ANTHROPIC_API_KEY, optional: true }
            # Dostawca zapasowy analizy wiadomosci. Anthropic ma pierwszenstwo,
            # gdy oba klucze sa ustawione.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: GEMINI_API_KEY, optional: true }
            {{/*
            TE SAME modele i limity co u workerow. `/api/api-spend` wola
            `limit_dobowy_usd()` we WLASNYM procesie, wiec bez tego bloku
            interfejs pokazywalby limit 5.0 z domyslu kodu, podczas gdy
            wydatki zatrzymywalaby zupelnie inna liczba u workera.
            */}}
            {{- include "trader.llmEnv" . | nindent 12 }}
            - name: CORS_ORIGINS
              value: "https://{{ .Values.ingress.host }}"
            {{- if .Values.sso.enabled }}
            # Zaufanie do `Remote-User` - tylko razem z middleware'ami SSO
            # z ingress.yaml (ten sam przelacznik, values.yaml `sso`).
            - name: SSO_NAGLOWKI
              value: "1"
            # Nazwa grupy Authelii - z Sekretu, nie z values (repo publiczne).
            - name: SSO_GRUPA
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: SSO_GRUPA, optional: true }
            # Grupy tylko do podgladu (rola obcieta do `viewer`), tez z Sekretu.
            - name: SSO_GRUPA_PODGLAD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: SSO_GRUPA_PODGLAD, optional: true }
            - name: SSO_WYLOGUJ_URL
              value: "{{ .Values.sso.wylogujUrl }}?rd=https://{{ .Values.ingress.host }}/"
            {{- else }}
            # Jawne "0" takze bez SSO: `env` ma pierwszenstwo przed `envFrom`, wiec
            # gdyby pod dostal kiedys Sekret przez envFrom, klucz SSO_NAGLOWKI
            # z Sekretu nie wlaczy zaufania do naglowkow bez middleware'u Authelii.
            - name: SSO_NAGLOWKI
              value: "0"
            {{- end }}
          ports:
            - containerPort: 8000
          # DWIE SONDY, DWA PYTANIA - i one nie moga pytac o to samo.
          #
          # GOTOWOSC pyta, czy ten pod ma co oddac: `/api/health` robi
          # `SELECT count(*) FROM schema_migrations`, wiec pod bez bazy zostaje
          # wypisany z Service i wraca sam, gdy baza wroci. Zaleznosc zewnetrzna
          # nalezy wlasnie tutaj.
          #
          # `timeoutSeconds: 5`, bo domyslna jedna sekunda jest progiem na
          # OBCIAZENIE, a nie na awarie: okno kopii (03:17) i trenera (04:40)
          # potrafi wydluzyc odpowiedz bazy ponad sekunde, a wypisanie poda
          # z Service w takiej chwili odcina jedyny widok na system.
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 5
          # ZYWOTNOSC pyta wylacznie o to, czy PROCES zyje - `/api/zywy`
          # (services/api/main.py) nie dotyka bazy ani zadnej innej uslugi.
          #
          # Do 2026-09-22 stalo tu `/api/health` bez `timeoutSeconds`, czyli
          # z domyslna 1 s, i bez `failureThreshold`, czyli z domyslnymi trzema
          # probami: trzy wolne odpowiedzi bazy w ciagu 60 s zabijaly poda API.
          # Restart nie naprawia wolnej bazy, a kontener startowy `migrate`
          # wchodzi wtedy w backoff - przerwa bazy liczona w minutach robila
          # sie niedostepnoscia API liczona w kilku minutach.
          #
          # Oba progi wpisane JAWNIE, mimo ze rowne domyslnym: sonda, ktora
          # zabija kontener, nie ma prawa opierac sie na wartosciach, ktorych
          # nie widac w pliku.
          #
          # HISTORIA OBEJSCIA, ZAMKNIETA 23.09.2026.
          #
          # 22.09.2026, tuz po wdrozeniu, sciezka wrocila TYMCZASOWO na
          # `/api/health`: `/api/zywy` istnial juz w kodzie, ale na produkcji
          # stal obraz `sha-0ea6f54`, ktory go nie zawieral. ArgoCD synchronizuje
          # `charts/` NATYCHMIAST po merge'u, natomiast tag obrazu podbija sie
          # recznie, po zbudowaniu na VPS-ie. Przez te roznice sonda pytala
          # o endpoint, ktorego uruchomiony proces nie znal: 404, trzy probki
          # po 20 s i kubelet zabijal kontener API co niecale poltorej minuty.
          # Stad regula: endpoint w chartcie nie moze wyprzedzac kodu w obrazie.
          #
          # Warunek obejscia WYGASL. Sprawdzone 23.09.2026 przez
          # `git show 40f41e4:services/api/main.py`: commit 40f41e4 - obraz
          # stojacy wtedy na produkcji - zawiera juz `@app.get("/api/zywy")`
          # (services/api/main.py:76), wiec sciezka mogla wrocic na docelowa.
          #
          # Tag w `values.yaml` poszedl od tamtej pory dalej, a kazdy kolejny
          # commit ten endpoint zawiera. CELOWO nie cytujemy tu konkretnego
          # tagu: taki cytat starzeje sie przy KAZDYM wdrozeniu i po chwili
          # opisuje plik, ktorego juz nie ma - czyli sam staje sie tym, przed
          # czym ostrzega akapit wyzej. Stanu pilnuje test
          # `tests/test_chart_nadzor.py::test_zywotnosc_API_nie_pyta_o_baze`,
          # nie ten komentarz.
          #
          # DLACZEGO TO NIE JEST KOSMETYKA: sonda zywotnosci ZABIJA kontener,
          # wiec nie ma prawa zalezec od niczego, czego restart nie naprawia.
          # `/api/health` robi `SELECT count(*) FROM schema_migrations`; wolna
          # baza w oknie kopii (03:17) albo trenera (04:40) to trzy nieudane
          # probki, kubelet ubija poda API, a kontener startowy `migrate`
          # wchodzi w backoff - dwuminutowa przerwa bazy robi sie kilkuminutowa
          # niedostepnoscia jedynego miejsca, w ktorym widac stan systemu.
          # Zaleznosc od bazy nalezy do GOTOWOSCI (wyzej), nie do zywotnosci.
          #
          # `timeoutSeconds: 5` i `failureThreshold: 3` ZOSTAJA mimo powrotu na
          # endpoint, ktory nie dotyka bazy: `/api/zywy` odpowiada natychmiast,
          # wiec jawne progi nic nie kosztuja, a chronia przed nawrotem
          # domyslnej 1 s, gdyby sciezka kiedykolwiek znowu sie zmienila.
          livenessProbe:
            httpGet: { path: /api/zywy, port: 8000 }
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  # Nazwa musi byc dokladnie 'trader-api' - taki host jest wpisany w docker/nginx.conf.
  name: {{ include "trader.fullname" . }}-api
  labels: {{- include "trader.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "trader.fullname" . }}-api
  ports:
    - port: 8000
      targetPort: 8000
