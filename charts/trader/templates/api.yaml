apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trader.fullname" . }}-api
  labels: {{- include "trader.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 3 }}
  selector:
    matchLabels:
      app: {{ include "trader.fullname" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "trader.fullname" . }}-api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      # Migracje ida jako initContainer, nie jako Job: dzieki temu API nigdy nie
      # wystartuje na schemacie starszym niz jego kod, a ArgoCD nie musi
      # koordynowac kolejnosci Job -> Deployment.
      initContainers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["python", "db/migrate.py"]
          env:
            # Migracje ida rola WLASCICIELA - tylko one moga zmieniac strukture.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: {{ include "trader.databaseUrl" . | quote }}
            # Migrator ustawia tym hasla ROL PROCESOW (poza plikami migracji,
            # zeby nie trafily do repozytorium ani do sumy kontrolnej).
            #
            # To jedyny kontener, ktory widzi je wszystkie naraz - i tak byc
            # musi, bo tylko wlasciciel moze zrobic ALTER ROLE. Gdyby haslo
            # ustawial ktos inny, poswiadczenia dozorcy musialyby trafic do
            # poda, ktory dozorca nie jest.
            {{- include "trader.appDbPasswordEnv" . | nindent 12 }}
            {{- include "trader.rolaHaslaEnv" . | nindent 12 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          env:
            {{- include "trader.appDbPasswordEnv" . | nindent 12 }}
            - name: DATABASE_URL
              value: {{ include "trader.appDatabaseUrl" . | quote }}
            - name: REDIS_URL
              value: "redis://{{ include "trader.fullname" . }}-redis:6379/0"
            # Klucz do szyfrowania kluczy API gield i sekretow TOTP w bazie.
            - name: SECRETS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: SECRETS_KEY }
            # Poprzedni klucz - ustawiany WYLACZNIE na czas rotacji. Odszyfrowanie
            # probuje najpierw biezacego, potem tego; zapis idzie zawsze biezacym.
            - name: SECRETS_KEY_OLD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: SECRETS_KEY_OLD, optional: true }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: ANTHROPIC_API_KEY, optional: true }
            # Dostawca zapasowy analizy wiadomosci. Anthropic ma pierwszenstwo,
            # gdy oba klucze sa ustawione.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: GEMINI_API_KEY, optional: true }
            {{/*
            TE SAME modele i limity co u workerow. `/api/api-spend` wola
            `limit_dobowy_usd()` we WLASNYM procesie, wiec bez tego bloku
            interfejs pokazywalby limit 5.0 z domyslu kodu, podczas gdy
            wydatki zatrzymywalaby zupelnie inna liczba u workera.
            */}}
            {{- include "trader.llmEnv" . | nindent 12 }}
            - name: CORS_ORIGINS
              value: "https://{{ .Values.ingress.host }}"
          ports:
            - containerPort: 8000
          # DWIE SONDY, DWA PYTANIA - i one nie moga pytac o to samo.
          #
          # GOTOWOSC pyta, czy ten pod ma co oddac: `/api/health` robi
          # `SELECT count(*) FROM schema_migrations`, wiec pod bez bazy zostaje
          # wypisany z Service i wraca sam, gdy baza wroci. Zaleznosc zewnetrzna
          # nalezy wlasnie tutaj.
          #
          # `timeoutSeconds: 5`, bo domyslna jedna sekunda jest progiem na
          # OBCIAZENIE, a nie na awarie: okno kopii (03:17) i trenera (04:40)
          # potrafi wydluzyc odpowiedz bazy ponad sekunde, a wypisanie poda
          # z Service w takiej chwili odcina jedyny widok na system.
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 5
          # ZYWOTNOSC pyta wylacznie o to, czy PROCES zyje - `/api/zywy`
          # (services/api/main.py) nie dotyka bazy ani Redisa.
          #
          # Do 2026-09-22 stalo tu `/api/health` bez `timeoutSeconds`, czyli
          # z domyslna 1 s, i bez `failureThreshold`, czyli z domyslnymi trzema
          # probami: trzy wolne odpowiedzi bazy w ciagu 60 s zabijaly poda API.
          # Restart nie naprawia wolnej bazy, a kontener startowy `migrate`
          # wchodzi wtedy w backoff - przerwa bazy liczona w minutach robila
          # sie niedostepnoscia API liczona w kilku minutach.
          #
          # Oba progi wpisane JAWNIE, mimo ze rowne domyslnym: sonda, ktora
          # zabija kontener, nie ma prawa opierac sie na wartosciach, ktorych
          # nie widac w pliku.
          livenessProbe:
            httpGet: { path: /api/zywy, port: 8000 }
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  # Nazwa musi byc dokladnie 'trader-api' - taki host jest wpisany w docker/nginx.conf.
  name: {{ include "trader.fullname" . }}-api
  labels: {{- include "trader.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "trader.fullname" . }}-api
  ports:
    - port: 8000
      targetPort: 8000
