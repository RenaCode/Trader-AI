{{- if .Values.diagnostykaCron.enabled }}
# POMIARY WYMAGAJACE TRENERA - OSOBNE ZADANIE, BO ZOSTAWIAJA SLAD.
#
# `train.py --sucho` NIE JEST trybem tylko-do-odczytu i nie wolno go za taki
# uznac. Sprawdzone w kodzie: nawet z ta flaga trener wykonuje i COMMITUJE wpis
# do `learn.model`, `learn.model_version` (status utyka na `training`) oraz
# `learn.training_run`. Czego `--sucho` faktycznie broni, to blok na koncu:
# aktualizacja parametrow wersji, BRAMKA PROMOCJI, nadpisanie
# `learn.learning_state` i log - te wykonuja sie wylacznie `if not sucho`.
#
# Czyli: pomiar NIE zmieni modelu, ktorym handluje produkcja, ale ZOSTAWI
# wiersze-sieroty. Po odczytaniu wyniku warto je sprzatnac:
#
#   DELETE FROM learn.training_run  WHERE status = 'running' AND started_at < now() - interval '1 hour';
#   DELETE FROM learn.model_version WHERE status = 'training' AND created_at < now() - interval '1 hour';
#
# DLACZEGO OSOBNE ZADANIE. Gdyby te dwa pomiary siedzialy w zadaniu wyzej,
# caly przebieg musialby chodzic rola z prawem zapisu - i trzy pomiary, ktore
# NAPRAWDE sa tylko odczytem, stracilyby jedyna twarda gwarancje, jaka maja.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trader-diagnostyka-trener
  labels: {{- include "trader.labels" . | nindent 4 }}
spec:
  schedule: "0 0 31 2 *"
  # Strefa jawnie - patrz `strefaCzasowa` w values.yaml.
  timeZone: {{ required "strefaCzasowa musi byc ustawiona wprost" .Values.strefaCzasowa | quote }}
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  # `Forbid` i oba limity NIE DOTYCZA sciezki recznej: Job utworzony przez
  # `kubectl create job --from=cronjob/...` jest osobnym obiektem i polityka
  # wspolbieznosci CronJoba go nie obowiazuje. Stoja tu, zeby manifest byl
  # poprawny takze wtedy, gdy ktos kiedys zdejmie `suspend` - inaczej pierwszy
  # zawieszony przebieg po cichu pochlonalby kazdy kolejny termin, a po stu
  # pominieciach kontroler przestalby planowac zadanie CALKOWICIE.
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels: {{- include "trader.etykietyZadania" . | nindent 12 }}
        spec:
          restartPolicy: Never
          # Obrazy tradera w GHCR sa prywatne - bez sekretu Job ruszalby tylko
          # wtedy, gdy obraz akurat lezy w cache wezla.
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          # Bez tokenu API klastra i bez roota - patrz `trader.podBezUprawnien`
          # w _helpers.tpl. Zadanie nie rozmawia z API Kubernetesa.
          automountServiceAccountToken: false
          {{- include "trader.podBezUprawnien" . | nindent 10 }}
          containers:
            - name: diagnostyka-trener
              image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
              imagePullPolicy: {{ .Values.api.image.pullPolicy }}
              {{- include "trader.kontenerBezUprawnien" . | nindent 14 }}
              command:
                - sh
                - -c
                - |
                  set -u
                  RC=0
                  # OKNA: 1400 to stan produkcji, 1750 to CALA dostepna historia.
                  #
                  # Zmierzone 2026-09-27: `market.candle` dla instrumentow
                  # `tradeable` siega 2021-12-09, czyli 1753 dni - a trener uzywa
                  # 1400, wiec 353 dni lezy NIEUZYTE. Przy train_days=180,
                  # test_days=30, step_days=30 daje to 40 okien wobec 52 mozliwych.
                  #
                  # DLACZEGO TO JEST PYTANIE BLOKUJACE: tor 4h stoi na `learning`
                  # WYLACZNIE dlatego, ze nie bije kup-i-trzymaj - 25/39 okien,
                  # przedzial Wilsona 48,4%-77,3%, czyli dolna granica PONIZEJ 50%.
                  # Przy tym samym odsetku 64,1% wystarczylyby 43 okna (dolna
                  # granica 50,2%), a pelna historia daje 52. Brakuje wiec CZTERECH
                  # okien, a mamy dane na dwanascie.
                  #
                  # To NIE JEST dobieranie danych pod wynik: wiecej okien moze
                  # rownie dobrze odsetek OBNIZYC, bo 2021-2022 to inny rezim
                  # (dryf cech wynosi dzis 2,67). Wlasnie dlatego jest to
                  # uczciwy test, a nie sposob na jego przejscie.
                  #
                  # 1397/1394/1391 zostaja jako przesuniecia okna - bez nich
                  # roznica 1400 kontra 1750 bylaby nieodrozniona od szumu
                  # samego przesuniecia.
                  for D in 1400 1397 1394 1391 1750; do
                    echo ""
                    echo "=============== OKNO $D DNI ==============="
                    # P0-4: czy spread NASZEJ ksiegi miesci sie w koszcie
                    # progowym.
                    #
                    # DO 2026-09-27 STALO TU `--spread-bps 5.85` I TO BYLA WADA
                    # TEJ DIAGNOSTYKI: probe P0-4 karmiono stala, wiec pytanie
                    # "czy koszt progowy pokrywa spread" mialo z gory ustalona
                    # prawa strone i nie umialo zauwazyc, ze spread sie zmienil.
                    # Nocny trener liczy go teraz z bazy sam, wiec diagnostyka
                    # pyta o to samo, czym obstawia produkcja - bez flagi.
                    # Obala: koszt progowy ponizej zmierzonego spreadu.
                    echo "--- P0-4 koszt progowy wobec ZMIERZONEGO spreadu ---"
                    python services/engine/train.py \
                      --bar 4h --days "$D" --kind spot_eu --limit \
                      --sucho || RC=$?
                    # P0-5: czy ekspozycja okna jest ujemnie skorelowana
                    # ze zwrotem kup-i-trzymaj. Trener wypisuje obie liczby
                    # obok siebie w kazdym oknie - wystarczy je zestawic.
                    # Obala: korelacja Spearmana w (-0,3; +0,3) - i wtedy teza,
                    # ze model jest w calosci modelem powrotu do sredniej,
                    # jest falszywa.
                    echo "--- P0-5 ekspozycja wobec zwrotu odniesienia ---"
                    python services/engine/train.py \
                      --bar 4h --days "$D" --kind spot_eu --limit \
                      --sucho --wybor ic || RC=$?
                  done
                  echo ""
                  echo "RC=$RC"
                  exit $RC
              env:
                # Rola `silnik`, bo `--sucho` mimo nazwy zapisuje - patrz
                # komentarz nad tym zadaniem. To jest powod, dla ktorego te dwa
                # pomiary nie moga isc razem z trzema wyzej.
                {{- include "trader.rolaDbEnv" (dict "ctx" $ "rola" "silnik") | nindent 16 }}
                - name: SECRETS_KEY
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.secretName }}, key: SECRETS_KEY }
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                {{- toYaml .Values.diagnostykaCron.resources | nindent 16 }}
{{- end }}
