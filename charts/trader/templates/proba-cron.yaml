{{- /* Tylko przy wlaczonym torze crypto - powod przy `probaCron` w values.yaml. */}}
{{- if and .Values.probaCron.enabled .Values.torCrypto.enabled }}
# PROBA POZAROWA KILL-SWITCHA.
#
# Kill-switch jest jedynym mechanizmem w tym systemie, ktorego awaria nie
# objawia sie niczym: silnik po jego zadzialaniu wyglada tak samo jak silnik bez
# sygnalu do wejscia. Testy jednostkowe sprawdzaja regule; nie sprawdzaja, czy
# silnik ja wola, czy wiersz dociera do bazy i czy powiadomienie wychodzi.
#
# Zadanie doprowadza do PRAWDZIWEGO zadzialania - podnosi prog kapitalu powyzej
# biezacego stanu i czeka, az silnik sam wykryje przekroczenie. Prog wraca
# w bloku `finally`, wiec takze po bledzie i po przerwaniu - ale to ostatnie
# wymaga DWOCH rzeczy naraz i obie stoja nizej w tym pliku: handlera SIGTERM
# (`zainstaluj_przerwanie` w module proby, inaczej CPython konczy proces bez
# rozwijania stosu) oraz `activeDeadlineSeconds` DLUZSZEGO niz `OKNO_PROBY_S`.
# Do 2026-09-23 nie bylo ani jednego, ani drugiego, wiec zdanie wyzej bylo
# nieprawdziwe dokladnie dla jedynego sposobu, w jaki ten Job bywa przerywany.
#
# DLACZEGO NIE PLIK .sh NA SERWERZE: skrypt na dysku rozjezdza sie z kodem,
# ktory testuje - obraz idzie przez wdrozenie, plik nie idzie nigdzie. Ten modul
# jedzie w tym samym obrazie co silnik, wiec sprawdza dokladnie ten kod, ktory
# handluje.
#
# TRZY WYNIKI, NIE DWA (kody wyjscia). Zadanie swieci na czerwono TYLKO wtedy,
# gdy jest o czym budzic czlowieka:
#
#   0  zaliczona            lancuch zadzialal od limitu po powiadomienie
#   0  NIEROZSTRZYGNIETA    kill-switch juz stal, wiec proby nie dalo sie
#                           przeprowadzic - nie ma czego wywolac ze stanu
#                           spoczynku. To NIE jest awaria zabezpieczenia i nie
#                           ma prawa konczyc poda bledem; log mowi wprost, ze
#                           w tym cyklu nikt bezpiecznika nie sprawdzil
#   1  NIEZALICZONA         proba SIE WYKONALA i ogniwo padlo - napraw lancuch
#   2  NIESPRAWDZONE        nierozstrzygnieta dluzej niz tydzien - zwolnij
#                           kill-switch albo zdecyduj swiadomie, ze handel stoi
#
# Do 2026-09-10 trzeci przypadek byl zgloszony jako pierwszy: pod konczyl sie
# bledem, aplikacja wisiala jako Degraded i szedl mail o awarii - za kazdym
# razem, odkad kill-switch byl aktywny. Prawdziwa awaria lancucha wygladalaby
# identycznie i utonelaby w tych powtorkach.
#
# CZESTOTLIWOSC: codziennie. Proba wstrzymuje wejscia na kilkanascie minut, co
# przy swiecy 4h jest ulamkiem jednego okna decyzyjnego - a przy sredniej
# ekspozycji 1,3% kosztem, ktorego nie widac w wyniku. Bezpiecznik sprawdzany raz
# w tygodniu oznacza, ze o jego awarii dowiadujemy sie srednio po trzech i pol
# dnia; przy dobowej probie - nastepnego ranka.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trader-proba-killswitcha
  labels: {{- include "trader.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.probaCron.schedule | quote }}
  # Strefa jawnie - patrz `strefaCzasowa` w values.yaml.
  timeZone: {{ required "strefaCzasowa musi byc ustawiona wprost" .Values.strefaCzasowa | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # Sprzatanie zakonczonych Jobow - `sprzatanieZadan` w values.yaml.
      ttlSecondsAfterFinished: {{ .Values.sprzatanieZadan.proba }}
      # Bez ponawiania. Powtorzenie proby po niepowodzeniu podnioslo by prog
      # jeszcze raz, a przy trwajacej awarii lancucha zatrzymywaloby silnik
      # w kolko - czyli samo stalo by sie ta awaria, ktorej szuka.
      backoffLimit: 0
      # TWARDY LIMIT CZASU - I MUSI BYC DLUZSZY NIZ WLASNE OKNO PROBY.
      #
      # Do 2026-09-23 stalo tu 1500, a `OKNO_PROBY_S` w proba_killswitcha.py to
      # CZEKAJ_SILNIK_S (420) + CZEKAJ_DOZOR_S (660) + 600 = 1680 s. Chart sam
      # zakladal wiec, ze Job bywa zabity PRZED koncem okna - a wtedy przychodzi
      # SIGTERM i (do tej samej daty, bo nie bylo handlera) proces ginal bez
      # rozwijania stosu, czyli BEZ bloku `finally`. Podniesiony `min_equity`
      # zostawal na stale, a ma regule `reczne`, wiec `wznowienie.wznow` go nie
      # rusza: silnik stal bezterminowo, a kazde reczne zwolnienie kill-switcha
      # konczylo sie ponownym wystrzeleniem w nastepnym cyklu, bo przyczyna
      # nadal tam byla.
      #
      # Ze deadline byl osiagalny: `_czekaj_na` liczy `minelo` wylacznie po
      # `KROK_S`, nie doliczajac czasu samych zapytan. Przy KROK_S = 15 to 72
      # odpytania - 1080 s uspienia PLUS 72 razy opoznienie zapytania. Przy
      # obciazonej bazie (~6 s) daje to ponad 1500 s.
      #
      # 1920 = 1680 (okno) + 240 na otwarcie puli, same zapytania i sprzatanie.
      # Zadanie wiszace dluzej znaczy, ze cos jest nie tak z nim samym.
      # Wartosci pilnuje `tests/test_chart_nadzor.py::
      # test_deadline_proby_dluzszy_niz_jej_wlasne_okno` - porownuje ja ze stala
      # W KODZIE, wiec podbicie ktoregokolwiek z czekan zapali test, a nie
      # zostawi cichego rozjazdu.
      activeDeadlineSeconds: 1920
      template:
        metadata:
          labels: {{- include "trader.etykietyZadania" . | nindent 12 }}
        spec:
          restartPolicy: Never
          # Obrazy tradera w GHCR sa prywatne - bez sekretu Job ruszalby tylko
          # wtedy, gdy obraz akurat lezy w cache wezla.
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          # Bez tokenu API klastra i bez roota - patrz `trader.podBezUprawnien`
          # w _helpers.tpl. Zadanie nie rozmawia z API Kubernetesa.
          automountServiceAccountToken: false
          {{- include "trader.podBezUprawnien" . | nindent 10 }}
          # OKRES KARENCJI WPISANY JAWNIE, mimo ze rowny domyslnemu. Po
          # SIGTERM-ie proba ma wykonac blok `finally`: dwa UPDATE-y
          # przywracajace prog i zwalniajace wlasne zdarzenie. Trzydziesci
          # sekund starcza z zapasem, ale prog, od ktorego zalezy przywrocenie
          # limitu ryzyka, nie ma prawa byc wartoscia, ktorej nie widac
          # w pliku - tak samo jak progi sond w api.yaml. Po tym czasie idzie
          # SIGKILL i zadnego handlera juz nie ma.
          terminationGracePeriodSeconds: 30
          containers:
            - name: proba
              image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
              imagePullPolicy: {{ .Values.api.image.pullPolicy }}
              {{- include "trader.kontenerBezUprawnien" . | nindent 14 }}
              # PRZEZ `przebieg_zadania.py` (F-8.4, migracja 0074): po zakonczeniu
              # dopisuje wiersz do `risk.job_run`, ktory czyta `dozor --co zadania`.
              # Kod wyjscia i sygnaly ida bez zmian do polecenia ponizej.
              command: ["python", "services/engine/przebieg_zadania.py", "--nazwa",
                        "proba-killswitcha", "--",
                        "python", "services/engine/proba_killswitcha.py"]
              env:
                # WLASNA ROLA (migracja 0034). Proba jest jedynym procesem poza
                # wlascicielem, ktory moze ruszyc wartosc limitu - i wylacznie
                # kolumne `value`. Nie ma prawa ustawic `enabled = false`:
                # wylaczony limit nie wraca sam po bledzie procesu, a wyglada
                # dokladnie jak limit niespelniony, wiec nikt by tego nie
                # zauwazyl az do chwili, w ktorej bylby potrzebny.
                {{- include "trader.rolaDbEnv" (dict "ctx" $ "rola" "proba") | nindent 16 }}
                # BEZ SECRETS_KEY (audyt Fable U-9): proba nic nie odszyfrowuje -
                # nie wola `notify()` ani adaptera gieldy, ogniwo 4 tylko CZYTA
                # `notify.notification`. Klucz do kluczy gieldy i TOTP nie ma
                # powodu lezec w tym podzie.
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                limits:   { cpu: 200m, memory: 256Mi }
                requests: { cpu: 20m,  memory: 64Mi }
{{- end }}
