{{- if .Values.zywotnoscCron.enabled }}
{{/*
TORY OBJETE CZUJKAMI - JEDNA LISTA, ZLOZONA Z DANYCH, KTORE JUZ TU SA.

Do 2026-09-27 trzy sprawdzenia nizej - `swiezosc`, `instrumenty` i `poslizg` -
szly BEZ `--engine`, czyli z domyslnym `crypto` (`dozor.main`). Tor `equity` byl
dla nich niewidoczny w calosci: `sprawdz_swiezosc` filtruje po silniku od
2026-09-24, `sprawdz_instrumenty` i `sprawdz_poslizg` przyjmuja go parametrem,
a nikt go nie podawal. (`--co ryzyko`, `--co zywotnosc` i `--co workery`
iteruja WIERSZE tabel, wiec equity obejmowaly od poczatku - i to jest ta sama
zasada, tylko wyrazona danymi, a nie argumentem.)

DLACZEGO `--engine` W CHARTCIE, A NIE PETLA PO SILNIKACH W `dozor.py`

Bo `swiezosc` potrzebuje PARY (silnik, horyzont), a nie samego silnika: prog dla
`feat.feature_value` liczy sie z `bar_minutes`, a kazdy tor trenuje inne swiece
(`trainerCron.horyzonty` = 4h dla krypto (1h wylaczony 2026-10-18), `trainerCron.equity.horyzonty` = 1h).
Petla po silnikach wewnatrz `dozor.py` musialaby wiec znac liste horyzontow
KAZDEGO toru - czyli trzymac DRUGA KOPIE tej listy, obok `workers.features`,
`workers.features-equity` i `trainerCron`. Rozjazd takiej kopii nie objawia sie
awaria: kosztowal ten projekt 21 godzin martwych cech 2026-09-04 i to przed nim
broni `test_swiezosc_pokrywa_kazdy_horyzont`.

Dwa mechanizmy naraz byly by gorsze od jednego: gdyby `instrumenty` i `poslizg`
iterowaly silniki same, a `swiezosc` brala je z chartu, to trzeci silnik
wchodzilby do dwoch sprawdzen automatycznie, a do trzeciego nie - i nikt by tego
nie zauwazyl. Jedno miejsce, ta sama lista, wszystkie trzy wywolania.

CZEGO TA LISTA NIE ROZSTRZYGA: czy sprawdzenie ma ALARMOWAC. To jest pytanie
o rynek, nie o konfiguracje wdrozenia, i odpowiada na nie `dozor.py` z kolumny
`ref.venue.is_24_7` - tej samej, ktora rozstrzyga w `sesja.stan_sesji`. Patrz
`dozor.rynek_z_sesjami`: dla rynku z sesjami wiek danych liczony wobec `now()`
nie jest miara awarii potoku, bo po otwarciu sesji najnowsza swieca pochodzi
z poprzedniego zamkniecia (zmierzone: 1050 min przy progu 180).
*/}}
{{- $tory := list }}
{{/* Crypto tylko przy wlaczonym torze (`torCrypto` w values.yaml): czujki danych
toru, ktorego potok jest wylaczony, mierzylyby wylacznie to, ze go wylaczono. */}}
{{- if .Values.torCrypto.enabled }}
{{- $tory = append $tory (dict "engine" "crypto" "horyzonty" (.Values.trainerCron.horyzonty | default (list .Values.trainerCron.bar))) }}
{{- end }}
{{- /* Equity pilnowane, gdy chodzi potok cech, nie trening (trening bywa wstrzymany, 2026-10-03). */}}
{{- if (index .Values.workers "features-equity").enabled }}
{{- $tory = append $tory (dict "engine" "equity" "horyzonty" .Values.trainerCron.equity.horyzonty) }}
{{- end }}
{{/* ZADANIA CYKLICZNE DO `--co zadania` (F-8.4) - z flag `enabled`, bo tylko
chart wie, ktore sa wlaczone. Nazwy = `--nazwa` w `przebieg_zadania.py`.
`zywotnosc` nie pilnuje samej siebie: jej kod niezerowy znaczy "czujka cos
zglosila", nie awarie, a cisze wlasnego zadania zobaczy dopiero ktos inny.
Harmonogramy obok nazw (audyt 2026-10-09, S-4): ten sam `schedule`, ktory
dostaje CronJob, wiec czujka nie trzyma drugiej kopii. Bez niego oczekiwany
odstep szedl z samej mediany i trzy skupione powtorki tygodniowego trenera
dawaly falszywe "trainer: cisza". */}}
{{- $zadania := list }}
{{- $harmonogramy := list }}
{{- if .Values.trainerCron.enabled }}{{ $zadania = append $zadania "trainer" }}{{ $harmonogramy = append $harmonogramy (printf "trainer=%s" .Values.trainerCron.schedule) }}{{ end }}
{{- if and .Values.probaCron.enabled .Values.torCrypto.enabled }}{{ $zadania = append $zadania "proba-killswitcha" }}{{ $harmonogramy = append $harmonogramy (printf "proba-killswitcha=%s" .Values.probaCron.schedule) }}{{ end }}
{{- if .Values.postmortemCron.enabled }}{{ $zadania = append $zadania "postmortem" }}{{ $harmonogramy = append $harmonogramy (printf "postmortem=%s" .Values.postmortemCron.schedule) }}{{ end }}
{{- if .Values.instrumentyCron.enabled }}{{ $zadania = append $zadania "instrumenty" }}{{ $harmonogramy = append $harmonogramy (printf "instrumenty=%s" .Values.instrumentyCron.schedule) }}{{ end }}
{{- if .Values.kursCron.enabled }}{{ $zadania = append $zadania "kurs" }}{{ $harmonogramy = append $harmonogramy (printf "kurs=%s" .Values.kursCron.schedule) }}{{ end }}
{{- if .Values.backup.enabled }}{{ $zadania = append $zadania "backup" }}{{ $harmonogramy = append $harmonogramy (printf "backup=%s" .Values.backup.schedule) }}{{ end }}
{{/* PROCESY, KTORE CHART URUCHAMIA (2026-10-18) - do `--workery-z-chartu`.
Ta sama odpowiedz co Deployment (`trader.workerWlaczony`), wiec proces
wylaczony w chartcie - flaga `enabled` albo caly tor (`torCrypto`) - nie jest
dla czujek pulsu martwy, choc jego ostatni wiersz w `risk.*_heartbeat` zostal
w bazie ze statusem `running`. Nazwy = klucze `workers`; dozor mapuje na nie
wiersze pulsu silnika i dozorcy (`dozor.proces_pulsu`). */}}
{{- $workery := list }}
{{- range $nazwa, $w := .Values.workers }}
{{- if include "trader.workerWlaczony" (dict "w" $w "ctx" $) }}{{ $workery = append $workery $nazwa }}{{ end }}
{{- end }}
# Czujka zywotnosci silnikow.
#
# MUSI byc osobnym procesem: martwy proces nie zglosi wlasnej smierci. Petla
# decyzyjna zapisuje risk.engine_heartbeat przy kazdym cyklu, ale az do
# 2026-09-06 nikt tego nie czytal poza dashboardem - a typ zdarzenia
# `engine.down` istnial w bazie od migracji 0007 i nigdy nie zostal wyslany.
#
# Czestotliwosc dobrana do progu: przy progu 15 minut i przebiegu co 10 minut
# awaria jest zgloszona najpozniej po 25 minutach.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trader-zywotnosc
  labels: {{- include "trader.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.zywotnoscCron.schedule | quote }}
  # Strefa jawnie - patrz `strefaCzasowa` w values.yaml.
  timeZone: {{ required "strefaCzasowa musi byc ustawiona wprost" .Values.strefaCzasowa | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      # Sprzatanie zakonczonych Jobow - `sprzatanieZadan` w values.yaml.
      ttlSecondsAfterFinished: {{ .Values.sprzatanieZadan.zywotnosc }}
      # Bez ponawiania: awaria silnika nie naprawi sie przez powtorzenie
      # sprawdzenia, a kazde powtorzenie wyslaloby to samo powiadomienie.
      #
      # "Failed" W `kubectl get jobs` ZNACZY TU "WYSLANO NOWE POWIADOMIENIE",
      # a nie "czujka padla" (audyt 2026-10-09, S-3). Kolejne przebiegi o tej
      # samej, juz zgloszonej awarii koncza sie `Complete`. Co zglosila - log
      # tego joba (linie MILCZY / ZADANIE / ...); pad samej czujki widac po
      # tym, ze w logu nie ma podsumowan sekcji.
      backoffLimit: 0
      # TWARDY LIMIT CZASU - 540 s, czyli o minute krocej niz okres (600 s).
      #
      # To zadanie ma najwyzsza stawke ze wszystkich trzech: jeden zawieszony
      # przebieg zatrzymuje przy `Forbid` CALA warstwe czujek naraz - dziewiec
      # sprawdzen wypisanych nizej (zywotnosc, ryzyko, kopie, swiezosc, puls
      # workerow, egzekucja, uzgodnienie, instrumenty, stawki) plus pomiar
      # poslizgu. Zawieszenie w dowolnym z nich - urwane polaczenie z baza albo
      # zapytanie do gieldy bez odpowiedzi - i od tej chwili nikt juz nie
      # sprawdza NICZEGO, a objawem jest cisza, czyli to samo, co zdrowie.
      #
      # 540, a nie 600: przebieg ma umrzec ZANIM ruszy nastepny, inaczej
      # `Forbid` pomija kolejny termin mimo dzialajacego limitu. Zdrowy przebieg
      # to kilkanascie sekund (dziewiec krotkich zapytan), wiec 540 s jest
      # trzydziestokrotnym zapasem - limit zabija zawieszenie, nie prace.
      activeDeadlineSeconds: 540
      template:
        metadata:
          labels: {{- include "trader.etykietyZadania" . | nindent 12 }}
        spec:
          restartPolicy: Never
          # Obrazy tradera w GHCR sa prywatne - bez sekretu Job ruszalby tylko
          # wtedy, gdy obraz akurat lezy w cache wezla.
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          # Bez tokenu API klastra i bez roota - patrz `trader.podBezUprawnien`
          # w _helpers.tpl. Zadanie nie rozmawia z API Kubernetesa.
          automountServiceAccountToken: false
          {{- include "trader.podBezUprawnien" . | nindent 10 }}
          containers:
            - name: zywotnosc
              image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
              imagePullPolicy: {{ .Values.api.image.pullPolicy }}
              {{- include "trader.kontenerBezUprawnien" . | nindent 14 }}
              # Czujki odpowiadaja na pytanie, czy system jest w stanie,
              # o ktorym czlowiek MUSI wiedziec, i musza dzialac w procesie innym
              # niz obserwowany.
              #
              # WZNOWIENIE TU NIE NALEZY. Siedzi w dozorcy (osobny pod, petla
              # co 60 s), bo jest czescia nadzoru ciaglego, a nie okresowego
              # sprawdzenia. To zadanie ma pilnowac takze SAMEGO DOZORCY -
              # nadzorca, ktorego nikt nie nadzoruje, jest tylko przesunieciem
              # problemu o jeden poziom.
              #
              # CO ZNACZY PADNIETY JOB TEGO ZADANIA - i czego NIE znaczy.
              #
              # `RC` nizej zbiera kody wyjscia podsprawdzen, a te od 2026-09-10
              # odpowiadaja na pytanie "czy TEN przebieg zglosil cos NOWEGO",
              # a nie "czy system jest w zlym stanie". Padniety Job znaczy wiec:
              # albo czujka sie wywrocila, albo wlasnie poszlo powiadomienie.
              #
              # Poprzednia wersja niosla tu STAN: kod niezerowy przez caly czas
              # trwania problemu. Zmierzone na produkcji tego samego dnia -
              # kill-switch aktywny od poltorej doby, zadanie chodzi co 10 minut,
              # wiec 144 padniete Joby na dobe, 144 pody w stanie Error, mail
              # z kazdego i ta aplikacja ArgoCD trwale w stanie Degraded. Sygnal
              # powtarzany 144 razy o rzeczy, ktora sie nie zmienia, uczy
              # przewijac cala kategorie - takze ten jeden Job, w ktorym czujka
              # naprawde padla.
              #
              # STANU SZUKA SIE W LOGU, nie w kodzie wyjscia. Kazda czujka
              # wypisuje znalezisko przy KAZDYM przebiegu, takze w oknach ciszy
              # powiadomien, wiec `kubectl logs job/trader-zywotnosc-...` mowi,
              # w jakim stanie jest system, za kazdym razem, gdy ktos spojrzy.
              # Uzasadnienie i historia obu rund: docstring services/engine/dozor.py.
              # PRZEZ `przebieg_zadania.py` (F-8.4, migracja 0074): po zakonczeniu
              # dopisuje wiersz do `risk.job_run`, ktory czyta `dozor --co zadania`.
              # Kod wyjscia i sygnaly ida bez zmian do polecenia ponizej.
              command:
                - python
                - services/engine/przebieg_zadania.py
                - --nazwa
                - zywotnosc
                # Czujka idzie TAKZE na starym schemacie - przy nieudanej
                # migracji jest jedynym, co ma o tym krzyczec (T-15).
                - --mimo-starego-schematu
                - "--"
                - sh
                - -c
                - |
                  RC=0
                  # `--workery-z-chartu`: patrz `$workery` na gorze pliku.
                  python services/engine/dozor.py --co zywotnosc --workery-z-chartu {{ join "," $workery | quote }} || RC=$?
                  python services/engine/dozor.py --co ryzyko    || RC=$?
                  python services/engine/dozor.py --co kopie     || RC=$?
                  # SWIEZOSC DANYCH. Puls silnika mowi, ze silnik zyje - nie mowi,
                  # na czym decyduje. Pobieranie swiec i liczenie cech chodza
                  # w OSOBNYCH podach; gdy stana, silnik bije dalej i handluje na
                  # cechach sprzed trzech dni. Stare cechy nie wygladaja jak
                  # awaria, tylko jak rynek, ktory przestal dawac sygnaly.
                  #
                  # PER HORYZONT, NIE RAZ (2026-09-25). Do tego dnia szlo tu
                  # jedno wywolanie bez `--bar`, czyli z domyslnym `4h`
                  # (dozor.py), a produkcja liczy cechy na DWOCH horyzontach
                  # (`workers.features`: "4h,1h") i trenuje oba
                  # (`trainerCron.horyzonty`). Tor 1h nie byl objety ANI RAZ.
                  #
                  # Roznica nie jest formalna. Oba horyzonty skladaja sie ze
                  # swiec ZRODLOWYCH 1h, wiec czlon `market.candle` wypada
                  # identycznie - ale prog dla `feat.feature_value` liczy sie
                  # z `h.bar_minutes`, czyli 240 minut dla 4h i 60 dla 1h.
                  # Potok cech 1h moze wiec stac ponad trzy godziny i byc
                  # w calosci przezroczysty dla sprawdzenia liczonego dla 4h.
                  # Dokladnie ten rozjazd - horyzont dolozony do trenera i nie
                  # dolozony do cech - kosztowal 21 godzin martwych cech
                  # 2026-09-04.
                  #
                  # LISTA IDZIE Z `trainerCron.horyzonty`, a nie jest przepisana
                  # tutaj: to ta sama lista, ktora `test_petle_w_serwisach`
                  # przyklada do `workers.features`, wiec trzeci horyzont
                  # dolozony do treningu wchodzi tu sam. Wlasna kopia byla by
                  # trzecim miejscem z ta liczba i rozjechala by sie cicho.
                  # TOR I HORYZONT, a nie sam horyzont: patrz komentarz przy
                  # `$tory` na gorze pliku. Bez `--engine` szlo tu domyslne
                  # `crypto` (`dozor.main`), wiec potok equity mogl stac
                  # tygodniami i ta czujka nie zauwazylaby tego ANI RAZU.
                  {{- range $tor := $tory }}
                  {{- range $h := $tor.horyzonty }}
                  python services/engine/dozor.py --co swiezosc --engine {{ $tor.engine | quote }} --bar {{ $h | quote }} || RC=$?
                  {{- end }}
                  {{- end }}
                  # PULS WORKEROW DANYCH. Swiezosc wyzej wykrywa SKUTEK - dane
                  # przestaly naplywac - i robi to dopiero po czasie jednej
                  # swiecy zrodlowej, przy 1h nawet po trzech godzinach. Nie
                  # odroznia przy tym "worker stoi" od "gielda nie oddaje
                  # danych" i nie mowi, KTORY z czterech procesow zamilkl: przy
                  # martwym `market`, `history` i `features` sygnal
                  # z feat.feature_value jest ten sam.
                  #
                  # To sprawdzenie pyta o PROCES, a nie o dane: czy domknal
                  # cykl. Prog liczy z INTERWALU danego workera zapisanego przez
                  # niego samego (market 60 s, history 1200 s), wiec nie ma tu
                  # drugiej kopii tej liczby do rozjechania.
                  python services/engine/dozor.py --co workery --workery-z-chartu {{ join "," $workery | quote }} || RC=$?
                  # SWIECA ODLOZONA I NIEROZSTRZYGNIETA - dziura, ktora otworzyla
                  # poprawka z 2026-09-22.
                  #
                  # Bramka `MIN_POKRYCIE = 0,9` slusznie zamienila handel na
                  # niepelnym komplecie sygnalow (jedenascie dni, pokrycie
                  # 0,02-0,10) na ODLOZENIE decyzji. Zamienila przy tym awarie
                  # GLOSNA na CICHA: przy trwalym braku cech kazda swieca
                  # zostanie odlozona, nikt nie wejdzie w rynek, a silnik bez
                  # wejsc wyglada dokladnie tak samo jak silnik na spokojnym
                  # rynku. Puls bije (linia wyzej), swiece przychodza (czujka
                  # swiezosci), zadania sa zielone.
                  #
                  # DLACZEGO NIE WYSTARCZA ZADNA Z POZOSTALYCH: `journal.pominiecie`
                  # nie bylo czytane przez ani jedna z nich, a licznik
                  # `odlozone_niepelne` zyje wylacznie w pamieci petli.
                  #
                  # TOR, ALE NIE HORYZONT - i to jest poprawka z 2026-09-27,
                  # dwadziescia minut po wdrozeniu tej czujki.
                  #
                  # `journal.pominiecie` NIE MA kolumny z rozmiarem swiecy, a
                  # petla przetwarza jeden horyzont na silnik. Petla po
                  # `$tor.horyzonty` czytala wiec te SAME wiersze (swiece 4h) raz
                  # z oknem 240 min i raz z oknem 60 min - i to drugie dalo 190
                  # "swiec bez decyzji" na w pelni zdrowej produkcji, bo cechy
                  # cenowe sa gotowe 20-35 min PO zamknieciu swiecy. Byloby to
                  # krytyczne powiadomienie o stanie, ktorego nie ma.
                  #
                  # Czujka bierze teraz dlugosc swiecy Z DANYCH (najczestszy
                  # odstep miedzy swiecami, ktore petla zapisala), wiec `--bar`
                  # nie ma tu czego wybierac i zostal usuniety. Equity ma wlasny
                  # kalendarz sesji - czujka sama milczy poza sesja.
                  {{- range $tor := $tory }}
                  python services/engine/dozor.py --co odlozone --engine {{ $tor.engine | quote }} || RC=$?
                  {{- end }}
                  # DECYZJA NA KAZDA SWIECE DLA KAZDEGO INSTRUMENTU (F-8.3).
                  # Puls silnika bije, gdy cykl sie udal - takze bez ani jednej
                  # decyzji. Dwie domkniete swiece z rzedu bez kompletu przy
                  # swiezych cechach -> warning. TYLKO CRYPTO: silnik equity
                  # chodzi z `--wymagaj-modelu` i bez aktywnego modelu konczy
                  # cykl na bramce (wstrzymany trening, values.yaml) - czujka
                  # krzyczalaby o stanie zamierzonym przy kazdej sesji.
                  {{- if .Values.torCrypto.enabled }}
                  python services/engine/dozor.py --co decyzje --engine crypto --bar 4h || RC=$?
                  {{- end }}
                  # ZADANIA CYKLICZNE (F-8.4). Kazdy CronJob dopisuje wynik do
                  # `risk.job_run` (przebieg_zadania.py, backup - trap). Ostatni
                  # przebieg z kodem niezerowym albo cisza > 2 typowe odstepy ->
                  # `job.nieudany`. Do tej pory nieudany job byl widoczny
                  # wylacznie w `kubectl get jobs`.
                  python services/engine/dozor.py --co zadania --zadania {{ join "," $zadania | quote }} --harmonogramy {{ join ";" $harmonogramy | quote }} || RC=$?
                  # CZY ALARM MA JAK OPUSCIC PANEL.
                  #
                  # Wszystkie czujki wyzej koncza sie powiadomieniem. Ta sprawdza
                  # mechanizm, ktorym one to robia - i dlatego sama go NIE UZYWA:
                  # alarm o braku kanalu wyslany brakujacym kanalem bylby ta sama
                  # wada, ktora opisuje "nadzor ginie razem z nadzorowanym".
                  # Jej jedynym sygnalem jest kod wyjscia, czyli czerwony Job.
                  #
                  # Zmierzone 2026-09-24: `notify.delivery` mialo 89 dostarczen,
                  # wszystkie `inapp`, przy 39 powiadomieniach `critical` w dobie.
                  python services/engine/dozor.py --co kanaly    || RC=$?
                  # ZDROWIE EGZEKUCJI. exec.order ma kolumne reject_reason od
                  # migracji 0005, a typ zdarzenia order.rejected istnieje
                  # w notify.event_type rownie dlugo - z etykieta, opisem
                  # i cooldownem. NIKT GO NIGDY NIE WYSLAL. Odrzucone zlecenie
                  # wyglada w logu jak brak sygnalu, wiec system moglby nie
                  # handlowac tygodniami przy dozorze meldujacym zdrowie.
                  python services/engine/dozor.py --co egzekucja || RC=$?
                  # UZGODNIENIE Z GIELDA. Nasz obraz stanu i obraz gieldy to dwa
                  # rozne stany, ktore moga sie rozjechac - i zaden ze sposobow
                  # nie objawia sie awaria. Pozycja-widmo blokuje wejscia,
                  # ktorych nic nie blokuje; saldo nieznane to ekspozycja poza
                  # limitami. Na rachunku papierowym sprawdzenie jest tanie
                  # i milczace, a przy wlaczeniu egzekucji dziala od pierwszego dnia.
                  # STATUS INSTRUMENTOW U GIELDY, dwa kroki: odswiezenie
                  # i ocena.
                  #
                  # Caly mechanizm wykrywania delistingu powstal razem z 32
                  # kanarkami i NIE BYL WOLANY PRZEZ NIC - dokladnie ten wzorzec,
                  # ktory tropimy: zaprojektowane, okolumnowane, niewpiete.
                  # Kolumna statusu zamarzalaby na "Trading" i codziennie
                  # zapewniala, ze wszystko gra.
                  #
                  # Odswiezenie idzie endpointem PUBLICZNYM hosta podmiotu, wiec
                  # nie wymaga klucza. Jego kod wyjscia NIE dopisuje sie do RC:
                  # zwraca 1 takze wtedy, gdy ktorykolwiek instrument nie ma
                  # kompletu regul, a to jest warunek dopuszczenia egzekucji,
                  # nie awaria zadania dozoru. Od oceny jest linia nizej.
                  # ODSWIEZANIE STATUSU WYPROWADZONE STAD do osobnego zadania
                  # `trader-instrumenty`. Ono ZAPISUJE, a to zadanie chodzi na
                  # roli tylko do odczytu - proba zapisu konczyla sie tu bledem
                  # uprawnien, zamaskowanym przez `|| true`, wiec przez 10 godzin
                  # nikt nie odswiezal statusu i nikt tego nie widzial.
                  # Zostaje sama OCENA, ktora jest odczytem.
                  #
                  # PER TOR. Uniwersum equity to 20 handlowalnych instrumentow
                  # od migracji 0060 i zadne wywolanie ich nie obejmowalo.
                  #
                  # Od 2026-10-15 status equity odswieza `trader-instrumenty`
                  # (Alpaca, `/v2/assets`), wiec pusta albo stara data
                  # sprawdzenia jest tu AWARIA tak samo jak dla krypto. BRAK
                  # POMIARU bez powiadomienia zostaje tylko dla silnika, ktorego
                  # gieldy nie ma w `instrumenty.VENUE_ODSWIEZANE` - powod
                  # i liczby: `dozor.brak_odczytu_statusu`.
                  {{- range $tor := $tory }}
                  python services/engine/dozor.py --co instrumenty --engine {{ $tor.engine | quote }} || RC=$?
                  {{- end }}
                  # `--kind` TAK SAMO JAK NIZEJ przy `--stawki`. Tolerancja
                  # wzgledna uzgodnienia wychodzi z CENNIKA, a nie ze stalej:
                  # taker podmiotu unijnego to 0,250%, czyli 2,5x wiecej niz
                  # dawna stala 0,001. Prog policzony z cudzego wiersza cennika
                  # alarmowalby przy kazdym kupnie zleceniem rynkowym.
                  # UZGODNIENIE I CENNIK NIZEJ SA TORU CRYPTO (Bybit, `spot_eu`) - po
                  # `torCrypto.enabled: false` nie ma czego uzgadniac.
                  {{- if .Values.torCrypto.enabled }}
                  python services/engine/uzgodnienie.py --kind spot_eu || RC=$?
                  # CENNIK GIELDY KONTRA CENNIK W KODZIE. Sprawdzenie istnialo
                  # od poczatku jako narzedzie CLI i nikt go nigdy nie uruchomil.
                  # Runda kosztuje 0,200%, a mediana zwrotu na transakcje jest
                  # rzedu dziesiatych procenta, wiec cala przewaga miesci sie
                  # w kilku punktach bazowych - a stawki nie sa stale: zmieniaja
                  # je progi VIP, promocje i regulamin podmiotu. Zmiana przelicza
                  # bledy KAZDA transakcje az do chwili, w ktorej ktos zapyta
                  # hosta wprost.
                  #
                  # ROZJAZD NIE OBJAWIA SIE NICZYM: rachunek papierowy dalej
                  # liczy po starej stawce, backtest dalej pokazuje przewage,
                  # a prawdziwy wynik po prostu jest inny - i wyglada jak pech
                  # albo jak zmiana rynku.
                  #
                  # `--stawki`, a nie pelne badanie hosta: pelny przebieg konczy
                  # sie kodem 1 na kazdym hoscie bez sald, czyli na podmiocie
                  # unijnym w demo ZAWSZE. Czujka meldujaca awarie przy kazdym
                  # przebiegu przestaje byc czujka.
                  #
                  # `--kind` MUSI byc ten sam, ktorym chodzi silnik (values.yaml,
                  # workers.crypto: `--kind spot_eu`). Inny rodzaj instrumentu
                  # znaczy porownanie z wierszem CENNIKA, ktorego nikt nie uzywa.
                  python services/exchanges/mozliwosci.py --stawki --kind spot_eu || RC=$?
                  {{- end }}
                  # POSLIZG I ULAMEK WYPELNIENIA. To jedyna linia tego zadania,
                  # ktora nie jest czujka, tylko POMIAREM - i dlatego nie dopisuje
                  # sie do RC. POSLIZG_TAKER = 0,0004 i POSLIZG_MAKER = 0 sa
                  # zalozeniami, a runda kosztuje 0,200% przy medianie zwrotu rzedu
                  # dziesiatych procenta: blad o cztery punkty bazowe przesuwa wynik
                  # o tyle, ile cala zmierzona przewaga. Liczba, ktorej nikt nie
                  # widzi, nie zmieni zadnej decyzji, wiec pomiar ma ladowac tam,
                  # gdzie i tak codziennie sie zaglada. Dopoki nie ma wypelnien,
                  # wypisuje wprost "NIE ZMIERZONO" - a to jest inna informacja
                  # niz zmierzone zero.
                  #
                  # PER TOR, z tego samego powodu co wyzej. Dla equity nie ma
                  # jeszcze ani jednego wypelnienia, wiec pomiar wypisze wprost
                  # "NIE ZMIERZONO" - a to jest inna informacja niz zmierzone
                  # zero i inna niz cisza. Ta linia nie dopisuje sie do RC.
                  {{- range $tor := $tory }}
                  python services/engine/dozor.py --co poslizg --engine {{ $tor.engine | quote }}
                  {{- end }}
                  exit $RC
              env:
                {{- include "trader.bramkaEnv" $ | nindent 16 }}
                # ROLA TYLKO DO ODCZYTU (migracja 0034). Czujka odpowiada na
                # pytanie "czy system jest w stanie, o ktorym czlowiek MUSI
                # wiedziec". Odpowiedz na nie nigdy nie wymaga zapisu - poza
                # samym powiadomieniem. Proces diagnostyczny z prawem zmiany
                # stanu predzej czy pozniej ten stan zmieni i zacznie mierzyc
                # siebie zamiast systemu.
                {{- include "trader.rolaDbEnv" (dict "ctx" $ "rola" "czujka") | nindent 16 }}
                - name: SECRETS_KEY
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.secretName }}, key: SECRETS_KEY }
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                limits:   { cpu: 200m, memory: 256Mi }
                requests: { cpu: 20m,  memory: 64Mi }
{{- end }}
