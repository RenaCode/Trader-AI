{{- if .Values.zywotnoscCron.enabled }}
# Czujka zywotnosci silnikow.
#
# MUSI byc osobnym procesem: martwy proces nie zglosi wlasnej smierci. Petla
# decyzyjna zapisuje risk.engine_heartbeat przy kazdym cyklu, ale az do
# 2026-09-06 nikt tego nie czytal poza dashboardem - a typ zdarzenia
# `engine.down` istnial w bazie od migracji 0007 i nigdy nie zostal wyslany.
#
# Czestotliwosc dobrana do progu: przy progu 15 minut i przebiegu co 10 minut
# awaria jest zgloszona najpozniej po 25 minutach.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trader-zywotnosc
  labels: {{- include "trader.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.zywotnoscCron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      # Bez ponawiania: awaria silnika nie naprawi sie przez powtorzenie
      # sprawdzenia, a kazde powtorzenie wyslaloby to samo powiadomienie.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: zywotnosc
              image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
              imagePullPolicy: {{ .Values.api.image.pullPolicy }}
              # Czujki odpowiadaja na pytanie, czy system jest w stanie,
              # o ktorym czlowiek MUSI wiedziec, i musza dzialac w procesie innym
              # niz obserwowany.
              #
              # WZNOWIENIE TU NIE NALEZY. Siedzi w dozorcy (osobny pod, petla
              # co 60 s), bo jest czescia nadzoru ciaglego, a nie okresowego
              # sprawdzenia. To zadanie ma pilnowac takze SAMEGO DOZORCY -
              # nadzorca, ktorego nikt nie nadzoruje, jest tylko przesunieciem
              # problemu o jeden poziom.
              command:
                - sh
                - -c
                - |
                  RC=0
                  python services/engine/dozor.py --co zywotnosc || RC=$?
                  python services/engine/dozor.py --co ryzyko    || RC=$?
                  python services/engine/dozor.py --co kopie     || RC=$?
                  # SWIEZOSC DANYCH. Puls silnika mowi, ze silnik zyje - nie mowi,
                  # na czym decyduje. Pobieranie swiec i liczenie cech chodza
                  # w OSOBNYCH podach; gdy stana, silnik bije dalej i handluje na
                  # cechach sprzed trzech dni. Stare cechy nie wygladaja jak
                  # awaria, tylko jak rynek, ktory przestal dawac sygnaly.
                  python services/engine/dozor.py --co swiezosc  || RC=$?
                  # PULS WORKEROW DANYCH. Swiezosc wyzej wykrywa SKUTEK - dane
                  # przestaly naplywac - i robi to dopiero po czasie jednej
                  # swiecy zrodlowej, przy 1h nawet po trzech godzinach. Nie
                  # odroznia przy tym "worker stoi" od "gielda nie oddaje
                  # danych" i nie mowi, KTORY z czterech procesow zamilkl: przy
                  # martwym `market`, `history` i `features` sygnal
                  # z feat.feature_value jest ten sam.
                  #
                  # To sprawdzenie pyta o PROCES, a nie o dane: czy domknal
                  # cykl. Prog liczy z INTERWALU danego workera zapisanego przez
                  # niego samego (market 60 s, history 1200 s), wiec nie ma tu
                  # drugiej kopii tej liczby do rozjechania.
                  python services/engine/dozor.py --co workery   || RC=$?
                  # ZDROWIE EGZEKUCJI. exec.order ma kolumne reject_reason od
                  # migracji 0005, a typ zdarzenia order.rejected istnieje
                  # w notify.event_type rownie dlugo - z etykieta, opisem
                  # i cooldownem. NIKT GO NIGDY NIE WYSLAL. Odrzucone zlecenie
                  # wyglada w logu jak brak sygnalu, wiec system moglby nie
                  # handlowac tygodniami przy dozorze meldujacym zdrowie.
                  python services/engine/dozor.py --co egzekucja || RC=$?
                  # UZGODNIENIE Z GIELDA. Nasz obraz stanu i obraz gieldy to dwa
                  # rozne stany, ktore moga sie rozjechac - i zaden ze sposobow
                  # nie objawia sie awaria. Pozycja-widmo blokuje wejscia,
                  # ktorych nic nie blokuje; saldo nieznane to ekspozycja poza
                  # limitami. Na rachunku papierowym sprawdzenie jest tanie
                  # i milczace, a przy wlaczeniu egzekucji dziala od pierwszego dnia.
                  python services/engine/uzgodnienie.py          || RC=$?
                  # POSLIZG I ULAMEK WYPELNIENIA. To jedyna linia tego zadania,
                  # ktora nie jest czujka, tylko POMIAREM - i dlatego nie dopisuje
                  # sie do RC. POSLIZG_TAKER = 0,0004 i POSLIZG_MAKER = 0 sa
                  # zalozeniami, a runda kosztuje 0,200% przy medianie zwrotu rzedu
                  # dziesiatych procenta: blad o cztery punkty bazowe przesuwa wynik
                  # o tyle, ile cala zmierzona przewaga. Liczba, ktorej nikt nie
                  # widzi, nie zmieni zadnej decyzji, wiec pomiar ma ladowac tam,
                  # gdzie i tak codziennie sie zaglada. Dopoki nie ma wypelnien,
                  # wypisuje wprost "NIE ZMIERZONO" - a to jest inna informacja
                  # niz zmierzone zero.
                  python services/engine/dozor.py --co poslizg
                  exit $RC
              env:
                # ROLA TYLKO DO ODCZYTU (migracja 0034). Czujka odpowiada na
                # pytanie "czy system jest w stanie, o ktorym czlowiek MUSI
                # wiedziec". Odpowiedz na nie nigdy nie wymaga zapisu - poza
                # samym powiadomieniem. Proces diagnostyczny z prawem zmiany
                # stanu predzej czy pozniej ten stan zmieni i zacznie mierzyc
                # siebie zamiast systemu.
                {{- include "trader.rolaDbEnv" (dict "ctx" $ "rola" "czujka") | nindent 16 }}
                - name: SECRETS_KEY
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.secretName }}, key: SECRETS_KEY }
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                limits:   { cpu: 200m, memory: 256Mi }
                requests: { cpu: 20m,  memory: 64Mi }
{{- end }}
