apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "trader.fullname" . }}-redis-data
  labels: {{- include "trader.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.redis.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trader.fullname" . }}-redis
  labels: {{- include "trader.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "trader.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "trader.fullname" . }}-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "trader.fullname" . }}-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trader.fullname" . }}-redis
spec:
  selector:
    app: {{ include "trader.fullname" . }}-redis
  ports:
    - port: 6379
      targetPort: 6379
