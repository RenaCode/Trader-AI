{{- if .Values.kopiaPrzedMigracja.enabled }}
# KOPIA PRZED MIGRACJA (audyt Fable U-13, 2026-10-03).
#
# Migracje ida jako initContainer `migrate` w podzie API, przy kazdym
# wdrozeniu z nowym plikiem w `db/migrations` (77 w 37 dni), i sa
# nieodwracalne (bez `down`). Najblizsza kopia byla do tej pory nocna - zla
# migracja o 15:00 znaczyla utrate dnia dziennika decyzji albo odtwarzanie
# reczne.
#
# HOOK ARGO CD `PreSync`, NIE INITCONTAINER W PODZIE API. Initcontainer
# wymagalby katalogu kopii (hostPath) w podzie wystawionym do internetu -
# przejete API mogloby skasowac kopie - i trzymalby API wylaczone przez czas
# zrzutu (~3 min). Hook to osobny pod z rola wlasciciela tylko na czas zrzutu.
#
# ZRZUT TYLKO, GDY SA NOWE MIGRACJE. Pierwszy kontener (obraz API z NOWYM
# tagiem, czyli z nowym katalogiem migracji) wypisuje oczekujace wersje
# (`db/migrate.py --oczekujace`, rola czujki, sam odczyt). Pusty plik =
# zadanie konczy sie po kilku sekundach. Hook chodzi przy KAZDEJ synchronizacji.
#
# FAIL-CLOSED: nieudany zrzut zatrzymuje synchronizacje (Argo CD nie wdroi
# migracji bez kopii). Tak samo brak miejsca: baza lezy na TYM SAMYM dysku
# (local-path), wiec zrzut, ktory zapelnilby wolumen, zatrzymalby baze -
# zadanie sprawdza wolne miejsce PRZED zrzutem (`kopiaPrzedMigracja.
# minWolneMiB`, co najmniej trzykrotnosc ostatniego zrzutu).
#
# RETENCJA PO LICZBIE, NIE PO DNIACH: zostaje `kopiaPrzedMigracja.zostaw`
# ostatnich kompletow (zrzut + wersje + instrukcja). Migracje przychodza
# seriami (kilka w dobe, potem tydzien nic), wiec retencja dniowa albo
# kasowalaby kopie sprzed ostatniej zmiany, albo trzymala ich dziesiatki.
# Nocny `trader-backup` tych plikow nie rusza.
#
# TIMESCALEDB: zrzut jest zwyklym `pg_dump --format=custom`, ale odtwarza sie
# go wylacznie do bazy z TA SAMA wersja rozszerzenia i miedzy
# `timescaledb_pre_restore()` a `timescaledb_post_restore()` - dlatego obok
# leza `.wersje` i `.odtwarzanie.txt`. Role sa w nocnej kopii (`.role.sql`);
# przy odtwarzaniu na tym samym klastrze juz istnieja.
#
# WLACZONE 2026-10-04 decyzja wlasciciela (`kopiaPrzedMigracja.enabled`).
#
# CZEKANIE NA BAZE. Pod ma etykiete `component: job`, a kube-router wpuszcza
# nowy pod do bazy kilka sekund po jego starcie - do tego czasu `Connection
# refused` (ten sam blad co w CronJobach, b0f659a). Kontener `oczekujace`
# czeka wiec na port bazy (`przebieg_zadania.py --tylko-czekaj`) zanim sie
# polaczy; `kopia` startuje po nim, z ta sama regula NetworkPolicy. Do tego
# `backoffLimit: 2`, a aplikacja Argo CD ma `syncPolicy.retry`
# (renacode-infra, argocd-apps.yaml) - jeden przypadkowy blad nie zatrzymuje
# wdrozenia na stale.
#
# AWARYJNIE: gdy hook blokuje synchronizacje, a wdrozenie nie moze czekac -
# `kopiaPrzedMigracja.enabled: false` w values.yaml (commit na `main`) albo
# parametr aplikacji w Argo CD. Wdrozenie idzie wtedy BEZ kopii: najblizsza
# jest nocna (`backup`, 03:17), wiec przy nowych migracjach zrob zrzut recznie.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "trader.fullname" . }}-kopia-przed-migracja
  labels: {{- include "trader.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels: {{- include "trader.etykietyZadania" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: oczekujace
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c", "python services/engine/przebieg_zadania.py --tylko-czekaj 120 && exec python db/migrate.py --oczekujace /wspolne/oczekujace"]
          env:
            {{- include "trader.rolaDbEnv" (dict "ctx" $ "rola" "czujka") | nindent 12 }}
          volumeMounts:
            - name: wspolne
              mountPath: /wspolne
        - name: przygotuj-katalog
          image: busybox:1.36
          command: ["sh", "-c", "chown 1000:1000 /backup && chmod 750 /backup"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: backup
              mountPath: /backup
      containers:
        - name: kopia
          image: "{{ include "trader.obrazBazy" . }}"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD }
            - name: ZOSTAW
              value: {{ required "kopiaPrzedMigracja.zostaw" .Values.kopiaPrzedMigracja.zostaw | quote }}
            - name: MIN_WOLNE_MIB
              value: {{ required "kopiaPrzedMigracja.minWolneMiB" .Values.kopiaPrzedMigracja.minWolneMiB | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              if [ ! -s /wspolne/oczekujace ]; then
                echo "==> brak nowych migracji - kopia niepotrzebna"
                exit 0
              fi
              echo "==> nowe migracje: $(tr '\n' ' ' < /wspolne/oczekujace)"
              DB="-h {{ include "trader.fullname" . }}-db -U {{ .Values.db.username }} -d {{ .Values.db.database }}"

              # MIEJSCE PRZED ZRZUTEM - baza jest na tym samym dysku. Tylko
              # `*.dump`: `*.dump.tmp` to zrzut, ktory nie przeszedl kontroli.
              OSTATNI="$(ls -1t /backup/trader-*.dump 2>/dev/null | head -1 || true)"
              OSTATNI_MIB=0
              [ -z "$OSTATNI" ] || OSTATNI_MIB=$(( $(stat -c %s "$OSTATNI") / 1048576 ))
              POTRZEBA_MIB=$(( OSTATNI_MIB * 3 ))
              [ "$POTRZEBA_MIB" -ge "$MIN_WOLNE_MIB" ] || POTRZEBA_MIB="$MIN_WOLNE_MIB"
              WOLNE_MIB=$(( $(df -Pk /backup | awk 'NR==2 {print $4}') / 1024 ))
              if [ "$WOLNE_MIB" -lt "$POTRZEBA_MIB" ]; then
                echo "!! wolne ${WOLNE_MIB} MiB < ${POTRZEBA_MIB} MiB - zrzut moglby zapelnic dysk bazy; synchronizacja ZATRZYMANA"
                exit 1
              fi
              echo "==> wolne ${WOLNE_MIB} MiB (potrzeba ${POTRZEBA_MIB} MiB)"

              ZNACZNIK="$(date -u +%Y%m%dT%H%M%SZ)"
              BAZA="/backup/trader-przedmigracja-$ZNACZNIK"
              PLIK="$BAZA.dump"
              TYMCZASOWY="$PLIK.tmp"
              WERSJA_TS="$(psql $DB -tAc "SELECT extversion FROM pg_extension WHERE extname = 'timescaledb'")"
              WERSJA_PG="$(psql $DB -tAc "SHOW server_version")"
              [ -n "$WERSJA_TS" ] || { echo "!! baza nie ma rozszerzenia timescaledb"; exit 1; }
              printf 'timescaledb=%s\npostgresql=%s\nobraz=%s\nmigracje=%s\n' \
                     "$WERSJA_TS" "$WERSJA_PG" "{{ include "trader.obrazBazy" . }}" \
                     "$(tr '\n' ' ' < /wspolne/oczekujace)" > "$BAZA.wersje"

              # Nieudany albo obciety zrzut ma NIE zostawac na dysku jako kopia.
              # Zrzut idzie do `.dump.tmp` i dostaje nazwe `.dump` dopiero po
              # `pg_restore --list`: `trap` nie zadziala przy SIGKILL (OOM,
              # `activeDeadlineSeconds`), a wtedy na dysku zostaje plik obciety.
              # Retencja i prog miejsca patrza wylacznie na `*.dump`, wiec
              # porzucony `.tmp` nie udaje kopii; sprzata go nastepny przebieg.
              rm -f /backup/trader-przedmigracja-*.dump.tmp
              trap 'rm -f "$TYMCZASOWY" "$BAZA.wersje"' EXIT
              pg_dump $DB --format=custom --compress=9 --file="$TYMCZASOWY"
              pg_restore --list "$TYMCZASOWY" > /dev/null
              mv "$TYMCZASOWY" "$PLIK"
              trap - EXIT

              cat > "$BAZA.odtwarzanie.txt" <<KONIEC
              KOPIA PRZED MIGRACJA $ZNACZNIK (przed: $(tr '\n' ' ' < /wspolne/oczekujace))
              Cofniecie zlej migracji = odtworzenie CALEJ bazy z tego zrzutu,
              na tym samym klastrze (role juz istnieja). Silnik i workery
              zatrzymane (replicas 0), potem:
                dropdb {{ .Values.db.database }}; createdb -O {{ .Values.db.username }} {{ .Values.db.database }}
                psql -d {{ .Values.db.database }} -c "CREATE EXTENSION timescaledb VERSION '$WERSJA_TS';"
                psql -d {{ .Values.db.database }} -c "SELECT timescaledb_pre_restore();"
                pg_restore -d {{ .Values.db.database }} --no-owner $(basename "$PLIK")
                psql -d {{ .Values.db.database }} -c "SELECT timescaledb_post_restore();"
              i wdrozenie obrazu SPRZED migracji (inaczej migrator zastosuje ja znowu).
              Pelna procedura z rolami: trader-*.odtwarzanie.txt z nocnej kopii.
              KONIEC
              echo "==> kopia przed migracja: $PLIK ($(stat -c %s "$PLIK") B), czytelna"

              # RETENCJA: ostatnie $ZOSTAW kompletow, starsze razem z plikami obok.
              ls -1t /backup/trader-przedmigracja-*.dump | tail -n +$(( ZOSTAW + 1 )) \
                | while read -r STARY; do
                    echo "==> retencja: usuwam ${STARY%.dump}.*"
                    rm -f "${STARY%.dump}".*
                  done
              echo "==> kopie przed migracja na dysku: $(ls -1 /backup/trader-przedmigracja-*.dump | wc -l)"
          resources:
            limits:   { cpu: 1000m, memory: 512Mi }
            requests: { cpu: 100m,  memory: 128Mi }
          volumeMounts:
            - name: wspolne
              mountPath: /wspolne
            - name: backup
              mountPath: /backup
      volumes:
        - name: wspolne
          emptyDir:
            sizeLimit: 1Mi
        - name: backup
          hostPath:
            path: {{ .Values.backup.hostPath | quote }}
            type: DirectoryOrCreate
{{- end }}
