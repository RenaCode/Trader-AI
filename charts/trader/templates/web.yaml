apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trader.fullname" . }}-web
  labels: {{- include "trader.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "trader.fullname" . }}-web
  template:
    metadata:
      labels:
        app: {{ include "trader.fullname" . }}-web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trader.fullname" . }}-web
  labels: {{- include "trader.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "trader.fullname" . }}-web
  ports:
    - port: 80
      targetPort: 80
