replicaCount: 1
# Repo jest prywatne, wiec pakiety w ghcr.io tez - a k3s nie ma PAT-a z read:packages.
# Do czasu jego dodania obrazy sa budowane NA VPS i importowane do containerd
# (scripts/build-on-vps.sh), dlatego pullPolicy ponizej to IfNotPresent, a lista
# sekretow jest pusta - nie ma zadnego pobierania z rejestru.
#
# Po utworzeniu sekretu `ghcr-pull` wystarczy odkomentowac wpis i przywrocic
# pullPolicy: Always, zeby wrocic do czystego GitOps-a z rejestru.
imagePullSecrets: []
#  - name: ghcr-pull

api:
  image:
    repository: ghcr.io/renacode/trader-ai-api
    tag: "sha-0629637"
    pullPolicy: IfNotPresent
  resources:
    limits:   { cpu: 1000m, memory: 1Gi }
    requests: { cpu: 100m,  memory: 256Mi }

web:
  image:
    repository: ghcr.io/renacode/trader-ai-web
    tag: "sha-0629637"
    pullPolicy: IfNotPresent
  resources:
    limits:   { cpu: 200m, memory: 256Mi }
    requests: { cpu: 50m,  memory: 64Mi }

db:
  # timescaledb-ha zawiera TimescaleDB i pgvector w jednym obrazie.
  image:
    repository: timescale/timescaledb-ha
    tag: "pg17"
    pullPolicy: IfNotPresent
  database: trader
  # Wlasciciel schematow - wylacznie migracje i konserwacja.
  username: trader
  # Rola aplikacji i procesow roboczych, bez prawa zmiany struktury.
  appUsername: trader_app
  resources:
    limits:   { cpu: 2000m, memory: 3Gi }
    requests: { cpu: 250m,  memory: 512Mi }
  persistence:
    size: 20Gi
    storageClass: local-path

redis:
  image:
    repository: redis
    tag: "7-alpine"
  persistence:
    size: 1Gi
    storageClass: local-path

# Sekrety NIE trafiaja do gita. Utworz raz recznie:
#   kubectl create secret generic trader-secret \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=SECRETS_KEY=... \
#     --from-literal=ANTHROPIC_API_KEY=...
secretName: trader-secret

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  host: trader.renacode.com
  tlsSecret: trader-tls-cert
  # WYLACZONE: aplikacja ma wlasne logowanie (haslo Argon2id + opcjonalny TOTP,
  # sesje serwerowe, CSRF). BasicAuth na krawedzi bylo tylko zaslona na czas
  # budowy i teraz dublowaloby logowanie, pokazujac uzytkownikowi dwa okna.
  # Zostawione jako awaryjny wylacznik: ustaw enabled=true, zeby odciac ruch
  # do aplikacji bez jej zatrzymywania.
  basicAuth:
    enabled: false
    secretName: trader-basicauth

# Procesy tla. Kazdy dziala niezaleznie - patrz templates/workers.yaml.
workers:
  # Dociaga swiece 1m i snapshoty orderbooka z gieldy. Nie wymaga zadnych kluczy,
  # bo dane rynkowe sa publiczne.
  market:
    enabled: true
    command: ["python", "services/ingest/market_worker.py", "--interval", "60"]
    resources:
      limits:   { cpu: 500m, memory: 384Mi }
      requests: { cpu: 50m,  memory: 96Mi }

  # Utrzymuje aktualna historie godzinowa i stawki finansowania. Swiece 4h powstaja
  # z agregacji 1h, wiec bez tego procesu horyzont domyslny stanalby w miejscu.
  # Backfill jest idempotentny i wznawia od ostatniej posiadanej swiecy, wiec
  # czestsze uruchomienie nic nie psuje - dociaga tylko to, czego brakuje.
  history:
    enabled: true
    command: ["sh", "-c", "while true; do python services/ingest/backfill.py --timeframe 1h --days 3 || true; python services/ingest/funding.py --days 3 || true; sleep 1200; done"]
    resources:
      limits:   { cpu: 500m, memory: 384Mi }
      requests: { cpu: 50m,  memory: 96Mi }

  # Liczy cechy z realnych swiec na horyzoncie domyslnym (4h).
  features:
    enabled: true
    command: ["sh", "-c", "while true; do python services/ingest/features.py --bar 4h --once || true; sleep 900; done"]
    resources:
      limits:   { cpu: 1000m, memory: 768Mi }
      requests: { cpu: 100m,  memory: 192Mi }

  # Petla decyzyjna. Odpala sie po cechach, wiec ma wlasny, przesuniety cykl.
  engine:
    enabled: true
    # Przed wejsciem w petle silnik wykonuje KONTROLE: te same zapytania co
    # produkcja, bez zapisu. Blad w nazwie kolumny wywracal petle przy kazdym
    # przebiegu, a jedynym sladem byl wpis w logu, ktorego nikt nie czytal.
    # Teraz taki blad zatrzymuje pod od razu - widac go w `kubectl get pods`,
    # nie trzeba go szukac.
    command: ["sh", "-c", "sleep 90; python services/engine/loop.py --bar 4h --sprawdz || exit 1; while true; do python services/engine/loop.py --bar 4h --once --quiet || true; sleep 300; done"]
    resources:
      limits:   { cpu: 1000m, memory: 512Mi }
      requests: { cpu: 100m,  memory: 128Mi }

  # Trener walk-forward. Wlasny proces, bo trwa dziesiatki minut - uruchamiany
  # w podzie API ginal przy kazdym wdrozeniu razem z podem. Raz na dobe wystarczy:
  # okna przesuwaja sie o 30 dni, wiec czestsze przeliczanie nic nie wnosi, a
  # kusiloby do zagladania w wyniki i dobierania parametrow, czyli dokladnie tego,
  # przed czym ma chronic walk-forward.
  # WYLACZONY: zastapiony zadaniem cyklicznym (templates/trainer-cron.yaml).
  # Petla w Deploymencie ginela przy kazdym wdrozeniu, takze takim, ktore
  # trenera nie dotyczylo - patrz komentarz w tamtym pliku.
  trainer:
    enabled: false
    command: ["sh", "-c", "sleep 300; while true; do python services/engine/train.py --bar 4h --days 1400 --trials 60 || true; sleep 86400; done"]
    resources:
      limits:   { cpu: 2000m, memory: 2Gi }
      requests: { cpu: 100m,  memory: 256Mi }

  # Skaner wiadomosci. Bez klucza Anthropic konczy sie natychmiast z komunikatem -
  # dlatego wlaczony dopiero wtedy, gdy klucz jest w bazie.
  news:
    enabled: true
    command: ["sh", "-c", "while true; do python services/ingest/news_worker.py --once --quiet || true; sleep 300; done"]
    resources:
      limits:   { cpu: 1000m, memory: 512Mi }
      requests: { cpu: 50m,   memory: 128Mi }

# Kopia zapasowa bazy. Zrzut trafia na dysk hosta, poza wolumen bazy danych.
backup:
  enabled: true
  schedule: "17 3 * * *"        # codziennie 03:17 UTC, poza szczytem zapytań
  retentionDays: 14
  hostPath: /opt/trader-backups

# Trener walk-forward. Zadanie cykliczne, nie proces w Deploymencie - dlugie
# obliczenia nie moga ginac przy wdrozeniach.
trainerCron:
  enabled: true
  schedule: "40 4 * * *"        # codziennie 04:40 UTC, po kopii zapasowej
  bar: "4h"
  days: 1400
  trials: 60
  # Cennik podmiotu UNIJNEGO - tam stoi konto (patrz migracja 0018). Taker
  # kosztuje tam 0,250% zamiast 0,100%, wiec runda zleceniem rynkowym rosnie
  # z 0,280% do 0,580%. Przy tej stawce mediana Sharpe schodzi ponizej zera:
  # zlecenia rynkowe na tej gieldzie nie maja sensu, zostaje egzekucja
  # z limitem, gdzie stawka maker jest identyczna jak globalnie. Pomiar
  # w docs/03.
  kind: "spot_eu"
  limit: true
  # Limity dobrane do ZMIERZONEGO zuzycia (388 MB przy pelnym przebiegu na
  # 24 instrumentach), nie do zapasu "na wszelki wypadek". Wezel ma 7,8 GB
  # i dzieli je z trzema innymi projektami; limit 3 GB dla zadania, ktore
  # bierze 0,4 GB, podnosil przeciazenie do 186% bez zadnego pozytku.
  resources:
    limits:   { cpu: 2000m, memory: 1Gi }
    requests: { cpu: 200m,  memory: 384Mi }
