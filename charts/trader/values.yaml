replicaCount: 1
# Repo jest prywatne, wiec pakiety w ghcr.io tez - a k3s nie ma PAT-a z read:packages.
# Do czasu jego dodania obrazy sa budowane NA VPS i importowane do containerd
# (scripts/build-on-vps.sh), dlatego pullPolicy ponizej to IfNotPresent, a lista
# sekretow jest pusta - nie ma zadnego pobierania z rejestru.
#
# Po utworzeniu sekretu `ghcr-pull` wystarczy odkomentowac wpis i przywrocic
# pullPolicy: Always, zeby wrocic do czystego GitOps-a z rejestru.
imagePullSecrets: []
#  - name: ghcr-pull

api:
  image:
    repository: ghcr.io/renacode/trader-ai-api
    tag: "sha-b97d499"
    pullPolicy: IfNotPresent
  resources:
    limits:   { cpu: 1000m, memory: 1Gi }
    requests: { cpu: 100m,  memory: 256Mi }

web:
  image:
    repository: ghcr.io/renacode/trader-ai-web
    tag: "sha-b97d499"
    pullPolicy: IfNotPresent
  resources:
    limits:   { cpu: 200m, memory: 256Mi }
    requests: { cpu: 50m,  memory: 64Mi }

db:
  # timescaledb-ha zawiera TimescaleDB i pgvector w jednym obrazie.
  image:
    repository: timescale/timescaledb-ha
    tag: "pg17"
    pullPolicy: IfNotPresent
  database: trader
  username: trader
  resources:
    limits:   { cpu: 2000m, memory: 3Gi }
    requests: { cpu: 250m,  memory: 512Mi }
  persistence:
    size: 20Gi
    storageClass: local-path

redis:
  image:
    repository: redis
    tag: "7-alpine"
  persistence:
    size: 1Gi
    storageClass: local-path

# Sekrety NIE trafiaja do gita. Utworz raz recznie:
#   kubectl create secret generic trader-secret \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=SECRETS_KEY=... \
#     --from-literal=ANTHROPIC_API_KEY=...
secretName: trader-secret

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  host: trader.renacode.com
  tlsSecret: trader-tls-cert
  # WYLACZONE: aplikacja ma wlasne logowanie (haslo Argon2id + opcjonalny TOTP,
  # sesje serwerowe, CSRF). BasicAuth na krawedzi bylo tylko zaslona na czas
  # budowy i teraz dublowaloby logowanie, pokazujac uzytkownikowi dwa okna.
  # Zostawione jako awaryjny wylacznik: ustaw enabled=true, zeby odciac ruch
  # do aplikacji bez jej zatrzymywania.
  basicAuth:
    enabled: false
    secretName: trader-basicauth

# Procesy tla. Kazdy dziala niezaleznie - patrz templates/workers.yaml.
workers:
  # Dociaga swiece 1m i snapshoty orderbooka z gieldy. Nie wymaga zadnych kluczy,
  # bo dane rynkowe sa publiczne.
  market:
    enabled: true
    command: ["python", "services/ingest/market_worker.py", "--interval", "60"]
    resources:
      limits:   { cpu: 500m, memory: 384Mi }
      requests: { cpu: 50m,  memory: 96Mi }

  # Liczy cechy z realnych swiec. Co 5 minut, bo taka jest rozdzielczosc cech.
  features:
    enabled: true
    command: ["sh", "-c", "while true; do python services/ingest/features.py --once || true; sleep 300; done"]
    resources:
      limits:   { cpu: 1000m, memory: 768Mi }
      requests: { cpu: 100m,  memory: 192Mi }

  # Petla decyzyjna. Odpala sie po cechach, wiec ma wlasny, przesuniety cykl.
  engine:
    enabled: true
    command: ["sh", "-c", "sleep 90; while true; do python services/engine/loop.py --once --quiet || true; sleep 300; done"]
    resources:
      limits:   { cpu: 1000m, memory: 512Mi }
      requests: { cpu: 100m,  memory: 128Mi }

  # Trener walk-forward. Wlasny proces, bo trwa dziesiatki minut - uruchamiany
  # w podzie API ginal przy kazdym wdrozeniu razem z podem. Raz na dobe wystarczy:
  # okna przesuwaja sie o 2 dni, wiec czestsze przeliczanie nic nie wnosi, a
  # kusiloby do zagladania w wyniki i dobierania parametrow, czyli dokladnie tego,
  # przed czym ma chronic walk-forward.
  trainer:
    enabled: true
    command: ["sh", "-c", "sleep 300; while true; do python services/engine/train.py --days 90 --trials 40 || true; sleep 86400; done"]
    resources:
      limits:   { cpu: 2000m, memory: 2Gi }
      requests: { cpu: 100m,  memory: 256Mi }

  # Skaner wiadomosci. Bez klucza Anthropic konczy sie natychmiast z komunikatem -
  # dlatego wlaczony dopiero wtedy, gdy klucz jest w bazie.
  news:
    enabled: true
    command: ["sh", "-c", "while true; do python services/ingest/news_worker.py --once --quiet || true; sleep 300; done"]
    resources:
      limits:   { cpu: 1000m, memory: 512Mi }
      requests: { cpu: 50m,   memory: 128Mi }
