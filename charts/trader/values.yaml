replicaCount: 1
# Repo jest prywatne, wiec obrazy w ghcr.io tez. Sekret tworzony raz, recznie:
#   kubectl create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<login> --docker-password=<PAT z read:packages>
imagePullSecrets:
  - name: ghcr-pull

api:
  image:
    repository: ghcr.io/renacode/trader-ai-api
    tag: "sha-8ec590a"
    pullPolicy: Always
  resources:
    limits:   { cpu: 1000m, memory: 1Gi }
    requests: { cpu: 100m,  memory: 256Mi }

web:
  image:
    repository: ghcr.io/renacode/trader-ai-web
    tag: "sha-16fc098"
    pullPolicy: Always
  resources:
    limits:   { cpu: 200m, memory: 256Mi }
    requests: { cpu: 50m,  memory: 64Mi }

db:
  # timescaledb-ha zawiera TimescaleDB i pgvector w jednym obrazie.
  image:
    repository: timescale/timescaledb-ha
    tag: "pg17"
    pullPolicy: IfNotPresent
  database: trader
  username: trader
  resources:
    limits:   { cpu: 2000m, memory: 3Gi }
    requests: { cpu: 250m,  memory: 512Mi }
  persistence:
    size: 20Gi
    storageClass: local-path

redis:
  image:
    repository: redis
    tag: "7-alpine"
  persistence:
    size: 1Gi
    storageClass: local-path

# Sekrety NIE trafiaja do gita. Utworz raz recznie:
#   kubectl create secret generic trader-secret \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=SECRETS_KEY=... \
#     --from-literal=ANTHROPIC_API_KEY=...
secretName: trader-secret

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  host: trader.renacode.com
  tlsSecret: trader-tls-cert
  # Bramka tymczasowa do czasu wdrozenia logowania z 2FA - patrz
  # templates/basicauth.yaml. Sekret tworzony recznie:
  #   htpasswd -nbB <user> <haslo> | kubectl create secret generic trader-basicauth --from-file=users=/dev/stdin
  basicAuth:
    enabled: true
    secretName: trader-basicauth
