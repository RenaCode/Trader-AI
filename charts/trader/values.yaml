replicaCount: 1

# Ile starych ReplicaSetow trzymac po rolloucie. Domyslne k8s to 10, co przy
# deployu z kazdego pusha uzbieralo 115 pustych RS w ~2.5 miesiaca.
revisionHistoryLimit: 3
# POBIERANIE OBRAZOW Z REJESTRU (2026-09-24).
#
# Do tej daty obrazy powstawaly NA VPS (`scripts/build-on-vps.sh`) i byly
# importowane wprost do containerd, bo repo jest prywatne, wiec pakiety w ghcr
# tez - a klaster nie mial czym sie do nich uwierzytelnic. CI przez caly ten
# czas budowalo i wypychalo te same obrazy do ghcr, z ktorego nikt nie korzystal:
# kazdy commit byl budowany DWA RAZY, a wdrozenie wymagalo recznego kroku na
# serwerze. Skrypt zostal usuniety razem z ta zmiana.
#
# Sekret `ghcr-pull` (docker-registry, token z `read:packages`) tworzy sie POZA
# repozytorium - patrz README. Bez niego kazde wdrozenie nowego commita konczy
# sie `ImagePullBackOff`, bo obraz istnieje wylacznie w rejestrze.
imagePullSecrets:
  - name: ghcr-pull

# `pullPolicy: IfNotPresent` ZOSTAJE, mimo powrotu do rejestru - i nie jest to
# pozostalosc po imporcie do containerd. Tag `sha-<commit>` jest NIEZMIENNY:
# ten sam tag zawsze znaczy ten sam obraz, wiec ponowne pytanie rejestru przy
# kazdym restarcie poda nie moze przyniesc nic nowego. `Always` ma sens dla
# tagow ruchomych (`latest`), ktorych tu nie uzywamy, a kosztuje odpytanie
# rejestru przy kazdym starcie kontenera - takze wtedy, gdy rejestr nie
# odpowiada, czyli dokladnie w chwili, gdy pod ma wstac najszybciej.
api:
  image:
    repository: ghcr.io/renacode/trader-ai-api
    tag: "sha-4c7a234"
    pullPolicy: IfNotPresent
  resources:
    limits:   { cpu: 1000m, memory: 1Gi }
    requests: { cpu: 100m,  memory: 256Mi }

web:
  image:
    repository: ghcr.io/renacode/trader-ai-web
    tag: "sha-133fc58"
    pullPolicy: IfNotPresent
  resources:
    limits:   { cpu: 200m, memory: 256Mi }
    requests: { cpu: 50m,  memory: 64Mi }

db:
  # timescaledb-ha zawiera TimescaleDB i pgvector w jednym obrazie.
  image:
    repository: timescale/timescaledb-ha
    tag: "pg17"
    # PRZYPIECIE PO DIGESCIE. Tag `pg17` jest ruchomy, a `IfNotPresent` trzymal
    # na wezle ten obraz, ktory przyszedl pierwszy - nowy wezel albo czysty
    # cache dostalby inna wersje TimescaleDB pod ta sama nazwa.
    #
    # Digest obrazu, na ktorym baza dziala na klastrze (imageID poda,
    # odczytany 2026-10-03). Aktualny `pg17` w rejestrze to juz inna wersja
    # (sha256:2fcc39a5d4c8a65f58691ef92c7819df5773db72397b2dd8493f114659b519c2)
    # - przejscie na nia to osobna decyzja z kopia przed.
    #
    # UWAGA WDROZENIOWA - TO JEST DIGEST REJESTRU, NIE DIGEST, KTORY CHODZI.
    # Pod bazy na klastrze moze stac na starszym obrazie pobranym pod tym
    # samym tagiem. Zmiana tej linii restartuje pod bazy (Recreate), a inny
    # digest niz biezacy oznacza PODBICIE wersji Postgresa/TimescaleDB w tym
    # restarcie. Przed wdrozeniem odczytaj digest dzialajacego poda:
    #   kubectl get pod -l app=trader-db -o jsonpath='{..imageID}'
    # i jesli jest inny, wpisz TAMTEN (przypiecie bez zmiany wersji); podbicie
    # wersji to osobna, swiadoma decyzja z kopia przed.
    digest: "sha256:a693dd7fbb75b51c3d717507a9956501686edb123b48dd90b094fd5612d53abe"
    pullPolicy: IfNotPresent
  database: trader
  # Wlasciciel schematow - wylacznie migracje i konserwacja.
  username: trader
  # Rola aplikacji i procesow roboczych, bez prawa zmiany struktury.
  # ROLA OSOBNA DLA KAZDEGO PROCESU (migracja 0034).
  #
  # Do 0034 silnik, dozorca ryzyka, czujka zywotnosci i proba pozarowa laczyly
  # sie ta sama rola `trader_app`. Nic nie WYMUSZALO, ze silnik nie zwolni sobie
  # kill-switcha - nie robil tego, bo nie mial takiego kodu, a nie dlatego, ze
  # nie mogl. Wystarczyla jedna linijka dopisana w pospiechu albo jeden blad
  # w module egzekucji, zeby proces, ktory wlasnie traci pieniadze, sam sobie
  # zdjal hamulec.
  #
  # Rozdzial uprawnien jest wart tyle, ile rozdzial POSWIADCZEN: wspolne haslo
  # znaczyloby, ze proces o wezszych nadaniach po prostu laczy sie ta rola,
  # ktora ma szersze. Stad osobny klucz w sekrecie dla kazdej roli.
  #
  # UWAGA WDROZENIOWA: bez tych kluczy w sekrecie `trader-secret` role zostaja
  # bez hasla i ich pody sie nie polacza. To jest zachowanie zamierzone - pod,
  # ktory nie wstal, widac w `kubectl get pods`; proces chodzacy na cudzych
  # poswiadczeniach nie widac wcale.
  role:
    # Petla decyzyjna i procesy zbierajace dane. HANDLUJE, wiec ma klucze
    # gieldy - i wlasnie dlatego nie ma prawa zwolnic zatrzymania, ktore jej
    # dotyczy (brak UPDATE na risk.killswitch_event) ani ruszyc limitu.
    silnik:
      user: trader_silnik
      secretKey: SILNIK_DB_PASSWORD
    # Nadzorca ryzyka. Jedyny proces automatyczny, ktory ZWALNIA kill-switch -
    # i to wylacznie trzy kolumny zwolnienia, bez prawa przepisania powodu.
    # Nie handluje i nie widzi kluczy gieldy (app.api_credential), bo docs/06
    # wprost odrzuca awaryjne domykanie pozycji z tego procesu.
    dozorca:
      user: trader_dozorca
      secretKey: DOZORCA_DB_PASSWORD
    # Czujka zywotnosci i uzgodnienie z gielda. TYLKO CZYTA, poza
    # powiadomieniami. Diagnoza, ktora potrafi zmienic stan, predzej czy pozniej
    # go zmieni - i wtedy mierzy siebie.
    czujka:
      user: trader_czujka
      secretKey: CZUJKA_DB_PASSWORD
    # Proba pozarowa kill-switcha. Jedyna rola poza wlascicielem, ktora moze
    # ruszyc wartosc limitu - i wylacznie `value`, nigdy `enabled` ani `action`.
    proba:
      user: trader_proba
      secretKey: PROBA_DB_PASSWORD
    # Skaner wiadomosci (migracja 0052). JEDYNY proces przetwarzajacy tresc od
    # obcych - dziesiec kanalow RSS i odpowiedzi modeli jezykowych - czyli
    # najwieksza powierzchnia ataku we wdrozeniu. Nie handluje i nie widzi
    # zaszyfrowanych kluczy gieldy (app.api_credential): SECRETS_KEY, ktory ma
    # w srodowisku, odszyfrowuje tu wylacznie klucz dostawcy analizy
    # (widok app.secret_llm), i nic wiecej.
    news:
      user: trader_news
      secretKey: NEWS_DB_PASSWORD
    # Dziennik jakosciowy (migracja 0054). Robi dwie rzeczy naraz: CZYTA pelna
    # historie handlu i WYSYLA jej streszczenie do dostawcy LLM. Zadna
    # z istniejacych rol nie pasuje - silnik ma klucze gieldy, skaner ma
    # z 0052 zakaz siegania do `exec`/`journal`/`learn`, a czujka tylko czyta.
    # Zapis ma do DWOCH tabel i obie sa jego wlasnym wytworem.
    postmortem:
      user: trader_postmortem
      secretKey: POSTMORTEM_DB_PASSWORD
  appUsername: trader_app
  resources:
    limits:   { cpu: 2000m, memory: 3Gi }
    requests: { cpu: 250m,  memory: 512Mi }
  persistence:
    size: 20Gi
    storageClass: local-path

# Sekrety NIE trafiaja do gita. Utworz raz recznie:
#   kubectl create secret generic trader-secret \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=SECRETS_KEY=... \
#     --from-literal=ANTHROPIC_API_KEY=...
secretName: trader-secret

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  host: trader.renacode.com
  tlsSecret: trader-tls-cert
  # WYLACZONE: aplikacja ma wlasne logowanie (haslo Argon2id + opcjonalny TOTP,
  # sesje serwerowe, CSRF). BasicAuth na krawedzi bylo tylko zaslona na czas
  # budowy i teraz dublowaloby logowanie, pokazujac uzytkownikowi dwa okna.
  # Zostawione jako awaryjny wylacznik: ustaw enabled=true, zeby odciac ruch
  # do aplikacji bez jej zatrzymywania.
  basicAuth:
    enabled: false
    secretName: trader-basicauth

# NETWORKPOLICY - KTO MOZE OTWORZYC POLACZENIE DO PODOW TEGO CHARTU
# (templates/networkpolicy.yaml, 2026-10-03).
#
# Do tej daty w `default` nie bylo ani jednej polityki: KAZDY pod w klastrze -
# kidwatch, dietetyk, strona, cokolwiek przejetego w ktorymkolwiek z nich -
# mogl otworzyc trader-db:5432 i probowac hasel rol. Polityki dotycza WYLACZNIE
# ruchu przychodzacego (bez Egress) i tylko podow tego chartu:
#
#   trader-db   :5432  <- trader-api, kazdy wlaczony worker (etykieta `app`)
#                         i pody CronJobow (`trader.renacode.com/component: job`)
#   trader-api  :8000  <- trader-web (nginx, `location /api`)
#   trader-web  :80    <- Traefik z kube-system (Ingress trader.renacode.com)
#   workery, Joby      <- nikt (nie nasluchuja na zadnym porcie)
#
# Zmierzone na klastrze 2026-10-03 (`ss` w przestrzeniach sieciowych podow):
# do bazy laczyly sie api i dozorcy, do trader-web wylacznie Traefik
# (10.42.0.6). Monitoring, bramka i Argo CD NIE lacza sie z zadnym podem tego
# chartu - monitoring pyta API klastra i kubeleta, Argo CD tylko API klastra.
#
# Czego polityka NIE blokuje, i to jest wlasnosc kube-routera w k3s, nie
# zaniedbanie: ruchu z adresu WEZLA (`--src-type LOCAL` przed lancuchem
# polityk). Dzieki temu sondy kubeleta i `kubectl port-forward` dzialaja bez
# reguly ipBlock.
#
# RECZNY JOB bez szablonu CronJoba (np. `kubectl create job ... --image=...`)
# NIE dostanie sie do bazy. `kubectl create job --from=cronjob/...` dostanie,
# bo kopiuje etykiety szablonu.
#
# Szybkie wycofanie: `enabled: false` (Argo CD usunie polityki przy synchro).
networkPolicy:
  enabled: true
  # Skad przychodzi ruch z Ingressu. Traefik z k3s proxuje z WLASNEGO adresu
  # poda (hostPort idzie przez svclb do Service traefika, a dopiero ten pod
  # otwiera polaczenie do trader-web), wiec zrodlem jest pod, nie wezel.
  traefik:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik
  # EGRESS (2026-10-03): pody tego chartu NIE dochodza do sieci domowej.
  # Wezel ma trase do 192.168.3.0/24 (LAN: UDM, TV, Fibaro) i 10.13.13.0/24
  # (tunel WireGuard; 10.13.13.1 to wg0 SAMEGO wezla) przez wg0, a UDM wpuszcza
  # cale 10.13.13.0/24 - audyt 03.10 doszedl z poda tradera do UDM :443, TV
  # :5555 i Fibaro :80. Reszta ruchu wychodzacego zostaje bez zmian: DNS,
  # pody klastra, internet, API klastra. Reguly: `trader.regulyEgress`
  # w _helpers.tpl. Z 10.13.13.1 nie korzysta zaden pod (adres sluzy tylko
  # ruchowi Z domu do Traefika), wiec blokowane jest cale /24.
  #
  # Szybkie wycofanie samego egress: `egress.enabled: false`.
  egress:
    enabled: true
    siecDomowa:
      - 192.168.3.0/24
      - 10.13.13.0/24

# MODELE I LIMITY ANALIZY WIADOMOSCI.
#
# DLACZEGO TE WARTOSCI STOJA TUTAJ, A NIE W DOMYSLACH KODU
#
# Do 12.09.2026 nie stalo tu nic. `services/ingest/llm.py` mial wpisane
# `os.environ.get("ANALYSIS_MODEL", "claude-opus-5")`, zmiennej nie ustawial ani
# chart, ani zaden ConfigMap, wiec kazda analiza szla na najdrozszym modelu -
# i nie bylo w repozytorium miejsca, z ktorego dalo sie to odczytac. Zeby
# dowiedziec sie, jakim modelem pracuje produkcja, trzeba bylo przeczytac kod
# biblioteki i sprawdzic klaster. Kosztowalo to $0,0082 za artykul wobec
# $0,0002 za triaz, przy 126 analizach.
#
# Wartosc domyslna w kodzie jest ZABEZPIECZENIEM na wypadek braku zmiennej.
# Nie jest deklaracja tego, czym system ma pracowac - ta nalezy tutaj i ma sie
# dac zmienic bez przebudowy obrazu.
llm:
  # Model ANALIZY - wytwarza wartosc cechy `news_sent`.
  #
  # UWAGA PRZY ZMIANIE: podmiana modelu w srodku doby wstawia w szereg cechy
  # USKOK, ktorego kalibracja wagi nie zaklada. Zmieniac razem z decyzja, co
  # zrobic z historia cechy, a nie mimochodem.
  #
  # Od 2026-09-22 analiza MA zejscie awaryjne na model Gemini (`analysisModelGemini`),
  # gdy Anthropic odmawia lub jest odciety - decyzja wlasciciela po 13 dniach
  # dziury w cesze przy pustym koncie. Zejscie jest glosne w logu, a kazdy
  # wiersz `news.article_analysis` niesie model, ktory go wytworzyl.
  analysisModel: "claude-opus-5"
  # Model TRIAZU - wybiera artykuly, nie ocenia ich. Zmiana zmienia probke,
  # nie wartosc cechy, wiec jest znacznie mniej rygorystyczna.
  triageModel: "claude-haiku-4-5"
  # Odpowiedniki u Gemini, gdy ustawiony jest jego klucz. Mieszanka kieruje
  # triaz do Gemini (5,5x taniej przy 94% wywolan), analize do Anthropica.
  analysisModelGemini: "gemini-3.5-flash"
  triageModelGemini: "gemini-3.5-flash-lite"
  # TWARDY LIMIT KWOTOWY na dobe.
  dailyUsd: "5.0"
  # TWARDY LIMIT LICZBY WYWOLAN na dobe - druga bramka, nie zamiennik.
  #
  # Kwotowa nie zadzialala ANI RAZU: 11.09.2026 potok stanal calkowicie przy
  # $0,114 z $5, bo zatrzymal go DARMOWY prog Gemini liczony w zapytaniach,
  # ktorego dziennik wydatkow nie widzi. Bramka mierzaca inna wielkosc niz
  # dostawca nie zatrzyma niczego przed nim.
  #
  # 1500 lezy miedzy zdrowa doba (503-516 wywolan, 07-11.09) a doba z petla
  # deduplikacji (4404, 09.09). Lapie ucieczke, nie dotyka pracy.
  dailyCalls: "1500"

# Procesy tla. Kazdy dziala niezaleznie - patrz templates/workers.yaml.
workers:
  # Dociaga swiece 1m i snapshoty orderbooka z gieldy. Nie wymaga zadnych kluczy,
  # bo dane rynkowe sa publiczne.
  market:
    enabled: true
    command: ["python", "services/ingest/market_worker.py", "--interval", "60"]
    resources:
      limits:   { cpu: 500m, memory: 384Mi }
      requests: { cpu: 50m,  memory: 96Mi }

  # GIELDA TRADYCYJNA (Alpaca, paper) - te same procesy co dla krypto, inny
  # silnik. Dane rynkowe Alpaki wymagaja klucza (Alpaca Data), wiec worker
  # czyta go z app.api_credential jak silnik (SECRETS_KEY ma z workers.yaml).
  # Poza sesja (16:00-09:30 ET, weekendy) cykle sa puste - to norma, nie
  # awaria; puls bije, bo cykl SIE UDAL. Osobne nazwy pulsu: market-equity,
  # history-equity.
  market-equity:
    enabled: true
    command: ["python", "services/ingest/market_worker.py", "--interval", "60", "--engine", "equity", "--depth", "1"]
    resources:
      limits:   { cpu: 500m, memory: 384Mi }
      requests: { cpu: 50m,  memory: 96Mi }

  # Krzywa kapitalu equity z KSIAG konta paper (equity, gotowka, ekspozycja),
  # dopoki silnik equity nie liczy jej z wlasnych wypelnien. Co 15 min.
  kapital-equity:
    enabled: true
    command: ["python", "services/engine/kapital_gieldy.py", "--engine", "equity", "--mode", "demo", "--interval", "900"]
    resources:
      limits:   { cpu: 200m, memory: 256Mi }
      requests: { cpu: 20m,  memory: 64Mi }

  history-equity:
    enabled: true
    command: ["python", "services/ingest/history_worker.py", "--interval", "1200", "--days", "3", "--timeframe", "1h", "--engine", "equity"]
    resources:
      limits:   { cpu: 500m, memory: 384Mi }
      requests: { cpu: 50m,  memory: 96Mi }

  # Utrzymuje aktualna historie godzinowa i stawki finansowania. Swiece 4h powstaja
  # z agregacji 1h, wiec bez tego procesu horyzont domyslny stanalby w miejscu.
  # Backfill jest idempotentny i wznawia od ostatniej posiadanej swiecy, wiec
  # czestsze uruchomienie nic nie psuje - dociaga tylko to, czego brakuje.
  #
  # PETLA JEST W SERWISIE, NIE W SHELLU.
  #
  # Wczesniej stalo tu `while true; do backfill || true; funding || true;
  # sleep 1200; done`. `|| true` polykal KAZDY niezerowy wynik, wiec awaria
  # pobierania nie restartowala kontenera ani nie podnosila licznika restartow:
  # pod stal "Running", k3s meldowal zdrowie, a historia mogla stac od dni.
  # Proces startowal przy tym od nowa co cykl, wiec nie mial pojecia o awariach
  # poprzednich - piec padnietych cykli z rzedu wygladalo jak piec udanych.
  #
  # Oba zadania sa teraz jednym procesem (history_worker), ktory laczy sie
  # z baza na kazdy cykl i KONCZY SIE po pieciu awariach pod rzad - bo restart
  # poda widac, a wpis w logu nie.
  history:
    enabled: true
    command: ["python", "services/ingest/history_worker.py", "--interval", "1200", "--days", "3", "--timeframe", "1h"]
    resources:
      limits:   { cpu: 500m, memory: 384Mi }
      requests: { cpu: 50m,  memory: 96Mi }

  # Liczy cechy na KAZDYM trenowanym horyzoncie.
  #
  # Lista musi sie zgadzac z trainerCron.horyzonty. Rozjazd nie objawia sie
  # awaria: trener po prostu uczy sie na cechach, ktore przestaly przychodzic,
  # a wynik degraduje sie po cichu z kazda doba. Zdarzylo sie to 2026-09-04 -
  # drugi horyzont doszedl do trenera, a nie doszedl tutaj, i cechy 1h stanely
  # na 21 godzin, zanim ktos spojrzal.
  #
  # PETLA JEST W SERWISIE, NIE W SHELLU.
  #
  # Wczesniej stalo tu `while true; do for B in 4h 1h; do features.py --bar $B
  # --once || true; done; sleep 900; done`. `|| true` polykal KAZDY niezerowy
  # wynik, wiec cichy zanik cech nie restartowal kontenera ani nie podnosil
  # licznika restartow. `--once` bylo w tamtej komendzie flaga MARTWA: modul
  # nigdzie jej nie czytal, a jej opis ("tylko ostatnia doba") opisywal
  # zachowanie domyslne - wygladala wiec jak "jeden cykl", a nie robila nic.
  #
  # Lista horyzontow idzie teraz jednym argumentem: jeden proces, jedna petla,
  # polaczenie z baza na kazdy cykl, koniec procesu po pieciu awariach pod rzad.
  features:
    enabled: true
    command: ["python", "services/ingest/features.py", "--bar", "4h,1h", "--interval", "900"]
    resources:
      limits:   { cpu: 1000m, memory: 768Mi }
      requests: { cpu: 100m,  memory: 192Mi }

  # Cechy dla silnika gieldowego. OSOBNY PROCES, nie kolejny argument obok
  # krypto, bo `features.py` liczy JEDEN silnik na przebieg (`--engine` filtruje
  # `ref.instrument`), a puls ma wtedy wlasny wiersz `features-equity` - smierc
  # jednego z potokow zostaje widoczna zamiast byc przykryta pulsem drugiego.
  #
  # TYLKO 1h, i to nie z oszczednosci. Sesja gieldowa trwa 6,5 godziny, wiec
  # swieca 4h nie dzieli sesji na rowne czesci: pierwsza obejmowalaby 13:00-17:00
  # UTC, druga 17:00-20:00 doklejone do nocnej przerwy. Agregat z `time_bucket`
  # zlozylby swiece o roznej liczbie notowan i nazwal je tak samo. Dane
  # godzinowe siedza na siatce 13:00-19:00 UTC (7 swiec na sesje, zmierzone na
  # produkcji 2026-09-24) i to jest jedyny horyzont, na ktorym swieca equity
  # znaczy to samo co swieca equity obok.
  #
  # --okno-dni 7 ZAMIAST DOMYSLNEJ DOBY. Swieca dostaje cechy dopiero wtedy,
  # gdy istnieje swieca po niej (ostatnia w panelu jest jeszcze otwarta).
  # Po piatkowym zamknieciu nastepna swieca przychodzi 65 godzin pozniej, wiec
  # w oknie jednodobowym piatkowa nie dostalaby cech NIGDY - co tydzien, kazdy
  # instrument, bez jednego bledu w logu. Siedem dni przykrywa takze przerwy
  # swiateczne i zamkniecia nadzwyczajne.
  features-equity:
    enabled: true
    command: ["python", "services/ingest/features.py", "--bar", "1h",
              "--engine", "equity", "--okno-dni", "7", "--interval", "900"]
    resources:
      limits:   { cpu: 1000m, memory: 768Mi }
      requests: { cpu: 100m,  memory: 192Mi }

  # Petla decyzyjna. Odpala sie po cechach, wiec ma wlasny, przesuniety cykl.
  engine:
    enabled: true
    # Przed wejsciem w petle silnik wykonuje KONTROLE: te same zapytania co
    # produkcja, bez zapisu. Blad w nazwie kolumny wywracal petle przy kazdym
    # przebiegu, a jedynym sladem byl wpis w logu, ktorego nikt nie czytal.
    # Teraz taki blad zatrzymuje pod od razu - widac go w `kubectl get pods`,
    # nie trzeba go szukac.
    # --kind i --limit MUSZA sie zgadzac z trainerCron: rachunek papierowy ma
    # kosztowac tyle, ile kosztuje strategia, ktora kalibrujemy. Do 2026-09-06
    # petla miala wlasna stala 0,055% - stawke perpetualow - i liczyla rundzie
    # 0,190% zamiast 0,200%, a przy zleceniach rynkowych na tej gieldzie 0,580%.
    # PETLA JEST W SERWISIE, NIE W SHELLU.
    #
    # Wczesniej staly tu `while true ... || true; sleep 300`. Trzy skutki, kazdy
    # zly i zaden widoczny:
    #   * `|| true` polykal KAZDY niezerowy wynik, wiec awaria silnika nie
    #     restartowala kontenera ani nie podnosila licznika restartow. Pod stal
    #     "Running", k3s meldowal zdrowie, a silnik mogl nie handlowac od dni,
    #   * `--quiet` wyciszal takze opisy bledow, zostawiajac sam licznik,
    #   * `--once` w petli shella ukrywal, ze wewnetrzna petla trzymala jedno
    #     polaczenie do bazy na caly proces.
    #
    # Teraz proces zyje wlasna petla, sam laczy sie na kazdy cykl i KONCZY SIE
    # po pieciu awariach pod rzad - bo restart poda widac, a wpis w logu nie.
    #
    # EGZEKUCJA NA GIELDZIE, TRYB DEMO. Od tego przelacznika plan przestaje byc
    # rozstrzygany przez swiece, a zaczyna przez gielde: ilosc, cena i prowizja
    # przestaja byc naszym zalozeniem. Rachunek papierowy zakladal wypelnienie
    # w CALOSCI zawsze, gdy cena dotknela limitu - optymistycznie w dwie strony
    # naraz.
    #
    # Tryb demo wybrany swiadomie: konto jest odseparowane, a bez niego poslizg
    # i ulamek wypelnienia pozostawalyby ZALOZENIEM. Blad o cztery punkty bazowe
    # przesuwa wynik o tyle, ile cala zmierzona przewaga.
    command: ["sh", "-c", "sleep 90; python services/engine/loop.py --bar 4h --sprawdz && exec python services/engine/loop.py --bar 4h --interval 300 --kind spot_eu --limit --egzekucja gielda --mode demo"]
    resources:
      limits:   { cpu: 1000m, memory: 512Mi }
      requests: { cpu: 100m,  memory: 128Mi }

  # PETLA DECYZYJNA SILNIKA GIELDOWEGO. Ten sam modul, ten sam obraz, ten sam
  # ksztalt komendy co wyzej - rozni sie tym, czym rozni sie rynek.
  #
  # --bar 1h, NIE 4h. Ten sam powod co przy `features-equity`: sesja trwa
  # 6,5 godziny, wiec swieca 4h nie dzieli jej na rowne czesci, a horyzont,
  # ktorego nie liczy potok cech, silnik obstawialby na pustce. Rozjazd tej
  # liczby z `trainerCron.equity.horyzonty` i z `features-equity` nie objawilby
  # sie awaria - objawilby sie silnikiem, ktory nie znajduje cech i cichnie.
  #
  # --kind stock: cennik Alpaki (zero prowizji, services/engine/koszty.py),
  # a nie `spot_eu` Bybita. Rachunek papierowy i trener musza kosztowac tyle,
  # ile kosztuje strategia, ktora kalibrujemy.
  #
  # --wymagaj-modelu: BEZ AKTYWNEJ WERSJI MODELU TEN SILNIK NIE HANDLUJE.
  # `active_model` przy braku modelu cofa sie do zalozen poczatkowych i handluje
  # dalej - dla silnika, ktory dopiero rusza, znaczyloby to krzywa kapitalu
  # mierzaca heurystyke i wygladajaca jak wynik modelu. Model powstaje pierwszy
  # (`trainerCron.equity`), handel drugi. Crypto tej flagi nie dostaje swiadomie:
  # ma aktywny model i chodzi tak od miesiecy.
  #
  # --egzekucja gielda --mode demo: tak samo jak crypto. Konto paper Alpaki jest
  # odseparowane, a bez prawdziwych zlecen poslizg i ulamek wypelnienia zostaja
  # ZALOZENIEM - tym samym, ktore na krypto kosztowalo cala zmierzona przewage.
  #
  # POZA SESJA CYKL JEST PUSTY, A PULS BIJE (services/engine/sesja.py). Stan
  # sesji pochodzi z `/v2/clock` Alpaki, czyli od tej samej gieldy, ktora przyjmie
  # albo odrzuci zlecenie - nie z wlasnego kalendarza, ktory moglby sie z nia
  # rozjechac. Zegar nieodpowiadajacy NIE jest otwarciem: cykl konczy sie wtedy
  # bledem i po pieciu pod rzad proces sie konczy, zeby restart byl WIDOCZNY.
  #
  # ============================================================================
  # TA PETLA ZOSTAJE WLACZONA - decyzja 2026-09-26, rozwazana i odrzucona
  # ============================================================================
  #
  # Rozwazano jej zatrzymanie i trzeba zapisac, dlaczego NIE, bo argument za
  # byl mocny, dopoki nie naprawiono czegos innego.
  #
  # NAJPIERW FAKT, KTORY LATWO POMYLIC: `engine-equity` NIE JEST POTOKIEM DANYCH.
  # Nie zbiera niczego. Dane zbieraja cztery inne workery - `market-equity`
  # (swiece 1m), `history-equity` (1h, okno 3 dni), `features-equity` (cechy)
  # i `kapital-equity` (krzywa kapitalu z ksiag Alpaki). Zatrzymanie tej petli
  # NIE DOTYKA ani jednego z nich, wiec NIE DOTYKA rowniez 2,5 roku historii
  # godzinowej (94 625 swiec od 2024-04) ani 723 147 policzonych wartosci cech.
  # Ta historia nie odtworzy sie sama: `history-equity` chodzi z `--days 3`,
  # czyli UTRZYMUJE okno, a nie poglebia je.
  #
  # ARGUMENT ZA ZATRZYMANIEM, KTORY OBOWIAZYWAL DO 2026-09-26: jedynym skutkiem
  # ubocznym tej petli przy pustym uniwersum i bramce modelu byl `seed_equity`
  # (loop.py, PRZED bramka `--wymagaj-modelu`), ktory dopisywal do serii
  # `equity/demo` punkt z `nav = 1.0` wpisanym na sztywno - obok punktow, ktore
  # do tej samej serii pisze `kapital-equity` z ksiag Alpaki. Zasiane 1.0
  # zostawalo szczytem NA ZAWSZE (`max(nav)` bez ograniczenia czasowego), czyli
  # lamalo `max_drawdown` trwale, a dla `engine='equity'` nie ma procesu
  # zdolnego zwolnic kill-switcha.
  #
  # DLACZEGO TEN ARGUMENT JUZ NIE OBOWIAZUJE: przyczyna zostala usunieta
  # u zrodla. `seed_equity` nie zasiewa silnika, ktorego krzywa pisza ksiegi
  # (stan_kapitalu.KRZYWA_Z_KSIAG_GIELDY, migracja 0058). Zatrzymanie petli
  # bylo tanią ALTERNATYWA dla tej naprawy, a nie dodatkiem do niej.
  #
  # DLACZEGO NIE ZATRZYMUJEMY "NA WSZELKI WYPADEK": bramka `--wymagaj-modelu`
  # zostala SWIADOMIE postawiona PO `check_account` (commit 24443ed,
  # loop.py:1926-1930), zeby bezpiecznik mierzyl limity konta TAKZE bez modelu.
  # Czujka `--co ryzyko` zglosila brak tego pomiaru przy pierwszym cyklu silnika
  # equity. Zatrzymanie petli odwraca tamta decyzje i kasuje jedyny proces,
  # ktory dla equity zapisuje slad pomiaru limitow - a to NIE jest zamiana
  # ryzyka na brak ryzyka, tylko na brak widoku.
  #
  # CO TA PETLA ROBI DZIS, dokladnie: bije puls, mierzy limity konta na serii
  # `equity/demo` (juz jednorodnej) i konczy cykl na bramce modelu. Nie decyduje,
  # nie sklada zlecen, nie dotyka pozycji - uniwersum decyzyjne jest puste
  # (`tradeable = false` dla wszystkich spolek, migracja 0047) i nie ma aktywnej
  # wersji modelu.
  #
  # ODNOTOWANE, NIE NAPRAWIONE: `risk.POMIAR_STARY_PO_MIN` = 15 min dobrano dla
  # petli budzacej sie co 300 s ("trzy pominiete cykle"), a krzywa equity pisze
  # teraz `kapital-equity` co 900 s - jeden pominiety cykl wystarcza, zeby
  # pomiar byl "stary", czyli zeby `check_account` dal `block`. Dla toru bez
  # otwartych pozycji nie kosztuje to niczego, ale prog wieku pomiaru per silnik
  # (razem z brakiem dozorcy dla `engine='equity'`) jest osobna decyzja.
  engine-equity:
    enabled: true
    command: ["sh", "-c", "sleep 90; python services/engine/loop.py --engine equity --bar 1h --sprawdz && exec python services/engine/loop.py --engine equity --bar 1h --interval 300 --kind stock --limit --wymagaj-modelu --egzekucja gielda --mode demo"]
    resources:
      limits:   { cpu: 1000m, memory: 512Mi }
      requests: { cpu: 100m,  memory: 128Mi }

  # Trener walk-forward. Wlasny proces, bo trwa dziesiatki minut - uruchamiany
  # w podzie API ginal przy kazdym wdrozeniu razem z podem. Raz na dobe wystarczy:
  # okna przesuwaja sie o 30 dni, wiec czestsze przeliczanie nic nie wnosi, a
  # kusiloby do zagladania w wyniki i dobierania parametrow, czyli dokladnie tego,
  # przed czym ma chronic walk-forward.
  # WYLACZONY: zastapiony zadaniem cyklicznym (templates/trainer-cron.yaml).
  # Petla w Deploymencie ginela przy kazdym wdrozeniu, takze takim, ktore
  # trenera nie dotyczylo - patrz komentarz w tamtym pliku.
  #
  # TRENER NIE DOSTAJE WLASNEJ PETLI W SERWISIE, I NIE MA JEJ DOSTAC.
  #
  # Pozostale procesy tla przenioslyby petle z shella do modulu, bo maja chodzic
  # bez konca. Trening jest czym innym: trwa dziesiatki minut, chodzi raz na
  # dobe i MUSI dobiec konca niezaleznie od wdrozen. Wlasnie dlatego jest
  # CronJobem - `concurrencyPolicy: Forbid` pilnuje, zeby dwa treningi nie
  # policzyly sie rownolegle na tej samej wersji modelu, a raz uruchomione
  # zadanie przezywa restart Deploymentow. Petla `--interval 86400` w Deploymencie
  # odtworzylaby dokladnie usterke, ktora CronJob naprawil.
  #
  # Komenda ponizej zostaje POJEDYNCZYM przebiegiem, bez `while true` i bez
  # `|| true`: wpis jest martwy (enabled: false), a martwy wpis z zla petla
  # w srodku to zaproszenie do jej przywrocenia. Zrodlem prawdy o parametrach
  # treningu jest `trainerCron` nizej, nie ta linia.
  trainer:
    enabled: false
    command: ["python", "services/engine/train.py", "--bar", "4h", "--days", "1400", "--trials", "60"]
    resources:
      limits:   { cpu: 2000m, memory: 2Gi }
      requests: { cpu: 100m,  memory: 256Mi }

  # DOZORCA RYZYKA - nadzorca, ktory nie dzieli losu z nadzorowanym.
  #
  # Ocena limitow konta byla wolana WYLACZNIE w petli silnika, wiec gdy silnik
  # przestawal dzialac, przestawala tez dzialac ocena ryzyka. Nie chodzi
  # o awarie, po ktorej proces ginie - chodzi o proces, ktory ZYJE I NIC NIE
  # ROBI: zawieszony na zapytaniu, w petli po wyjatku. Pozycje zostaja otwarte,
  # kapital moze obsuwac sie dalej, a obsuniecia nikt nie liczy.
  #
  # Osobny pod, petla co 60 s. CronJob dalby najmniej 10 minut, a limit straty
  # dziennej 2% oceniany co 10 minut ma dziesieciominutowe okno slepoty.
  #
  # replicas i strategia: patrz templates/workers.yaml - dwie repliki oceniałyby
  # ten sam stan i moglyby zwolnic to samo zdarzenie dwukrotnie.
  dozorca:
    enabled: true
    # JEDYNY worker, ktory NIE chodzi rola silnika (migracja 0034). Nadzorca
    # zwalniajacy kill-switcha poswiadczeniami nadzorowanego nie jest nadzorca -
    # jest ta sama awaria o jeden poziom wyzej.
    dbRole: dozorca
    command: ["python", "services/engine/dozorca.py", "--engine", "crypto", "--mode", "demo"]
    resources:
      limits:   { cpu: 200m, memory: 256Mi }
      requests: { cpu: 20m,  memory: 64Mi }

  # DOZORCA RYZYKA TORU GIELDOWEGO - decyzja wlasciciela 2026-09-27.
  #
  # CO BYLO ZMIERZONE, ZANIM TO POWSTALO (produkcja 2026-09-27):
  #
  #   * `risk.limit_def`: SIEDEM wlaczonych limitow dla `equity/demo`, w tym
  #     wszystkie trzy, ktore koncza sie kill-switchem (max_daily_loss 2%,
  #     max_drawdown 10%, min_equity 95 000),
  #   * `risk.dozorca_heartbeat`: DOKLADNIE JEDEN wiersz,
  #     `dozorca-ryzyka:crypto:demo`,
  #   * `wznow()` - jedyna droga automatycznego zwolnienia kill-switcha - ma
  #     w calym repozytorium JEDNO miejsce wywolania: `dozorca.py`. `loop.py`
  #     nie zwalnia,
  #   * `ref.instrument`: 20 handlowalnych instrumentow equity (migracja 0060),
  #     a `risk.engine_heartbeat` ma zywy wiersz `equity`.
  #
  # Czyli: tor equity mial aktywne limity, zadnego niezaleznego oceniajacego
  # i NIKOGO, kto moglby zwolnic kill-switcha poza czlowiekiem w API
  # (`POST /api/risk/killswitch/{id}/release`). Dzis to nieszkodliwe, bo krzywa
  # equity jest plaska (nav 1,0 na 481 punktach) i `--wymagaj-modelu` wstrzymuje
  # handel - grozne od pierwszej transakcji, a szczyt `max(nav)` liczy sie BEZ
  # ograniczenia czasowego, wiec kill-switch z obsuniecia nie mija z doba.
  #
  # DWIE INSTANCJE NIE WCHODZA SOBIE W DROGE - sprawdzone, nie zalozone:
  #   * puls ma klucz `f"{NAZWA}:{engine}:{mode}"` (`dozorca.bij_heartbeat`),
  #     wiec to DWA wiersze, nie dwa zapisy do jednego,
  #   * kazde zapytanie `RiskKernel` i `wznow()` filtruje po `engine` i `mode`,
  #   * `risk.limit_usage` ma rytm trzymany przez BAZE (`NOT EXISTS`, nie licznik
  #     w pamieci procesu) i osobne `limit_def_id` per silnik,
  #   * `wznowienie.DZIENNIK` jest stanem PROCESU, a to osobny pod.
  # Pilnuje tego tests/test_dozorca_dwa_tory.py.
  #
  # ZASOBY TE SAME CO WYZEJ, BO ZMIERZONE NA TYM SAMYM KODZIE. `kubectl top`
  # 2026-09-27: `trader-dozorca` 0m CPU, 30Mi pamieci przy limicie 256Mi. Ten
  # pod robi to samo co tamten, a na torze bez otwartych pozycji mniej, wiec
  # dobranie mu WIEKSZYCH limitow byloby zapasem bez pomiaru.
  dozorca-equity:
    enabled: true
    # Ta sama waska rola co dozorca krypto (migracja 0034). Nadania nie zaleza
    # od silnika - nie ma tu RLS ani wierszy per tor - wiec `trader_dozorca`
    # wystarcza dla equity bez ani jednego nowego GRANT-u. Sprawdzone na bazie
    # z migracjami: tests/test_dozorca_dwa_tory.py, sekcja ROLA.
    dbRole: dozorca
    command: ["python", "services/engine/dozorca.py", "--engine", "equity", "--mode", "demo"]
    resources:
      limits:   { cpu: 200m, memory: 256Mi }
      requests: { cpu: 20m,  memory: 64Mi }

  # Skaner wiadomosci. Bez klucza Anthropic konczy sie natychmiast z komunikatem -
  # dlatego wlaczony dopiero wtedy, gdy klucz jest w bazie.
  news:
    enabled: true
    # Nie chodzi rola silnika (migracja 0052). Rola silnika ma SELECT na
    # app.api_credential, a ten pod dostaje SECRETS_KEY - razem daly klucz
    # gieldy w jawnej postaci procesowi, ktory parsuje cudzy XML.
    dbRole: news
    # --auto: z kluczem analizuje, bez klucza SAM POBIERA artykuly.
    #
    # Bez tego proces konczyl sie komunikatem o braku klucza, zanim zdazyl
    # dotknac RSS-a. Dziesiec kanalow bylo skonfigurowanych od poczatku projektu
    # i ani razu nieodpytanych, a artykul zapisuje sie dopiero PO analizie - wiec
    # kazda doba bez klucza to newsy bezpowrotnie stracone. Kanal RSS nie odda
    # jutro tego, czego dzis nie pobralismy.
    #
    # Tryb wybierany jest przy KAZDYM cyklu, nie raz przy starcie: klucz pojawia
    # sie wtedy, gdy uzytkownik wpisze go w UI, a nie gdy restartujemy poda.
    # --silniki crypto,equity: od 2026-09-22 pobieramy TAKZE kanaly gieldowe.
    #
    # Wczesniej byl tu sam `crypto`, bo silnik equity nie istnial, a jego kanaly
    # to polowa ruchu (225 z 476 artykulow na dwie doby, glownie zgloszenia 8-K)
    # - krypto placiloby za filtrowanie materialu, ktory go nie dotyczy. Teraz
    # equity ma konto, instrumenty i dane rynkowe, a RSS NIE ODDA JUTRO tego,
    # czego dzis nie pobierzemy: bez tych kanalow silnik equity wystartuje bez
    # ani jednego artykulu w historii i cecha `news_sent` zacznie sie od zera
    # w dniu uruchomienia.
    # Cena jest policzona, nie zgadnieta: dedup po `content_hash` (migracja 0044)
    # sprawia, ze triaz placi za artykul RAZ - 22.09 to 38 wywolan na dobe przy
    # 80 artykulach krypto. Kanaly gieldowe dodaja rzedu 110 artykulow/dobe,
    # czyli ~150 wywolan triazu lacznie - nadal ulamek darmowego progu Gemini.
    # Waskim gardlem jest ANALIZA (model `flash`, ~6 wywolan/dobe na progu
    # darmowym), wiec czesc materialu poczeka na analize - ale poczeka ZAPISANA.
    # Petla w serwisie, bez `|| true` - patrz komentarz przy silniku.
    #
    # `--quiet` WROCILO, ale znaczy juz co innego. Wczesniej wyciszalo takze
    # opisy bledow i cykl raportowal "bledow 11" bez ani jednego slowa o tym,
    # czym byly. Teraz opisy bledow ida ZAWSZE, poza tym przelacznikiem, a
    # `--quiet` wycisza wylacznie rutynowy postep - w tym uzasadnienie odsiania
    # kazdego pojedynczego artykulu, ktorego bywa kilkadziesiat na cykl.
    command: ["sh", "-c", "exec python services/ingest/news_worker.py --auto --quiet --silniki crypto,equity --interval 300"]
    resources:
      limits:   { cpu: 1000m, memory: 512Mi }
      requests: { cpu: 50m,   memory: 128Mi }

# STREFA CZASOWA WSZYSTKICH CronJobow - Europe/Warsaw, wpisana JAWNIE (2026-10-03).
#
# Bez pola `timeZone` harmonogram liczy sie w strefie kube-controller-managera,
# czyli na tym k3s w strefie HOSTA - zmierzone 2026-09-12 (komentarz przy
# `backup` nizej): 01:17Z = 03:17 CEST. Godziny w tym pliku od poczatku byly
# wiec lokalne, a ich znaczenie zalezalo od tego, jak ktos skonfigurowal VPS.
# Zmiana strefy hosta albo migracja na inny wezel przesunelaby CALE okno nocne
# bez jednej zmiany w repozytorium.
#
# DLACZEGO WARSZAWA, A NIE UTC:
#   * to jest DOKLADNIE dzisiejsze zachowanie - wpisanie strefy niczego nie
#     przesuwa na produkcji, tylko przestaje zalezec od hosta. UTC przesunelo
#     by wszystkie zadania o 1-2 h w dniu wdrozenia, a kolejnosc kopia ->
#     trener -> proba -> post-mortem jest ustawiona na odstepy w minutach,
#   * WSZYSTKIE CronJoby dostaja te sama strefe, wiec zmiana czasu przesuwa je
#     RAZEM i odstepy miedzy nimi (np. trener 04:40 -> post-mortem 07:50)
#     zostaja stale. Rozjazd o godzine przy DST bierze sie z MIESZANIA stref,
#     nie z wyboru jednej,
#   * okno nocne ma byc nocne dla czlowieka, ktory czyta powiadomienia.
# CZEGO TO NIE DOTYKA: swiece, cechy i decyzje liczone sa w UTC w kodzie
# i strefa harmonogramu nie wchodzi do zadnego obliczenia.
# CENA: noc zmiany czasu. 25.10 godzina 02:00-03:00 wystepuje dwa razy,
# a w marcu 02:00-03:00 nie ma - zadne zadanie tego chartu nie stoi w tym
# oknie (najwczesniejsze dobowe to kopia o 03:17); zadania co N godzin
# (`kurs`, `instrumenty`) moga w te noce wypasc raz wiecej albo raz mniej.
# Pole `timeZone` wymaga Kubernetesa 1.27+ (k3s 1.27+).
strefaCzasowa: "Europe/Warsaw"

# Kopia zapasowa bazy. Zrzut trafia na dysk hosta, poza wolumen bazy danych.
backup:
  enabled: true
  # GODZINY SA LOKALNE (Europe/Warsaw), NIE UTC — zmierzone, nie zalozone.
  #
  # CronJob bez pola `timeZone` liczy harmonogram w strefie procesu
  # kube-controller-managera, a na tym klastrze k3s jest to strefa hosta.
  # `lastScheduleTime` dla tego zadania to 2026-09-12T01:17:00Z, czyli 03:17
  # CEST. Tak samo trener (02:40Z = 04:40) i proba kill-switcha (03:20Z = 05:20).
  #
  # Do 2026-09-12 stalo w tych trzech liniach "UTC" i bylo to nieprawda.
  # Zachowanie bylo poprawne od poczatku — okno nocne miało byc lokalne — wiec
  # NIE MA TU NIC DO NAPRAWIENIA POZA TYM ZDANIEM. Blad nie objawial sie
  # awaria: objawial sie tym, ze ktos porownywal `lastScheduleTime` z godzina
  # z tego pliku i widzial dwie godziny roznicy, ktorej nie umial wytlumaczyc.
  # Od 2026-10-03 ta strefa jest wpisana jawnie (`strefaCzasowa` wyzej), wiec
  # nie zalezy juz od konfiguracji hosta.
  schedule: "17 3 * * *"        # codziennie 03:17 czasu lokalnego, poza szczytem zapytań
  retentionDays: 14
  hostPath: /opt/trader-backups

# Czujka zywotnosci silnikow. Osobny proces, bo martwy proces nie zglosi
# wlasnej smierci. Przy progu 15 minut i przebiegu co 10 awaria jest zgloszona
# najpozniej po 25 minutach.
zywotnoscCron:
  enabled: true
  schedule: "*/10 * * * *"

# Odswiezanie statusu instrumentow u gieldy (delisting, zawieszenie handlu).
#
# Osobne zadanie, bo ZAPISUJE do `ref.instrument` i musi chodzic na roli
# z prawem zapisu - czujka zywotnosci chodzi na roli tylko do odczytu.
# Co szesc godzin, bo prog czujki to 26 h: przy przebiegu dobowym jedna
# nieudana proba od razu przekracza prog i budzi czlowieka.
instrumentyCron:
  enabled: true
  schedule: "7 */6 * * *"
  mode: demo

# Proba pozarowa kill-switcha. Doprowadza do PRAWDZIWEGO zadzialania i sprawdza
# caly lancuch: zadanie -> wiersz w bazie -> wstrzymanie wejsc -> powiadomienie.
#
# CODZIENNIE, nie raz w tygodniu. Cena to kilkanascie minut wstrzymanych wejsc
# na dobe - przy sredniej ekspozycji 1,3% i 2,6 pozycji naraz to jest ulamek
# jednego okna decyzyjnego (swieca 4h). Zysk: o awarii bezpiecznika dowiadujemy
# sie nastepnego dnia, a nie po tygodniu.
#
# Godzina dobrana tak, zeby nie kolidowac z trenerem (04:40) ani z kopia (03:17).
probaCron:
  enabled: true
  schedule: "20 5 * * *"        # codziennie 05:20 czasu lokalnego, po treningu i kopii

# Trener walk-forward. Zadanie cykliczne, nie proces w Deploymencie - dlugie
# obliczenia nie moga ginac przy wdrozeniach.
trainerCron:
  enabled: true
  schedule: "40 4 * * *"        # codziennie 04:40 czasu lokalnego, po kopii zapasowej
  bar: "4h"
  days: 1400
  # SPREAD LICZY SIE Z BAZY, NIE STOI TUTAJ.
  #
  # Do 2026-09-27 bylo tu `spreadBps: 5.85` i `spreadObcaKsiega: true`. Liczba
  # byla POMIAREM z 2026-09-25, ale nikt nie zapisal zapytania, ktore ja dalo -
  # nie dalo sie jej ani odtworzyc, ani zauwazyc, ze zgnila. A zgnije sama:
  # uniwersum decyzyjne zmienia sie migracja (10 par USDC zamiast 24 USDT),
  # plynnosc i cennik gieldy zmieniaja sie bez zadnej migracji.
  #
  # Od 2026-09-27 `services/engine/train.py` liczy spread SAM, z cechy
  # `book_spread_bps`, na TYM SAMYM uniwersum (`active AND tradeable`) i w TYM
  # SAMYM oknie (`--days`), ktore trenuje - patrz `services/engine/spread.py`.
  # Ta sama sciezka obsluguje oba silniki, wiec tor equity nie potrzebuje juz
  # osobnego klucza i nie dostanie liczby z krypto (uzasadnienie nizej).
  #
  # Pomiar sam ustawia tez "obca ksiega": wie, czy okno siega przed 2026-09-24
  # (arkusz z hosta globalnego) i czy wszystkie instrumenty byly `tradeable`.
  # Flaga wpisana rekami twierdzilaby to samo, tylko bez sprawdzenia.
  #
  # OBA KLUCZE ZOSTAJA JAKO AWARYJNE NADPISANIE i sa celowo ZAKOMENTOWANE.
  # Odkomentowanie `spreadBps` WYLACZA pomiar z bazy dla toru crypto i podstawia
  # podana liczbe - sluzy do policzenia wariantu ("ile wynosi przewaga przy
  # spreadzie dwa razy szerszym"), nie do codziennego przebiegu. Wtedy trzeba
  # tez rozstrzygnac `spreadObcaKsiega` recznie, bo o liczbie podanej z zewnatrz
  # pomiar nie wie nic.
  #
  # ZMIERZONE 2026-09-27 na uniwersum decyzyjnym crypto (10 par USDC, 4h, 1370
  # swiec): srednia 8,62 pb na runde, mediana 4,46 pb, q3 9,59 pb, p90 22,98 pb.
  # Trener bierze SREDNIA, bo koszt placi kazda transakcja, a nie kazda swieca -
  # mediana zanizylaby runde o czynnik 1,93. Rozklad wypisuje sie w logu
  # przebiegu, wiec kolejna migawka w tym pliku nie jest do niczego potrzebna.
  # spreadBps: <tylko wariant; domyslnie pomiar z bazy>
  # spreadObcaKsiega: true
  trials: 60
  # Cennik podmiotu UNIJNEGO - tam stoi konto (patrz migracja 0018). Taker
  # kosztuje tam 0,250% zamiast 0,100%, wiec runda zleceniem rynkowym rosnie
  # z 0,280% do 0,580%. Przy tej stawce mediana Sharpe schodzi ponizej zera:
  # zlecenia rynkowe na tej gieldzie nie maja sensu, zostaje egzekucja
  # z limitem, gdzie stawka maker jest identyczna jak globalnie. Pomiar
  # w docs/03.
  kind: "spot_eu"
  limit: true
  # DWA TORY, NIE JEDEN PRZEBIEG POWTARZANY CZESCIEJ.
  #
  # Czestszy trening tego samego horyzontu nie dodaje informacji: okna przesuwaja
  # sie o 30 dni, a szesc nowych swiec to 3,3% ostatniego okna i ~0,08% wplywu na
  # mediane z 39 okien - przy zmierzonym szumie dobowym rzedu 10 punktow
  # procentowych. Dodaje za to konfiguracji do licznika hipotez, ktory wchodzi do
  # deflated Sharpe.
  #
  # Drugi HORYZONT to co innego: liczy inna informacje, ma wlasny model, wlasny
  # licznik hipotez i wlasny stan nauki (0025). Okna 1h przesuwaja sie o 14 dni,
  # wiec ten tor zyskuje nowe okno testowe dwa razy czesciej niz 4h.
  #
  # Silnik handluje wylacznie horyzontem domyslnym; 1h jest torem porownawczym
  # i nie podnosi alarmu.
  horyzonty: ["4h", "1h"]
  # TOR EQUITY - OSOBNY SILNIK, OSOBNY MODEL, OSOBNY CENNIK.
  #
  # Petla decyzyjna equity (`workers.engine-equity`) chodzi z `--wymagaj-modelu`,
  # wiec BEZ tego toru nie zlozy ani jednego zlecenia i bedzie to mowic w logu
  # przy kazdym cyklu. To jest zaleznosc w te strone celowo: model powstaje
  # pierwszy, handel drugi.
  #
  # TYLKO 1h. Powod jest ten sam, dla ktorego `workers.features-equity` liczy
  # wylacznie 1h: sesja trwa 6,5 godziny, wiec swieca 4h nie dzieli jej na rowne
  # czesci i agregat sklada swiece o roznej liczbie notowan pod jedna nazwa.
  # Horyzont, ktorego nie liczy potok cech, trener kalibrowalby na pustce.
  #
  # `kind: stock` - cennik Alpaki, czyli zero prowizji (services/engine/koszty.py).
  # Liczby w docs/08 dla equity (23,1% okien dodatnich) powstaly przy cenniku
  # BYBITA, bo innego wtedy nie bylo - mierzyly oplaty, ktorych to konto nie
  # placi. Po tej zmianie tor equity liczy sie wlasnym rachunkiem i tamte liczby
  # nie sa juz jego opisem.
  # TOR EQUITY WSTRZYMANY (2026-10-03, decyzja wlasciciela po audycie Fable,
  # R9): bez treningu nie ma aktywnego modelu, a silnik equity chodzi z
  # `--wymagaj-modelu`, wiec nie sklada zadnych zlecen (puls bije dalej).
  # Egzekucja papierowa NIE nadaje sie do wstrzymania - adapter papierowy nie
  # ma zegara sesji Alpaki i petla equity sie wywraca (a99a966).
  # Powrot: `enabled: true` po decyzji stop/go z planu naprawy.
  equity:
    enabled: false
    horyzonty: ["1h"]
    kind: "stock"
    limit: true
    # SPREAD DLA AKCJI: DANE SA, POMIARU NADAL NIE MA - I DLATEGO GO TU NIE MA.
    #
    # Sprawdzone 2026-09-27: `book_spread_bps` ISTNIEJE dla equity - 560 swiec
    # 1h, 20 spolek uniwersum, 2026-09-22..2026-09-25 (cztery sesje; 26.09 to
    # sobota). `history-equity --depth 1` zbiera wiec arkusz, jak zapowiadano.
    #
    # Te wartosci NIE SA JEDNAK SPREADEM, KTORY BYSMY ZAPLACILI. Mediana po
    # spolkach to 41 pb, a dla JNJ 479 pb, czyli 4,8% ceny. Zrodlem jest
    # `/v2/stocks/quotes/latest` z feedu IEX (`services/exchanges/alpaca.py`) -
    # JEDNEJ gieldy z kilkunastu - a zlecenie Alpaca kieruje na caly rynek.
    #
    # Dowod, ze to artefakt, nie rynek, nie wymaga zadnej wiedzy o cenniku:
    # w 257 z 560 przypadkow kwotowany spread jest SZERSZY niz caly zakres
    # high-low tej samej swiecy, a mediana ilorazu to 0,84. Kwotowanie
    # bracketuje kazda transakcje wydrukowana w tym oknie. Kontrola na crypto,
    # tym samym zapytaniem: mediana ilorazu 0,033, czyli 25x mniej.
    #
    # `services/engine/spread.py` odrzuca taki pomiar sam (bramka spojnosci,
    # prog 0,5) i wypisuje powod, wiec trener equity nadal konczy karte zdaniem
    # "razem CO NAJMNIEJ ... - bez niewypelnienie, spread, oplaty regulacyjne".
    # To jest ten sam UCZCIWY stan co wczesniej, tylko teraz wynika z pomiaru,
    # a nie z braku klucza w tym pliku.
    #
    # ZAMKNIE TO DOPIERO feed SIP (plan platny) albo kolumna oplat z `exec.fill`
    # po pierwszych sprzedazach equity na koncie paper. Do tego czasu klucz
    # zostaje ZAKOMENTOWANY - odkomentowany wylaczylby bramke spojnosci i wpisal
    # do karty liczbe, ktora zabija kazda strategie na artefakcie danych.
    # spreadBps: <tylko wariant; feed IEX NIE jest pomiarem naszego spreadu>
    # spreadObcaKsiega: true
  # Limity dobrane do ZMIERZONEGO zuzycia (388 MB przy pelnym przebiegu na
  # 24 instrumentach), nie do zapasu "na wszelki wypadek". Wezel ma 7,8 GB
  # i dzieli je z trzema innymi projektami; limit 3 GB dla zadania, ktore
  # bierze 0,4 GB, podnosil przeciazenie do 186% bez zadnego pozytku.
  resources:
    limits:   { cpu: 2000m, memory: 1Gi }
    requests: { cpu: 200m,  memory: 384Mi }

# DZIENNIK JAKOSCIOWY z zamknietych transakcji (learn.postmortem).
#
# Tabela istnieje od migracji 0006, typ zdarzenia `postmortem.ready` od 0011,
# a zakladka w panelu od poczatku - i do 2026-09-24 NIC nie zapisalo do niej
# ani jednego wiersza. To zadanie zamyka ten obieg: decyzja -> wynik -> wniosek.
#
# PO TRENERZE, NIE PRZED. Trener startuje 04:40 i konczy zwykle w ciagu godziny; dziennik czyta
# zamkniete pozycje, wiec nie zalezy od modelu, ale wspolne okno obciazenia
# wezla dwoch procesow po 0,5 CPU nie jest potrzebne nikomu.
#
# `dni` dotyczy WYLACZNIE pierwszego przebiegu. Kolejne licza okres od konca
# poprzedniego dziennika, wiec okresy nie zachodza na siebie, ta sama
# transakcja nie jest oceniana dwa razy, a przebieg opuszczony przez przestoj
# nadrabia sie sam.
postmortemCron:
  enabled: true
  # 07:50 Europe/Warsaw (`strefaCzasowa`). Do 2026-10-03 to zadanie jako jedyne
  # mialo `Etc/UTC` i "50 5" - czyli te sama godzine latem; zima przesuwalo sie
  # o godzine blizej trenera. Teraz zapas 3 h 10 min po starcie trenera (04:40)
  # jest staly przez caly rok.
  schedule: "50 7 * * *"
  # OBA SILNIKI. Silnik equity dopisze sie tu sam z chwila, gdy zacznie zamykac
  # pozycje; do tego czasu jego przebieg konczy sie linia "0 zamknietych
  # pozycji, prog to 5" i kodem zero - czyli cisza, ktora widac.
  silniki: ["crypto", "equity"]
  mode: "demo"
  dni: 7

# Kurs waluty odniesienia wlasciciela (market.fx_rate, migracja 0036).
#
# BEZ TEJ SEKCJI CALY CHART SIE NIE RENDERUJE. `kurs-cron.yaml` otwiera sie
# warunkiem `{{- if .Values.kursCron.enabled }}`, a brak klucza `kursCron` daje
# "nil pointer evaluating interface {}.enabled" - blad NIE tego jednego zadania,
# tylko calego release'u. ArgoCD nie zsynchronizuje wtedy NICZEGO i objawem jest
# "wdrozenie nie zmienia nic", a nie awaria. Sprawdzone 2026-09-10:
# `helm template t charts/trader` konczylo sie tym bledem.
#
# `enabled: true`, bo wylaczenie zadania jest gorsza z dwoch cichych awarii:
# `market.fx_rate` zostaje wtedy pusta, a druga krzywa kapitalu sklada sie
# z samych luk "nie przeliczono" - czyli mechanizm zbudowany i niewpiety,
# dokladnie to, przed czym ostrzega naglowek kurs-cron.yaml.
kursCron:
  enabled: true
  schedule: "13 */6 * * *"   # co 6 h, w minucie nieuzywanej przez inne zadania
  dni: 400                   # zapas ponad rok, zeby backfill mial z czego liczyc

# POMIARY ROZSTRZYGAJACE PRZEWAGE - zadania ZAWIESZONE, uruchamiane recznie.
#
# `enabled: true` nie znaczy "chodzi", tylko "istnieje w klastrze i da sie
# uruchomic jednym poleceniem". Oba CronJoby maja `suspend: true` i harmonogram
# ich nie odpala - patrz naglowek `templates/diagnostyka-cron.yaml`.
#
#     kubectl create job -n default --from=cronjob/trader-diagnostyka pomiar-1
#
# `false` wycofuje je z klastra; kod pomiarowy zostaje w obrazie, wiec nic nie
# ginie - znika tylko gotowe polecenie.
diagnostykaCron:
  enabled: true
  resources:
    limits:   { cpu: 2000m, memory: 2Gi }
    requests: { cpu: 200m,  memory: 512Mi }
