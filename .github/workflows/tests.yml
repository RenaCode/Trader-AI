name: testy
on:
  push: { branches: [main] }
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Testy reguł ryzyka i symulacji portfela nie potrzebują bazy ani sieci —
      # to czysta logika, więc mogą chodzić przy każdym pushu.
      - run: pip install -q -r services/api/requirements.txt -r requirements-dev.txt
      # -B wyłącza zapis bajtkodu. Bez tego mutacja pliku o niezmienionym
      # rozmiarze potrafi trafić w stary .pyc i dać wynik nie z tego kodu.
      - run: python -B -m pytest tests/ -v
