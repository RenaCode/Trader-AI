name: testy
on:
  pull_request:
  # WYWOLYWALNY Z INNEGO PRZEBIEGU.
  #
  # Do 2026-09-23 ten workflow zyl calkiem osobno: `docker-publish.yml` nie mial
  # go ani w `needs`, ani w zadnym warunku. Push na `main` z czerwonym `pytest`
  # budowal i wypychal obraz normalnie - jedynym hamulcem bylaby ochrona galezi
  # skonfigurowana POZA repozytorium, czyli zabezpieczenie, ktorego nie widac
  # w przegladzie zmian i ktorego nie da sie sprawdzic testem.
  #
  # `workflow_call` zamiast przeniesienia kroku `pytest` do tamtego pliku: krok
  # skopiowany rozjechalby sie z tym przy pierwszej zmianie wersji Pythona albo
  # listy zaleznosci, a rozjazd bylby widoczny dopiero wtedy, gdy jedna z dwoch
  # kopii przestanie cokolwiek sprawdzac.
  #
  # BEZ `push` NA `main` (audyt 2026-10-09, W-3). Do tego dnia push na `main`
  # puszczal ten workflow DWA razy: wlasnym wyzwalaczem i przez `workflow_call`
  # z `docker-publish.yml`, a kazdy przebieg mial drugi pelny `pytest` w kroku
  # pilnujacym pominietych - czyli 4 pelne przebiegi na commit. Od 01.10 dalo
  # to ok. 1046 rozliczanych minut z 2000 na miesiac (GitHub Free). Komentarz
  # sprzed tej zmiany bronil wlasnego `push` tym, ze "podwojny przebieg kosztuje
  # minute runnera" - kosztowal kilkanascie.
  #
  # Ryzyko "ktos wylaczy docker-publish i testy znikna z main" pilnuje test
  # (tests/test_publikacja_bramkowana_testami.py): `docker-publish.yml` MUSI
  # wolac ten plik z `push` na `main`, bez warunku. Reczne odpalenie:
  # `workflow_dispatch`.
  workflow_call: {}
  workflow_dispatch: {}
# Nowy push do tej samej galezi PR przerywa przebieg dla starego commita - jego
# wynik i tak nikogo juz nie obchodzi. Przy `workflow_call` (push na `main`)
# grupa to identyfikator przebiegu, czyli NIC nie jest przerywane: przerwany
# test na `main` zablokowalby `deploy` dla commita, ktory juz jest na `main`.
concurrency:
  group: testy-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
# Tylko odczyt - te joby wykonuja kod repozytorium i zaleznosci (U-10).
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    # LIMIT CZASU (2026-10-11): pelny przebieg trwa ~5 min, a zawieszony test SSO (petla TestClienta czekajaca na zadanie w tle) palil 4,5 h minut runnera bez slowa w logu - `tee` nie dostal ani linii.
    timeout-minutes: 20
    # BAZA W CI, BO 26 TESTOW NIGDY SIE NIE URUCHAMIALO.
    #
    # Do 2026-09-26 ten przebieg chodzil bez bazy, a komentarz nizej mowil, ze
    # testy "nie potrzebuja bazy ani sieci". Bylo to prawda o WIEKSZOSCI testow
    # i nieprawda o zestawie: 26 z nich ma `skipif` na `TEST_DB_URL`, wiec przy
    # kazdym przebiegu byly POMIJANE. Zmierzone tego dnia lokalnie: bez bazy
    # 2038 przeszlo i 26 pominieto, z baza 2064 przeszlo i 0 pominieto - czyli
    # wszystkie 26 dzialaja i wszystkie 26 milczaly.
    #
    # Dlaczego to nie byla drobnostka: te testy pytaja POSTGRESA o rzeczy,
    # ktorych atrapa kursora nie moze udowodnic, bo sama je odtwarza. Regula
    # szczytu krzywej kapitalu stoi na `IS NOT DISTINCT FROM`; po podmianie na
    # `=` wiersz z `zrodlo IS NULL` wypada z `FILTER`, szczyt idzie na wartosc
    # biezaca i obsuniecie wychodzi zanizone. Na atrapie ta podmiana NIE daje
    # ani jednego czerwonego testu. Na prawdziwej bazie daje - sprawdzone
    # kanarkiem 2026-09-26.
    #
    # Obraz JEST produkcyjny (`timescale/timescaledb-ha:pg17`, ten sam co
    # `charts/trader/values.yaml`), bo migracje wymagaja `timescaledb`, `vector`,
    # `citext` i `pgcrypto`. Zwykly `postgres:17` nie przejdzie migracji 0001.
    services:
      db:
        image: timescale/timescaledb-ha:pg17@sha256:a693dd7fbb75b51c3d717507a9956501686edb123b48dd90b094fd5612d53abe
        env:
          # Rola WLASCICIELA musi nazywac sie `trader`: migracje nadaja
          # `ALTER DEFAULT PRIVILEGES FOR ROLE trader`, wiec przy innej nazwie
          # 0034 pada na "role trader does not exist".
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: trader
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trader -d trader"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -q -r services/api/requirements.txt -r requirements-dev.txt
      # Migracje ida rola wlasciciela, tak jak kontener startowy `migrate`
      # w `charts/trader/templates/api.yaml`. Hasla rol procesow sa tu
      # nieustawione - migrator wypisuje o tym ostrzezenie i idzie dalej,
      # bo w CI nikt sie tymi rolami nie loguje.
      # LINT PRZED TESTAMI (audyt Fable U-15): reguly F/B/E9 z ruff.toml.
      # Pierwszy przebieg znalazl cztery testy zdefiniowane dwa razy - pierwsza
      # kopia nigdy sie nie wykonywala, a pytest tego nie zglasza.
      - run: ruff check .
      - run: python -B db/migrate.py
        env:
          DATABASE_URL: postgresql://trader:ci@localhost:5432/trader
      # -B wyłącza zapis bajtkodu. Bez tego mutacja pliku o niezmienionym
      # rozmiarze potrafi trafić w stary .pyc i dać wynik nie z tego kodu.
      #
      # TEST_DB_URL wlacza testy bazodanowe. Gdyby kiedys znowu zniknelo,
      # pytest nadal skonczy sie ZIELONO, tylko przestanie sprawdzac baze -
      # dlatego ten sam krok pada, jesli cokolwiek zostalo pominiete.
      #
      # CISZA WYGLADA IDENTYCZNIE JAK ZDROWIE. `pytest` z pominietymi testami
      # konczy sie kodem 0, wiec samo "zielono" nie dowodzi, ze baza byla
      # podlaczona. Do 2026-10-09 sprawdzal to osobny krok, ktory puszczal
      # CALY zestaw drugi raz (5 min runnera na kazdy przebieg). Teraz
      # sprawdzana jest linia podsumowania TEGO przebiegu.
      #
      # `pipefail` jest tu warunkiem, nie ozdoba: bez niego kod wyjscia potoku
      # to kod `tee`, czyli 0 - i czerwony pytest dalby zielony krok.
      - name: pytest (zaden test nie moze byc pominiety)
        shell: bash
        run: |
          set -o pipefail
          python -B -m pytest tests/ -v | tee /tmp/wynik.txt
          if tail -n 5 /tmp/wynik.txt | grep -qE "[0-9]+ skipped"; then
            echo "::error::Testy zostaly POMINIETE - baza nie byla podlaczona:"
            tail -n 5 /tmp/wynik.txt | grep -E "[0-9]+ skipped"
            exit 1
          fi
        env:
          TEST_DB_URL: postgresql://trader:ci@localhost:5432/trader
