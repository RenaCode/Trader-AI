name: Build and publish Docker images

# Buduje obrazy api i web, wypycha do ghcr.io, a nastepnie aktualizuje tagi w
# charts/trader/values.yaml. Na koniec przesuwa galaz `deploy` na commit, ktorego
# obrazy istnieja - ArgoCD na VPS sledzi `deploy` (NIE `main`) i sam synchronizuje
# klaster. Nie ma tu kroku SSH ani deployu, bo to GitOps.
#
# Filtr sciezek sprawia, ze zmiana wylacznie we froncie nie przebudowuje API i odwrotnie.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

# TYLKO ODCZYT GLOBALNIE (audyt Fable U-10, 2026-10-03). Zapis dostaja wylacznie
# `build` (obrazy do GHCR) i `update-git` (commit z tagami) - joby, ktore
# wykonuja kod repozytorium i jego zaleznosci (testy, smoke), nie moga pchnac
# commita ani podmienic obrazu. Pilnuje tests/test_ci_uprawnienia.py.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # Te same sciezki, z ktorych powstaje obraz (COPY w Dockerfile) -
            # `galaz_deploy.py` porownuje kod commita z kodem obrazu na tej
            # samej liscie. Rozjazd pilnuje tests/test_galaz_deploy.py.
            api:
              - 'services/**'
              - 'db/**'
              - 'scripts/**'
              - 'docker/api.Dockerfile'
              # Zmiana samego workflow MUSI go uruchomic.
              #
              # Bez tego wpisu edycja definicji CI nie jest przez CI sprawdzana:
              # przebieg konczy sie zielono, bo wszystkie joby sa pomijane przez
              # filtr sciezek. Tak wlasnie przezyl 11 dni krok wolajacy usuniety
              # plik - a takze poprawka tego kroku, ktora sama nie zostala
              # zweryfikowana i wymagala recznego workflow_dispatch.
              - '.github/workflows/docker-publish.yml'
            web:
              - 'web/**'
              - 'docker/web.Dockerfile'
              - 'docker/nginx.conf'
              - 'docker/naglowki-bezpieczenstwa.conf'

  # Migracje sa niemutowalne z zalozenia (runner sprawdza sumy kontrolne).
  # Ten job wykrywa edycje zastosowanego pliku ZANIM trafi na produkcje, gdzie
  # initContainer i tak by sie wywalil i zablokowal deploy.
  verify-migrations:
    name: Weryfikacja migracji
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_DB: trader
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trader -d trader"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install "psycopg[binary]>=3.2"
      - name: Zastosuj migracje od zera
        env:
          DATABASE_URL: postgresql://trader:ci_test@localhost:5432/trader
        run: python db/migrate.py
      - name: Ponowny przebieg musi byc no-opem (idempotencja)
        env:
          DATABASE_URL: postgresql://trader:ci_test@localhost:5432/trader
        run: |
          out=$(python db/migrate.py)
          echo "$out"
          echo "$out" | grep -q "Baza aktualna" || { echo "::error::Drugi przebieg nie byl no-opem"; exit 1; }

  # Test dymny calej aplikacji na swiezo postawionym stosie. Powstal dlatego, ze
  # trzy regresje interfejsu (bialy ekran po zalogowaniu, wykresy na 1/3 szerokosci,
  # rozciagniety tekst osi) przeszly przez `npm run build` bez ostrzezenia - build
  # sprawdza, czy kod sie kompiluje, nie czy cokolwiek widac.
  smoke:
    name: Test dymny (Playwright)
    needs: changes
    if: |
      needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_DB: trader
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trader -d trader"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://trader:ci_test@localhost:5432/trader
      # Klucz wylacznie na czas testu - nie szyfruje nim niczego trwalego.
      SECRETS_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      TEST_LOGIN: admin
      TEST_PASSWORD: ci-smoke-test-haslo-12345
      CORS_ORIGINS: http://localhost:4173
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Zaleznosci API
        run: pip install -r services/api/requirements.txt

      # Nazwa bez "danych testowych": danych demonstracyjnych w tym projekcie
      # nie ma i nie bedzie. services/seed_demo.py zostal usuniety 2026-08-27
      # razem z decyzja, ze system pracuje wylacznie na realnych swiecach - ale
      # ten krok wolal go dalej. Python konczyl sie wtedy kodem 2 ("nie moge
      # otworzyc pliku"), krok padal, a TEST DYMNY NIE URUCHAMIAL SIE WCALE.
      #
      # Trwalo to 11 dni i 145 commitow. Przebiegi "chore: obraz sha-*" byly
      # zielone, bo zmieniaja tylko chart i sa pomijane przez filtr sciezek -
      # wiec z listy przebiegow wygladalo to na CI, ktore czasem pada.
      #
      # Test dymny sprawdza renderowanie, logowanie i skale wykresow; danych
      # rynkowych do tego nie potrzebuje. Migracje zasiewaja to, co konieczne:
      # gieldy, instrumenty, limity ryzyka i kanaly RSS (0008_seed.sql).
      - name: Migracje i konto testowe
        run: |
          python db/migrate.py
          printf '%s' "$TEST_PASSWORD" | python scripts/create_admin.py "$TEST_LOGIN" --stdin

      - name: Start API
        run: |
          nohup uvicorn services.api.main:app --host 127.0.0.1 --port 8099 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/api/health && break || sleep 2
          done

      - name: Build i serwowanie frontu
        working-directory: ./web
        run: |
          npm ci
          npm run build
          # `vite preview` serwuje produkcyjny build - testujemy to, co pojdzie
          # na serwer, a nie wersje deweloperska z innym bundlem.
          nohup npx vite preview --port 4173 --strictPort > /tmp/web.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:4173/ >/dev/null && break || sleep 2
          done

      - name: Playwright
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Test dymny
        env:
          BASE_URL: http://localhost:4173
        run: node tests/smoke.spec.mjs

      - name: Logi przy niepowodzeniu
        if: failure()
        run: |
          echo '--- api ---'; tail -50 /tmp/api.log || true
          echo '--- web ---'; tail -30 /tmp/web.log || true

  # TESTY JEDNOSTKOWE JAKO BRAMKA PUBLIKACJI.
  #
  # Do 2026-09-23 `pytest` zyl wylacznie w osobnym workflow `testy`, ktory nie
  # byl ani zaleznoscia, ani warunkiem zadnego joba w tym pliku. Push na `main`
  # z czerwonym pakietem testow budowal i wypychal obraz normalnie. Jedynym
  # hamulcem bylaby ochrona galezi skonfigurowana poza repozytorium - czyli
  # zabezpieczenie, ktorego nie widac w przegladzie zmian.
  #
  # BEZ `if`, czyli takze wtedy, gdy filtr sciezek nie widzi zmian w `services/`
  # ani w `web/`. Pakiet testow czyta w tym projekcie takze charty
  # (`test_chart_nadzor.py`) i zrodla frontu (`test_killswitch.py` siega do
  # `web/src/components/Risk.jsx`), wiec "nic sie nie zmienilo w kodzie" nie
  # znaczy "nie ma czego sprawdzac". Job pominiety przez filtr nie bramkuje
  # niczego, a wyglada w przegladzie tak samo jak job, ktory przeszedl.
  testy:
    name: Testy jednostkowe
    uses: ./.github/workflows/tests.yml

  build:
    name: Build ${{ matrix.name }}
    permissions:
      contents: read
      packages: write
    needs: [changes, verify-migrations, smoke, testy]
    if: |
      always() &&
      needs.testy.result == 'success' &&
      (needs.verify-migrations.result == 'success' || needs.verify-migrations.result == 'skipped') &&
      (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/api.Dockerfile
            image: trader-ai-api
          - name: web
            dockerfile: docker/web.Dockerfile
            image: trader-ai-web
    steps:
      - uses: actions/checkout@v5

      - name: Czy ten obraz wymaga przebudowy
        id: need
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=true" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.name }}" = "api" ]; then echo "go=${{ needs.changes.outputs.api }}" >> $GITHUB_OUTPUT
          else echo "go=${{ needs.changes.outputs.web }}" >> $GITHUB_OUTPUT; fi

      - if: steps.need.outputs.go == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.need.outputs.go == 'true'
        uses: docker/setup-buildx-action@v4

      - if: steps.need.outputs.go == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build i push rozdzielone: blad kompilacji nie dociera do rejestru.
      - if: steps.need.outputs.go == 'true'
        name: Build (bez push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - if: steps.need.outputs.go == 'true'
        name: Push do ghcr.io
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}

  # OSTATNIE OGNIWO CD: obraz zbudowany wyzej staje sie obrazem produkcji.
  #
  # WLACZONY 2026-09-24, po utworzeniu sekretu `ghcr-pull` i sprawdzeniu NA
  # KLASTRZE, ze pobranie z ghcr naprawde dziala (pod testowy z
  # `imagePullPolicy: Always`). Kolejnosc byla tu warunkiem, nie ostroznoscia:
  # ten krok wskazuje produkcje na obraz istniejacy WYLACZNIE w prywatnym
  # rejestrze, wiec wlaczony przed sekretem daje ImagePullBackOff przy
  # pierwszym pushu kodu.
  #
  # CO TO ZASTAPILO: `scripts/build-on-vps.sh` - budowanie na serwerze i import
  # wprost do containerd, z recznym podbiciem tagu po kazdym wdrozeniu. Kazdy
  # commit byl przez to budowany dwa razy (tu i na VPS), a obraz produkcji
  # powstawal na maszynie, ktorej nikt nie odtwarza z pliku.
  #
  # DLACZEGO KOMMIT BOTA NIE ZAPETLA CI: `[skip ci]` w tresci. Gdyby zniknelo,
  # kazde wdrozenie wywolywaloby nastepne - bez zmiany tresci, wiec i bez konca.
  update-git:
    name: Aktualizacja tagow w values.yaml
    permissions:
      contents: write
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.DEPLOY_PAT || secrets.GITHUB_TOKEN }}
      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Podbij tagi obrazow
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Retry z fetch+reset: rownolegly bieg tego samego workflow moze przesunac
          # main w miedzyczasie, a zmiana jest idempotentna.
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main

            # TAG NIE COFA SIE. Gdy nowszy commit zmienil kod tego obrazu,
            # podbicie na NASZ sha wskazaloby obraz starszy niz kod w `main`
            # (a jego przebieg moglby juz podbic tag na swoj). Podbije go
            # przebieg tamtego commita.
            if [ "${{ needs.changes.outputs.api }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if git diff --quiet "${{ github.sha }}" HEAD -- services db scripts docker/api.Dockerfile; then
                sed -i '/^api:/,/tag:/ { s|tag: .*|tag: "sha-${{ steps.vars.outputs.sha_short }}"| }' charts/trader/values.yaml
              else echo "api: nowszy commit zmienil kod - tag podbije jego przebieg"; fi
            fi
            if [ "${{ needs.changes.outputs.web }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if git diff --quiet "${{ github.sha }}" HEAD -- web docker/web.Dockerfile docker/nginx.conf docker/naglowki-bezpieczenstwa.conf; then
                sed -i '/^web:/,/tag:/ { s|tag: .*|tag: "sha-${{ steps.vars.outputs.sha_short }}"| }' charts/trader/values.yaml
              else echo "web: nowszy commit zmienil kod - tag podbije jego przebieg"; fi
            fi

            git add charts/trader/values.yaml
            if git diff --cached --quiet; then echo "Tagi juz aktualne."; break; fi
            git commit -m "chore: obrazy sha-${{ steps.vars.outputs.sha_short }} [skip ci]"
            if git push; then echo "Wypchnieto (proba $attempt/5)."; break; fi
            [ "$attempt" = "5" ] && { echo "::error::Push nieudany po 5 probach"; exit 1; }
            sleep $(( (RANDOM % 5) + 1 ))
          done

  # GALAZ `deploy` - TO JA SLEDZI ARGO CD, NIE `main` (2026-10-04).
  #
  # Na HEAD `main` chart wyprzedza obraz: commit z kodem i chartem laduje od
  # razu, a tag obrazu dopiero po buildzie, osobnym commitem bota. 04.10
  # 05:50-06:03 UTC silnik lezal w BackOff, bo chart z 6c9f28d podal flage
  # `--strategia momentum` obrazowi sprzed niej. `deploy` dostaje wylacznie
  # commity, w ktorych kazdy obraz zbudowano z kodu tego commita - regula
  # i uzasadnienie w .github/skrypty/galaz_deploy.py.
  #
  # BEZ FILTRA SCIEZEK. Commit samego chartu albo dokumentacji nie buduje
  # niczego, ale do `deploy` dojsc musi - inaczej zmiana chartu nie
  # wdrozylaby sie do nastepnego commita kodu. Dlatego `always()`: build
  # i podbicie pominiete przez filtr sa tu w porzadku, nieudane - nie.
  # Testy jednostkowe MUSZA przejsc (pilnuja m.in., ze flagi z chartu
  # przyjmuje parser kodu z tego commita - tests/test_chart_flagi_cli.py).
  deploy:
    name: Galaz deploy
    permissions:
      contents: write
      packages: read
    needs: [changes, verify-migrations, smoke, testy, build, update-git]
    if: |
      always() &&
      needs.testy.result == 'success' &&
      (needs.verify-migrations.result == 'success' || needs.verify-migrations.result == 'skipped') &&
      (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.update-git.result == 'success' || needs.update-git.result == 'skipped')
    runs-on: ubuntu-latest
    # Czekanie na podbicie tagu z rownoleglego przebiegu: patrz LIMIT_CZEKANIA_S.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_PAT || secrets.GITHUB_TOKEN }}
      - name: Przesun deploy na commit z istniejacymi obrazami
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/skrypty/galaz_deploy.py --zweryfikowany "${{ github.sha }}"
